<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Recruit — Quản lý tuyển dụng</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#2f5bea;--brand-dark:#2347c4;--brand-soft:#eaf0ff;
  --ink:#172033;--ink2:#4b566b;--ink3:#8591a5;
  --bg:#f4f6fa;--card:#fff;--line:#e5e9f0;--line2:#d3dae6;
  --ok:#0f9d6c;--ok-soft:#e3f6ee;--warn:#c47a06;--warn-soft:#fdf1da;--bad:#d6393b;--bad-soft:#fde9e9;--info:#0b86c4;--info-soft:#e1f2fb;--vio:#7c4fe0;--vio-soft:#efe9fd;
  --r:12px;--sh:0 1px 2px rgba(23,32,51,.05),0 4px 14px rgba(23,32,51,.05);
}
body{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.top-in{max-width:1380px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:28px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.2px;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#2f5bea,#6b8bff);display:grid;place-items:center;color:#fff}
.logo svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;border:0;background:none;color:var(--ink2);cursor:pointer;font-weight:500;white-space:nowrap;position:relative}
.tab:hover{background:var(--bg);color:var(--ink)}
.tab.on{background:var(--brand-soft);color:var(--brand)}
.tab .cnt{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-weight:600}
.who{display:flex;align-items:center;gap:10px}
.who select{border:1px solid var(--line2);border-radius:9px;padding:6px 8px;background:#fff;max-width:230px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

main{max-width:1380px;margin:0 auto;padding:24px 20px 60px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px;letter-spacing:-.3px}
.page-h p{color:var(--ink3);margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ui bits */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dark)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f2c4c5}
.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg)}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-gray{background:#eceff4;color:var(--ink2)}
.muted{color:var(--ink3)}.small{font-size:12.5px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=time],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.13)}
textarea{resize:vertical;min-height:80px}
input.err,select.err,textarea.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(214,57,59,.12)}
.search{position:relative;min-width:240px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{padding-left:33px}
.seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;display:flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .n{font-size:11px;background:#d9dfea;border-radius:99px;padding:0 6px;line-height:17px}
.seg button.on .n{background:var(--brand-soft);color:var(--brand)}
.seg .n.red{background:var(--bad);color:#fff}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f8faff}
.tbl-wrap{overflow-x:auto}
.empty{padding:50px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.5}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center}
.stat .ic svg{width:20px;height:20px}
.stat b{font-size:24px;display:block;line-height:1.1;letter-spacing:-.5px}
.stat span{color:var(--ink3);font-size:13px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.bar-row .l{width:96px;font-size:13px;color:var(--ink2)}
.bar{flex:1;height:10px;background:#edf0f6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13.5px}
.alert.warn{background:var(--warn-soft);color:#7d4c00}.alert.bad{background:var(--bad-soft);color:#9b2022}.alert.info{background:var(--info-soft);color:#075f8c}.alert.ok{background:var(--ok-soft);color:#0a6f4b}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:#e9edf4;border-radius:var(--r);padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--brand);background:var(--brand-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 6px 10px}
.dot{width:9px;height:9px;border-radius:50%}
.col-h .n{margin-left:auto;background:#fff;border-radius:99px;font-size:12px;padding:0 8px;line-height:20px;color:var(--ink2)}
.kc{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(23,32,51,.08);border:1px solid transparent}
.kc:hover{border-color:var(--brand)}
.kc.drag{opacity:.4}
.kc b{display:block}
.kc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:91;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dr-h{background:#fff;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dr-b{padding:20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.5)}
.modal-wrap.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,100%)}
.m-h{padding:16px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.m-b{padding:20px 22px;overflow-y:auto}
.m-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbfd;border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
label.f i{color:var(--bad);font-style:normal}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--ink3)}
.kv dd{word-break:break-word;white-space:pre-wrap}
.sec{padding:16px 18px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sec-h h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl div{position:relative;padding-bottom:12px;font-size:13px}
.tl div:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.round{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fcfdff}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef1f7;border-radius:99px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:13px}
.chip button{border:0;background:#d9dfea;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;font-size:12px}
.chip.ph{padding:4px 11px;cursor:pointer;background:var(--brand-soft);color:var(--brand);border:0;font-family:monospace;font-size:12px}
.side{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}
@media(max-width:800px){.side{grid-template-columns:1fr}}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
@media(max-width:800px){.snav{flex-direction:row;overflow-x:auto;position:static}}
.snav button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.snav button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
.snav button:hover:not(.on){background:#e9edf4}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lib-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.lib-card h4{font-size:15px}
.lib-card .pv{color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.lib-card .ft{margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.chk{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.letter{white-space:pre-wrap;line-height:1.6}
@media(max-width:760px){.top-in{flex-wrap:wrap;height:auto;gap:8px 12px;padding:10px 16px}.who{margin-left:auto}.tabs{order:3;flex:1 0 100%}.brand span{display:none}}
@media print{.top,.drawer,.ov{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="logo" id="logo"></div><span>HR Recruit</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who"><div class="avatar" id="av"></div><select id="whoSel" title="Chuyển người dùng (demo phân quyền)"></select></div>
</div></header>
<main id="app"></main>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal-wrap" id="mw"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const dayMs=864e5;
const iso=(off=0)=>new Date(Date.now()+off*dayMs).toISOString().slice(0,10);
const fmtD=d=>d?new Date(d).toLocaleDateString('vi-VN'):'—';
const fmtDT=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const daysSince=t=>Math.floor((Date.now()-new Date(t).getTime())/dayMs);
const initials=n=>(n||'?').trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();
const IC={
 plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.2 2.4 3.5 5.2"/>',
 upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',download:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
 home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',print:'<path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/>',
 up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3M3 13h18"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${IC[n]||''}</svg>`;
function toast(m,t=''){const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),3200)}

/* file store (IndexedDB) */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('hr_recruit_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbOp=async(mode,fn)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})};
const fput=(id,b)=>idbOp('readwrite',s=>s.put(b,id));
const fget=id=>idbOp('readonly',s=>s.get(id));
const fdel=id=>idbOp('readwrite',s=>s.delete(id));
async function storeFile(file){const id=uid('f_');await fput(id,file);return{id,name:file.name,size:file.size,type:file.type,at:Date.now()}}
async function openFile(meta,dl){const b=await fget(meta.id);if(!b){toast('Không tìm thấy tệp trên trình duyệt này','err');return}
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.target='_blank';if(dl)a.download=meta.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function pickFile(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';if(accept)i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click()})}
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB';

/* ============ constants ============ */
const STAGES=[['new','Mới nhận','#64748b'],['screening','Sơ vấn','#0b86c4'],['interview','Phỏng vấn','#7c4fe0'],['offer','Thư mời','#c47a06'],['hired','Đã nhận việc','#0f9d6c'],['rejected','Loại','#d6393b']];
const STG=Object.fromEntries(STAGES.map(s=>[s[0],s]));
const CAPS=[
 ['req.create','Tạo đề xuất tuyển dụng'],['req.all','Xem đề xuất của mọi phòng ban'],['req.approve','Phê duyệt / từ chối đề xuất (Ban TGĐ)'],

/* ============ generic form ============ */
function optsFor(f,vals){
  if(f.from==='blocks')return DB.cfg.blocks.map(x=>[x,x]);
  if(f.from==='depts')return DB.cfg.depts.filter(d=>!vals.block||d.block===vals.block).map(d=>[d.name,d.name]);
  if(f.from==='sources')return DB.cfg.sources.map(x=>[x,x]);
  if(f.from==='positions')return DB.lib.positions.filter(p=>!vals.block||p.block===vals.block).map(p=>[p.name,p.name]);
  if(f.from==='requests')return DB.reqs.filter(r=>r.status==='approved'||r.id===vals.reqId).map(r=>[r.id,`${r.code} · ${r.v.position} (${r.v.dept})`]);
  return(f.opts||[]).map(x=>[x,x]);
}
function fieldHTML(f,vals){
  const v=vals[f.k]??'';const id='ff_'+f.k;const rq=f.req?' <i>*</i>':'';
  let inp;
  if(f.t==='textarea')inp=`<textarea id="${id}" data-k="${f.k}">${esc(v)}</textarea>`;
  else if(f.t==='select'){inp=`<select id="${id}" data-k="${f.k}"><option value="">— Chọn —</option>${optsFor(f,vals).map(o=>`<option value="${esc(o[0])}" ${o[0]==v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`}
  else if(f.t==='combo')inp=`<input type="text" id="${id}" data-k="${f.k}" value="${esc(v)}" list="dl_${f.k}" autocomplete="off"><datalist id="dl_${f.k}">${optsFor(f,vals).map(o=>`<option value="${esc(o[0])}">`).join('')}</datalist>`;
  else inp=`<input type="${f.t}" id="${id}" data-k="${f.k}" value="${esc(v)}" ${f.t==='number'?'min="0" step="any"':''}>`;
  return`<div class="${f.wide||f.t==='textarea'?'wide':''}"><label class="f" for="${id}">${esc(f.l)}${rq}</label>${inp}</div>`;
}
const formHTML=(fields,vals)=>`<div class="fgrid">${fields.filter(f=>f.vis!==0&&f.vis!==false).map(f=>fieldHTML(f,vals)).join('')}</div>`;
function readForm(root,fields){
  const out={};let ok=true;
  fields.forEach(f=>{const el=$(`[data-k="${f.k}"]`,root);if(!el)return;let val=el.value.trim();if(f.t==='number'&&val!=='')val=Number(val);out[f.k]=val;
    const bad=f.req&&(val===''||val==null);el.classList.toggle('err',bad);if(bad)ok=false});
  if(!ok)toast('Vui lòng nhập các trường bắt buộc (*)','err');
  return ok?out:null;
}
function bindForm(root,fields){
  const b=$('[data-k="block"]',root),d=$('[data-k="dept"]',root),p=$('[data-k="position"]',root);
  if(!b)return;
  b.onchange=()=>{const vals={block:b.value};

    if(p){const dl=$('#dl_position');if(dl)dl.innerHTML=optsFor({from:'positions'},vals).map(o=>`<option value="${esc(o[0])}">`).join('')}};

function cfgBody(){
  const C=DB.cfg;
  if(ui.cf==='general')return`<div class="card pad"><div class="fgrid"><div class="wide"><label class="f">Tên công ty / đơn vị (dùng trong thư & phiếu in)</label><input type="text" data-cfg="company" value="${esc(C.company)}"></div>

  if(ui.cf==='lists'){
    const chips=(key,arr)=>`<div>${arr.map((x,i)=>`<span class="chip">${esc(x)}<button data-act="delItem" data-id="${key}" data-arg="${i}">×</button></span>`).join('')}</div><div class="row" style="margin-top:8px"><input type="text" id="add_${key}" placeholder="Thêm mới…" style="max-width:280px"><button class="btn" data-act="addItem" data-id="${key}">${ic('plus')}Thêm</button></div>`;
    return`<div class="card pad"><h3 style="margin-bottom:10px">Khối</h3>${chips('blocks',C.blocks)}</div>
    <div class="card pad" style="margin-top:14px"><h3 style="margin-bottom:10px">Phòng ban / Bộ phận</h3>
      ${C.blocks.map(b=>`<div style="margin-bottom:8px"><b class="small muted">${esc(b)}</b><div>${C.depts.map((d,i)=>d.block===b?`<span class="chip">${esc(d.name)}<button data-act="delDept" data-id="${i}">×</button></span>`:'').join('')||'<span class="muted small">Chưa có</span>'}</div></div>`).join('')}
      <div class="row" style="margin-top:8px"><input type="text" id="add_dept" placeholder="Tên phòng ban" style="max-width:240px"><select id="add_deptb" style="width:auto">${C.blocks.map(b=>`<option>${esc(b)}</option>`).join('')}</select><button class="btn" data-act="addDept">${ic('plus')}Thêm</button></div></div>

  }
  if(ui.cf==='reqf'||ui.cf==='candf'){
    const key=ui.cf==='reqf'?'reqFields':'candFields';const fs=C[key];
    return`<div class="card"><div class="card-h"><span>${ui.cf==='reqf'?'Trường của biểu mẫu Đề xuất':'Trường của hồ sơ Ứng viên'}</span><button class="btn pri sm" data-act="addField" data-id="${key}">${ic('plus')}Thêm trường</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Tên trường</th><th>Kiểu</th><th>Bắt buộc</th><th>Hiển thị</th><th></th></tr></thead><tbody>${fs.map((f,i)=>`<tr><td><b>${esc(f.l)}</b>${f.lock?' <span class="muted small">(hệ thống)</span>':''}${f.t==='select'&&f.opts?`<div class="muted small">${esc(f.opts.join(' · '))}</div>`:''}</td><td class="small">${esc((FTYPES.find(t=>t[0]===f.t)||[0,f.from?'Danh mục':f.t])[1])}</td>
      <td><input type="checkbox" class="chk" ${f.req?'checked':''} ${f.lock?'disabled':''} data-act="fieldToggle" data-id="${key}" data-arg="${i}:req"></td>
      <td><input type="checkbox" class="chk" ${f.vis!==0&&f.vis!==false?'checked':''} ${f.lock?'disabled':''} data-act="fieldToggle" data-id="${key}" data-arg="${i}:vis"></td>
      <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-act="fieldMove" data-id="${key}" data-arg="${i}:-1">${ic('up')}</button><button class="btn ghost sm" data-act="fieldMove" data-id="${key}" data-arg="${i}:1">${ic('down')}</button>${f.custom?`<button class="btn ghost sm" data-act="fieldEdit" data-id="${key}" data-arg="${i}">${ic('edit')}</button><button class="btn ghost sm" data-act="fieldDel" data-id="${key}" data-arg="${i}">${ic('trash')}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if(ui.cf==='users')return`<div class="card"><div class="card-h"><span>Người dùng</span><button class="btn pri sm" data-act="userEdit" data-id="">${ic('plus')}Thêm người dùng</button></div><div class="tbl-wrap"><table><thead><tr><th>Họ tên</th><th>Chức danh</th><th>Phòng ban</th><th>Vai trò</th><th></th></tr></thead><tbody>${C.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.title)}</td><td>${esc(u.dept)}</td><td>${badge(roleOf(u).name,'b-info')}</td><td style="text-align:right"><button class="btn ghost sm" data-act="userEdit" data-id="${u.id}">${ic('edit')}</button><button class="btn ghost sm" data-act="userDel" data-id="${u.id}">${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div></div>
    <p class="muted small" style="margin-top:10px">Mẹo: dùng ô chọn người dùng ở góc trên bên phải để xem giao diện theo từng vai trò.</p>`;
  if(ui.cf==='perm')return`<div class="card"><div class="card-h"><span>Ma trận phân quyền</span><button class="btn sm" data-act="roleAdd">${ic('plus')}Thêm vai trò</button></div><div class="tbl-wrap"><table><thead><tr><th>Quyền</th>${C.roles.map(r=>`<th style="text-align:center">${esc(r.name)}${!r.locked?` <button class="btn ghost sm" data-act="roleDel" data-id="${r.id}" style="padding:0 4px">${ic('x')}</button>`:''}</th>`).join('')}</tr></thead><tbody>${CAPS.map(c=>`<tr><td>${esc(c[1])}</td>${C.roles.map(r=>`<td style="text-align:center"><input type="checkbox" class="chk" ${r.locked||r.caps.includes(c[0])?'checked':''} ${r.locked?'disabled':''} data-act="capToggle" data-id="${r.id}" data-arg="${c[0]}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
    <div class="alert info" style="margin-top:14px">${ic('alert')}<div>Vai trò mặc định: <b>Người đề xuất</b> (chỉ thấy đề xuất của mình), <b>Nhân viên tuyển dụng</b>, <b>Ban Tổng giám đốc</b> (phê duyệt), <b>Quản trị</b> (toàn quyền, không chỉnh sửa được).</div></div>`;
  return`<div class="card pad"><div class="row"><button class="btn" data-act="exportData">${ic('download')}Xuất sao lưu (JSON)</button><button class="btn" data-act="importData">${ic('upload')}Nhập sao lưu</button><button class="btn bad" data-act="resetDemo">Khôi phục dữ liệu mẫu</button><button class="btn bad" data-act="clearAll">Xoá toàn bộ dữ liệu</button></div>
    <p class="muted small" style="margin-top:14px">Dữ liệu hiện được lưu ngay trên trình duyệt này (tệp đính kèm lưu trong IndexedDB). File sao lưu JSON không bao gồm tệp đính kèm. Để dùng chung nhiều người, cần gắn thêm máy chủ lưu trữ.</p></div>`;
}
function fieldModal(key,i){
  const f=i==null?{l:'',t:'text',custom:1,vis:1,req:0}:DB.cfg[key][i];
  modal({title:i==null?'Thêm trường mới':'Sửa trường',html:`<div class="fgrid"><div class="wide"><label class="f">Tên trường <i>*</i></label><input type="text" id="nf_l" value="${esc(f.l)}"></div>
    <div><label class="f">Kiểu dữ liệu</label><select id="nf_t">${FTYPES.map(t=>`<option value="${t[0]}" ${f.t===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div>
    <div><label class="f">Bắt buộc</label><select id="nf_r"><option value="0">Không</option><option value="1" ${f.req?'selected':''}>Có</option></select></div>
    <div class="wide"><label class="f">Các lựa chọn (mỗi dòng một giá trị – chỉ dùng cho kiểu "Danh sách chọn")</label><textarea id="nf_o">${esc((f.opts||[]).join('\n'))}</textarea></div></div>`,
    buttons:[modalCancel,{label:'Lưu',cls:'pri',icon:'check',fn:()=>{const l=$('#nf_l').value.trim();if(!l){$('#nf_l').classList.add('err');return false}
      const t=$('#nf_t').value;const o=$('#nf_o').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const nf={...f,l,t,req:$('#nf_r').value==='1'?1:0,opts:t==='select'?o:undefined,k:f.k||uid('c_'),custom:1,vis:1};
      if(t==='select'&&!o.length){toast('Vui lòng nhập các lựa chọn','err');return false}
      if(i==null)DB.cfg[key].push(nf);else DB.cfg[key][i]=nf;commit()}}]});
}

/* ============ actions ============ */
const A={
 tab:id=>{ui.tab=id;closeDrawer();render()},
 mclose:()=>closeModal(),
 mbtn:id=>{const b=modalBtns[id];if(b.fn()!==false)closeModal()},
 dclose:()=>closeDrawer(),
 gomiss:()=>{ui.tab='req';ui.rf='missing';render()},
 rf:id=>{ui.rf=id;render()},
 cview:id=>{ui.cv=id;render()},
 lt:id=>{ui.lt=id;ui.lq='';render()},
 tplType:id=>{ui.tplType=id;render()},
 cf:id=>{ui.cf=id;render()},
 /* requests */
 newReq:()=>reqForm(),
 editReq:id=>reqForm(reqById(id)),
 openReq:id=>openDrawer(reqDrawer(id)),
 printReq:id=>printReq(reqById(id)),
 exportMiss:()=>exportMiss(),
 approve:id=>{const r=reqById(id);r.status='approved';r.approvedAt=Date.now();r.approvedBy=me().name;log(r,'Ban TGĐ phê duyệt');commit();toast('Đã phê duyệt. Cần tải lên bản scan đã ký.','ok')},
 reject:id=>{const r=reqById(id);modal({title:'Từ chối đề xuất',html:`<label class="f">Lý do từ chối</label><textarea id="rj"></textarea>`,buttons:[modalCancel,{label:'Từ chối',cls:'bad',fn:()=>{r.status='rejected';r.rejectReason=$('#rj').value.trim();log(r,'Từ chối'+(r.rejectReason?': '+r.rejectReason:''));commit()}}]})},
 delReq:id=>confirmBox('Xoá đề xuất này? Hành động không thể hoàn tác.',()=>{DB.reqs=DB.reqs.filter(r=>r.id!==id);DB.cands.forEach(c=>{if(c.v.reqId===id)c.v.reqId=''});closeDrawer();commit()},'Xoá'),
 uploadSigned:async id=>{const r=reqById(id);const f=await pickFile('.pdf,image/*');if(!f)return;
   if(f.size>15*1048576){toast('Tệp quá lớn (tối đa 15MB)','err');return}
   try{if(r.signed&&!r.signed.demo)await fdel(r.signed.id);r.signed=await storeFile(f);log(r,'Tải lên bản scan đã ký: '+f.name);commit();toast('Đã lưu bản scan đã ký','ok')}catch(e){toast('Không lưu được tệp','err')}},
 viewSigned:id=>openFile(reqById(id).signed),
 /* candidates */
 newCand:()=>candModal(),
 editCand:id=>candModal(DB.cands.find(c=>c.id===id)),
 openCand:id=>openDrawer(candDrawer(id)),
 delCand:id=>confirmBox('Xoá ứng viên này?',()=>{DB.cands=DB.cands.filter(c=>c.id!==id);closeDrawer();commit()},'Xoá'),
 setStage:(id,el)=>{const c=DB.cands.find(x=>x.id===id),s=el.dataset.arg;if(c.stage===s)return;c.stage=s;log(c,'Chuyển giai đoạn → '+STG[s][1]);commit()},
 editScreen:id=>{const c=DB.cands.find(x=>x.id===id);mini('Ghi nhận sơ vấn',[{k:'date',l:'Ngày sơ vấn',t:'date'},{k:'by',l:'Người thực hiện',t:'text'},selF('result','Kết quả',R_SCREEN,1),{k:'note',l:'Nhận xét',t:'textarea',wide:1}],c.screening||{date:iso(),by:me().name,result:'Chờ'},v=>{c.screening=v;log(c,'Cập nhật sơ vấn: '+v.result);if(c.stage==='new')c.stage='screening'})},
 addRound:id=>{const c=DB.cands.find(x=>x.id===id);roundModal(c)},
 editRound:(id,el)=>{const c=DB.cands.find(x=>x.id===id);roundModal(c,c.interviews.find(i=>i.id===el.dataset.arg))},
 delRound:(id,el)=>{const c=DB.cands.find(x=>x.id===id);c.interviews=c.interviews.filter(i=>i.id!==el.dataset.arg);log(c,'Xoá một vòng phỏng vấn');commit()},
 editOffer:id=>{const c=DB.cands.find(x=>x.id===id);mini('Thư mời tuyển dụng',[selF('status','Trạng thái',R_OFFER),{k:'salary',l:'Mức lương đề nghị',t:'text'},{k:'startDate',l:'Ngày nhận việc',t:'date'},{k:'deadline',l:'Hạn phản hồi',t:'date'},{k:'note',l:'Ghi chú',t:'textarea',wide:1}],c.offer||{status:'Chưa gửi'},v=>{c.offer=v;log(c,'Cập nhật offer: '+v.status);if(v.status==='Chấp nhận'&&c.stage!=='hired'){c.stage='hired';log(c,'Chuyển giai đoạn → Đã nhận việc')}else if(['new','screening','interview'].includes(c.stage))c.stage='offer'})},
 sendLetter:(id,el)=>letterModal(DB.cands.find(x=>x.id===id),DB.lib.templates.find(t=>t.id===el.dataset.arg)),
 /* library */
 newPos:()=>posModal(),editPos:id=>posModal(DB.lib.positions.find(p=>p.id===id)),
 viewPos:id=>{const p=DB.lib.positions.find(x=>x.id===id);modal({title:p.name,wide:true,html:`<div class="row" style="margin-bottom:12px">${badge(p.block,'b-info')}<span class="muted">${esc(p.dept)}</span></div><div class="letter">${esc(p.jd)}</div>`,buttons:[{label:'Đóng',fn:()=>{}}]})},
 delPos:id=>confirmBox('Xoá vị trí này khỏi thư viện?',()=>{DB.lib.positions=DB.lib.positions.filter(p=>p.id!==id);commit()},'Xoá'),
 newTpl:()=>tplModal(),editTpl:id=>tplModal(DB.lib.templates.find(t=>t.id===id)),
 viewTpl:id=>letterModal(null,DB.lib.templates.find(t=>t.id===id)),
 dupTpl:id=>{const t=DB.lib.templates.find(x=>x.id===id);DB.lib.templates.push({...t,id:uid('t_'),name:t.name+' (bản sao)'});commit();toast('Đã nhân bản','ok')},
 delTpl:id=>confirmBox('Xoá mẫu thư này?',()=>{DB.lib.templates=DB.lib.templates.filter(t=>t.id!==id);commit()},'Xoá'),
 insPh:id=>{const ta=$('#ff_body');const s=ta.selectionStart,t=`{{${id}}}`;ta.value=ta.value.slice(0,s)+t+ta.value.slice(ta.selectionEnd);ta.focus();ta.setSelectionRange(s+t.length,s+t.length)},
 newForm:async()=>{const f=await pickFile();if(!f)return;if(f.size>15*1048576){toast('Tệp quá lớn (tối đa 15MB)','err');return}
   const fields=[{k:'name',l:'Tên biểu mẫu',t:'text',req:1,wide:1},{k:'cat',l:'Nhóm',t:'select',opts:['Phiếu đánh giá phỏng vấn','Hồ sơ nhận việc','Hợp đồng','Quy trình','Khác']},{k:'desc',l:'Mô tả',t:'textarea',wide:1}];
   modal({title:'Thêm biểu mẫu',html:formHTML(fields,{name:f.name.replace(/\.[^.]+$/,''),cat:'Khác'}),buttons:[modalCancel,{label:'Lưu',cls:'pri',icon:'check',fn:()=>{const v=readForm($('#modal'),fields);if(!v)return false;storeFile(f).then(meta=>{DB.lib.forms.push({id:uid('fm_'),...v,file:meta});commit();toast('Đã thêm biểu mẫu','ok')}).catch(()=>toast('Không lưu được tệp','err'))}}]})},
 dlForm:id=>openFile(DB.lib.forms.find(f=>f.id===id).file,true),
 delForm:id=>confirmBox('Xoá biểu mẫu này?',async()=>{const f=DB.lib.forms.find(x=>x.id===id);try{await fdel(f.file.id)}catch(e){}DB.lib.forms=DB.lib.forms.filter(x=>x.id!==id);commit()},'Xoá'),
 /* settings */
 addItem:id=>{const i=$('#add_'+id);const v=i.value.trim();if(v&&!DB.cfg[id].includes(v)){DB.cfg[id].push(v);commit()}},
 delItem:(id,el)=>{DB.cfg[id].splice(+el.dataset.arg,1);commit()},
 addDept:()=>{const v=$('#add_dept').value.trim();if(v){DB.cfg.depts.push({name:v,block:$('#add_deptb').value});commit()}},
 delDept:id=>{DB.cfg.depts.splice(+id,1);commit()},
 addField:id=>fieldModal(id),
 fieldEdit:(id,el)=>fieldModal(id,+el.dataset.arg),
 fieldDel:(id,el)=>confirmBox('Xoá trường này? Dữ liệu đã nhập trong trường sẽ không còn hiển thị.',()=>{DB.cfg[id].splice(+el.dataset.arg,1);commit()},'Xoá'),
 fieldToggle:(id,el)=>{const[i,p]=el.dataset.arg.split(':');const f=DB.cfg[id][+i];f[p]=el.checked?1:0;if(p==='vis'&&!el.checked)f.req=0;commit()},
 fieldMove:(id,el)=>{const[i,d]=el.dataset.arg.split(':').map(Number);const a=DB.cfg[id];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];commit()},
 userEdit:id=>{const u=DB.cfg.users.find(x=>x.id===id)||{name:'',title:'',dept:'',roleId:DB.cfg.roles[0].id};
   modal({title:id?'Sửa người dùng':'Thêm người dùng',html:`<div class="fgrid"><div class="wide"><label class="f">Họ tên *</label><input type="text" id="us_n" value="${esc(u.name)}"></div><div><label class="f">Chức danh</label><input type="text" id="us_t" value="${esc(u.title)}"></div><div><label class="f">Phòng ban</label><select id="us_d"><option value="">—</option>${[...DB.cfg.depts.map(d=>d.name),'Ban TGĐ'].map(d=>`<option ${d===u.dept?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="wide"><label class="f">Vai trò</label><select id="us_r">${DB.cfg.roles.map(r=>`<option value="${r.id}" ${r.id===u.roleId?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div></div>`,
     buttons:[modalCancel,{label:'Lưu',cls:'pri',fn:()=>{const n=$('#us_n').value.trim();if(!n){$('#us_n').classList.add('err');return false}
       const o={name:n,title:$('#us_t').value,dept:$('#us_d').value,roleId:$('#us_r').value};if(id)Object.assign(u,o);else DB.cfg.users.push({id:uid('u'),...o});commit()}}]})},
 userDel:id=>{if(id===DB.me){toast('Không thể xoá người dùng đang đăng nhập','err');return}confirmBox('Xoá người dùng này?',()=>{DB.cfg.users=DB.cfg.users.filter(u=>u.id!==id);commit()},'Xoá')},
 capToggle:(id,el)=>{const r=DB.cfg.roles.find(x=>x.id===id),c=el.dataset.arg;r.caps=el.checked?[...new Set([...r.caps,c])]:r.caps.filter(x=>x!==c);save();renderShell()},
 roleAdd:()=>modal({title:'Thêm vai trò',html:`<label class="f">Tên vai trò</label><input type="text" id="rn">`,buttons:[modalCancel,{label:'Thêm',cls:'pri',fn:()=>{const n=$('#rn').value.trim();if(!n)return false;DB.cfg.roles.push({id:uid('role_'),name:n,caps:['lib.view']});commit()}}]}),
 roleDel:id=>{if(DB.cfg.users.some(u=>u.roleId===id)){toast('Vai trò đang được gán cho người dùng','err');return}DB.cfg.roles=DB.cfg.roles.filter(r=>r.id!==id);commit()},
 exportData:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='hr-recruit-backup-'+iso()+'.json';a.click()},
 importData:async()=>{const f=await pickFile('.json');if(!f)return;try{const d=JSON.parse(await f.text());if(!d.cfg||!d.reqs||!d.cands||!d.lib)throw 0;DB=d;commit();toast('Đã nhập dữ liệu','ok')}catch(e){toast('Tệp sao lưu không hợp lệ','err')}},
 resetDemo:()=>confirmBox('Khôi phục dữ liệu mẫu? Dữ liệu hiện tại sẽ bị thay thế.',()=>{DB=seed();commit()},'Khôi phục'),
 clearAll:()=>confirmBox('Xoá TOÀN BỘ đề xuất, ứng viên và thư viện (giữ thiết lập)?',()=>{DB.reqs=[];DB.cands=[];DB.lib={positions:[],templates:[],forms:[]};commit()},'Xoá hết')
};
function roundModal(c,i){
  const fields=[{k:'name',l:'Tên vòng',t:'text',req:1,wide:1},{k:'date',l:'Ngày',t:'date'},{k:'time',l:'Giờ',t:'time'},{k:'place',l:'Địa điểm / hình thức',t:'text',wide:1},{k:'who',l:'Người phỏng vấn',t:'text',wide:1},selF('result','Kết quả',R_IV),{k:'score',l:'Điểm (0–10)',t:'number'},{k:'note',l:'Nhận xét',t:'textarea',wide:1}];
  mini(i?'Sửa vòng phỏng vấn':'Thêm vòng phỏng vấn',fields,i||{name:'Vòng '+(c.interviews.length+1),result:'Chờ kết quả'},v=>{
    if(i)Object.assign(i,v);else c.interviews.push({id:uid('i_'),...v});
    log(c,`${i?'Cập nhật':'Thêm'} ${v.name}: ${v.result}`);if(['new','screening'].includes(c.stage)){c.stage='interview'}});
}

/* ============ events ============ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(el&&el.tagName==='INPUT')return;
  if(el){const f=A[el.dataset.act];if(f){ev.preventDefault();ev.stopPropagation();f(el.dataset.id,el,ev)}return}
  if(ev.target.id==='ov')closeDrawer();
  if(ev.target.id==='mw')closeModal();
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.tagName==='INPUT'&&el.dataset.act){A[el.dataset.act](el.dataset.id,el)}
  else if(el.dataset.cfg){const k=el.dataset.cfg;DB.cfg[k]=el.type==='number'?Number(el.value):el.value;save()}
  else if(el.dataset.bind&&el.tagName==='SELECT'){ui[el.dataset.bind]=el.value;render()}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.bind&&el.tagName==='INPUT'){ui[el.dataset.bind]=el.value;render()}});
$('#whoSel').onchange=e=>{DB.me=e.target.value;ui.tab=can('report.view')?'dash':(can('req.create')?'req':'lib');closeDrawer();save();render();toast('Đang xem với vai trò: '+roleOf(me()).name)};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#mw').classList.contains('on'))closeModal();else closeDrawer()}});
/* drag & drop kanban */
let dragId=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest?.('.kc');if(k){dragId=k.dataset.id;k.classList.add('drag');e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragend',e=>{$$('.kc.drag').forEach(k=>k.classList.remove('drag'));$$('.col.over').forEach(c=>c.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(c&&dragId){e.preventDefault();$$('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const col=e.target.closest?.('.col');if(!col||!dragId)return;e.preventDefault();const c=DB.cands.find(x=>x.id===dragId);const s=col.dataset.stage;
  if(c&&c.stage!==s&&can('cand.move')){c.stage=s;log(c,'Chuyển giai đoạn → '+STG[s][1]);commit()}});

render();
</script>
</body>
