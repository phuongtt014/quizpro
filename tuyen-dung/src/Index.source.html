<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Recruit — Quản lý tuyển dụng</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#5b47d6;--brand-dark:#4a38bd;--brand-soft:#eeecfc;
  --ink:#172033;--ink2:#4b566b;--ink3:#8591a5;
  --bg:#eef0fa;--card:#fff;--line:#e5e9f0;--line2:#d3dae6;
  --ok:#0f9d6c;--ok-soft:#e3f6ee;--warn:#c47a06;--warn-soft:#fdf1da;--bad:#d6393b;--bad-soft:#fde9e9;--info:#0b86c4;--info-soft:#e1f2fb;--vio:#7c4fe0;--vio-soft:#efe9fd;
  --r:12px;--sh:0 1px 2px rgba(23,32,51,.05),0 4px 14px rgba(23,32,51,.05);
}
body{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);min-height:100vh;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:flex;min-height:100vh}
.sb{width:250px;flex:none;background:linear-gradient(180deg,#5b47d6 0%,#4b39bd 100%);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:26px 16px 18px;overflow-y:auto}
.sb-user{text-align:center;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.25);margin-bottom:18px}
.sb-av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:28px;font-weight:700;letter-spacing:1px}
.sb-name{font-weight:700;font-size:17px}
.sb-role{font-size:13px;opacity:.8;margin-top:2px}
.sb-nav{display:flex;flex-direction:column;gap:6px}
.tab{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;border:0;background:none;color:rgba(255,255,255,.78);cursor:pointer;font-weight:600;font-size:14.5px;text-align:left}
.tab svg{width:19px;height:19px}
.tab:hover{background:rgba(255,255,255,.1);color:#fff}
.tab.on{background:rgba(255,255,255,.2);color:#fff;box-shadow:inset 3px 0 0 #fff}
.tab .cnt{margin-left:auto;background:#ff6b7a;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;min-width:19px;text-align:center;line-height:19px;font-weight:700}
.sb-foot{margin-top:auto;padding-top:18px;font-size:12.5px;display:flex;flex-direction:column;gap:10px}
.sb-foot label{opacity:.75;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
.sb-foot select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:7px 8px;width:100%}
.sb-foot select option{color:#172033}
.sb-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:9px;padding:7px;cursor:pointer;font-weight:600;display:flex;gap:6px;align-items:center;justify-content:center}
.sb-btn:hover{background:rgba(255,255,255,.24)}
.sync{display:flex;align-items:center;gap:7px;opacity:.92;line-height:1.3}
.sync i{width:8px;height:8px;border-radius:50%;background:#5ee0a0;flex:none}
.sync.busy i{background:#ffd166}.sync.err i{background:#ff6b7a}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
main{flex:1;min-width:0;max-width:1560px;padding:26px 28px 60px}
.page-h h1{color:var(--brand)}
.ro{opacity:.9}
.loading{display:grid;place-items:center;height:60vh;color:var(--ink3);gap:12px;text-align:center}
.spin{width:34px;height:34px;border:4px solid #dcd8f7;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* dashboard */
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 22px;cursor:pointer;font-weight:600;color:var(--ink)}
.pill.on{color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.kpi .t{color:var(--ink2);font-size:15px}
.kpi b{display:block;font-size:38px;line-height:1.15;letter-spacing:-1px;margin-top:2px}
.kpi small{color:var(--ink3);font-size:12px}
.ring{width:76px;height:76px;flex:none}
.dgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:1000px){.dgrid{grid-template-columns:1fr}}
.cc{padding:16px 18px;min-width:0}
.cc-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cc-h h3{font-size:16px;font-weight:600}
.mini-seg{display:flex;gap:6px;flex-wrap:wrap}
.mini-seg button{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink2)}
.mini-seg button.on{color:var(--brand);border-color:var(--brand);box-shadow:inset 0 -2px 0 var(--brand);font-weight:600}
.chart{width:100%;height:auto;display:block}
.hb{display:flex;align-items:center;gap:10px;margin:9px 0}
.hb-l{width:130px;text-align:right;color:var(--ink2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.hb-t{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.hb-t i{display:block;height:22px;background:var(--brand);border-radius:3px;min-width:3px}
.hb-t b{background:#eef0fa;border-radius:4px;padding:0 7px;font-size:13px;line-height:22px}
.donut-w{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;padding:6px 0}
.donut{width:190px;height:190px}
.lg div{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px;color:var(--ink2)}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}
.cb{position:relative;height:24px;min-width:90px}
.cb i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;opacity:.55}
.cb span{position:relative;display:block;text-align:right;padding-right:6px;line-height:24px;font-weight:500}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px;letter-spacing:-.3px}
.page-h p{color:var(--ink3);margin-top:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* ui bits */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-dark)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f2c4c5}
.btn.bad:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg)}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-vio{background:var(--vio-soft);color:var(--vio)}.b-gray{background:#eceff4;color:var(--ink2)}
.muted{color:var(--ink3)}.small{font-size:12.5px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=time],input[type=url],select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,91,234,.13)}
input[type=file]{width:100%;padding:7px;border:1px dashed var(--line2);border-radius:9px;background:#fafbff}
textarea{resize:vertical;min-height:80px}
input.err,select.err,textarea.err{border-color:var(--bad);box-shadow:0 0 0 3px rgba(214,57,59,.12)}
.search{position:relative;min-width:240px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{padding-left:33px}
.seg{display:inline-flex;background:#e9edf4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;display:flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg .n{font-size:11px;background:#d9dfea;border-radius:99px;padding:0 6px;line-height:17px}
.seg button.on .n{background:var(--brand-soft);color:var(--brand)}
.seg .n.red{background:var(--bad);color:#fff}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#f8faff}
.tbl-wrap{overflow-x:auto}
.empty{padding:50px 20px;text-align:center;color:var(--ink3)}
.empty svg{width:34px;height:34px;margin-bottom:8px;opacity:.5}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center}
.stat .ic svg{width:20px;height:20px}
.stat b{font-size:24px;display:block;line-height:1.1;letter-spacing:-.5px}
.stat span{color:var(--ink3);font-size:13px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar-row{display:flex;align-items:center;gap:12px;margin:10px 0}
.bar-row .l{width:96px;font-size:13px;color:var(--ink2)}
.bar{flex:1;height:10px;background:#edf0f6;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13.5px}
.alert.warn{background:var(--warn-soft);color:#7d4c00}.alert.bad{background:var(--bad-soft);color:#9b2022}.alert.info{background:var(--info-soft);color:#075f8c}.alert.ok{background:var(--ok-soft);color:#0a6f4b}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:#e9edf4;border-radius:var(--r);padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--brand);background:var(--brand-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;padding:4px 6px 10px}
.dot{width:9px;height:9px;border-radius:50%}
.col-h .n{margin-left:auto;background:#fff;border-radius:99px;font-size:12px;padding:0 8px;line-height:20px;color:var(--ink2)}
.kc{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(23,32,51,.08);border:1px solid transparent}
.kc:hover{border-color:var(--brand)}
.kc.drag{opacity:.4}
.kc b{display:block}
.kc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:90;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:91;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.on{transform:none}
.dr-h{background:#fff;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dr-b{padding:20px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,23,42,.5)}
.modal-wrap.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,100%)}
.m-h{padding:16px 22px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.m-b{padding:20px 22px;overflow-y:auto}
.m-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#fafbfd;border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
label.f i{color:var(--bad);font-style:normal}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:14px}
.kv dt{color:var(--ink3)}
.kv dd{word-break:break-word;white-space:pre-wrap}
.sec{padding:16px 18px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.sec-h h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl div{position:relative;padding-bottom:12px;font-size:13px}
.tl div:before{content:"";position:absolute;left:-22px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.round{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fcfdff}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef1f7;border-radius:99px;padding:4px 6px 4px 12px;margin:0 6px 6px 0;font-size:13px}
.chip button{border:0;background:#d9dfea;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;font-size:12px}
.chip.ph{padding:4px 11px;cursor:pointer;background:var(--brand-soft);color:var(--brand);border:0;font-family:monospace;font-size:12px}
.side{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}
@media(max-width:800px){.side{grid-template-columns:1fr}}
.snav{display:flex;flex-direction:column;gap:2px;position:sticky;top:80px}
@media(max-width:800px){.snav{flex-direction:row;overflow-x:auto;position:static}}
.snav button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap}
.snav button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
.snav button:hover:not(.on){background:#e9edf4}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.lib-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.lib-card h4{font-size:15px}
.lib-card .pv{color:var(--ink2);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.lib-card .ft{margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.chk{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.letter{white-space:pre-wrap;line-height:1.6}
@media(max-width:900px){.app{flex-direction:column}.sb{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:8px 12px}.sb-user{display:flex;align-items:center;gap:10px;border:0;margin:0;padding:0;text-align:left}.sb-av{width:38px;height:38px;font-size:14px;margin:0;border-width:2px}.sb-name{font-size:14px}.sb-role{display:none}.sb-nav{flex-direction:row;order:3;width:100%;overflow-x:auto}.tab{padding:9px 12px;white-space:nowrap}.sb-foot{margin:0 0 0 auto;padding:0;flex-direction:row;align-items:center}.sb-foot select{width:auto;max-width:150px}.sb-foot label,.sync span{display:none}main{padding:18px 14px 50px}}
@media print{.sb,.drawer,.ov{display:none}}
</style>
</head>
<body>
<script>
/* Chẩn đoán khởi động: chạy trước script chính */
window.__errs=[];
window.addEventListener('error',function(e){
  var c='';try{if(e.lineno&&window.__JS){var L=window.__JS.split('\n');c=' | dòng '+e.lineno+': '+L.slice(Math.max(0,e.lineno-2),e.lineno+1).map(function(x){return x.slice(0,160)}).join(' ⏎ ')}}catch(x){}
  window.__errs.push((e.message||'lỗi')+c);bootFail()});
function bootFail(){
  if(window.__HR_OK)return;var a=document.getElementById('app');if(!a)return;
  var m=window.__errs.length?'Lỗi: <code>'+window.__errs.join('; ').replace(/</g,'&lt;')+'</code>':'Script chính không chạy. Nguyên nhân thường gặp: file <b>Index</b> trong Apps Script bị dán <b>thiếu phần cuối</b> hoặc dán lẫn nội dung khác.';
  a.innerHTML='<div style="padding:30px;max-width:640px"><h2>Ứng dụng không khởi động được</h2><p style="margin:10px 0">'+m+'</p><p>Hãy xoá toàn bộ nội dung file Index, dán lại <b>đầy đủ</b> từ <code>&lt;!DOCTYPE html&gt;</code> đến <code>&lt;/html&gt;</code> (file gốc ~120.000 ký tự), lưu và triển khai phiên bản mới.</p></div>';
}
setTimeout(bootFail,3000);
</script>
<div class="app">
<aside class="sb">
  <div class="sb-user"><div class="sb-av" id="av"></div><div class="sb-name" id="sbName"></div><div class="sb-role" id="sbRole"></div></div>
  <nav class="sb-nav" id="tabs"></nav>
  <div class="sb-foot" id="sbFoot"></div>
</aside>
<main id="app"><div class="loading"><div><div class="spin"></div><p style="margin-top:12px">Đang khởi động ứng dụng…</p></div></div></main>
</div>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal-wrap" id="mw"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script id="main-js">
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const qa=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const dayMs=864e5;
const iso=(off=0)=>new Date(Date.now()+off*dayMs).toISOString().slice(0,10);
const fmtD=d=>d?new Date(d).toLocaleDateString('vi-VN'):'—';
const fmtDT=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const daysSince=t=>Math.floor((Date.now()-new Date(t).getTime())/dayMs);
const initials=n=>(n||'?').trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();
const IC={

const idb=new Promise((res,rej)=>{try{const r=indexedDB.open('hr_recruit_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});idb.catch(()=>{});
const idbOp=async(mode,fn)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('f',mode);const rq=fn(t.objectStore('f'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})};
const fput=(id,b)=>idbOp('readwrite',s=>s.put(b,id));
const fget=id=>idbOp('readonly',s=>s.get(id));
const fdel=id=>idbOp('readwrite',s=>s.delete(id));

async function storeFile(file){
  if(GS)return gcall('api_upload',file.name,file.type||'application/octet-stream',await toB64(file));

async function openFile(meta,dl){
  if(meta.url){window.open(meta.url,'_blank');return}
  const b=await fget(meta.id);if(!b){toast('Không tìm thấy tệp trên trình duyệt này','err');return}

const DONUT_COL=['#5b47d6','#8c7ae6','#bdb2f4','#2d3a52','#e8606a','#9aa3b8'];

function areaChart(vals,labels,sub){

function jdInfo(position,block){
  const p=posByName(position);
  if(!String(position||'').trim())return{empty:true};
  if(!p)return{reason:'Vị trí này chưa có trong Thư viện'};
  if(p.status==='Ngừng áp dụng')return{p,reason:'Vị trí đã ngừng áp dụng trong Thư viện'};
  const ver=posVer(p);
  if(!ver||(ver.effective||'')>todayIso())return{p,reason:'Vị trí chưa có bản MTCV nào đang hiệu lực'};
  if(!ver.file)return{p,ver,reason:`Bản MTCV v${ver.ver} của vị trí chưa có file scan đã duyệt`};
  return{p,ver,file:ver.file};
}
const signRule=block=>!block?'đến cấp Trưởng đơn vị (Khối văn phòng và Kinh doanh) hoặc đến cấp Hội đồng trực thuộc (Khối trường)':(/trường/i.test(block)?'đến cấp Hội đồng trực thuộc (Khối trường)':'đến cấp Trưởng đơn vị (Khối văn phòng và Kinh doanh)');
function reqForm(r){
  const vals=r?{...r.v}:{};
  if(!r&&!vals.dept){const u=me();const d=DB.cfg.depts.find(x=>x.name===u.dept);if(d){vals.dept=d.name;vals.block=d.block}}
  const fields=DB.cfg.reqFields;
  const prevJd=r&&r.jd||null;
  let jdOk=!!(prevJd&&prevJd.mode==='library'&&prevJd.confirmedAt),sig='',sigCore='';
  const draw=(force)=>{
    const box=$('#jdBox');if(!box)return;
    const pos=$('#ff_position'),blk=$('#ff_block');const info=jdInfo(pos?pos.value:'',blk?blk.value:'');
    const core=[info.empty?'e':'',info.p&&info.p.id,info.ver&&info.ver.id,info.file?1:0].join('|');
    const sg=core+'|'+(blk?blk.value:'');
    if(!force&&sg===sig)return;
    if(!force&&core===sigCore&&$('#jd_rule')){$('#jd_rule').textContent=signRule(blk?blk.value:'');sig=sg;return}   // chỉ đổi khối: giữ nguyên ô tải file / nút xác nhận
    if(core!==sigCore&&sigCore!==''&&!(prevJd&&info.ver&&prevJd.verId===info.ver.id))jdOk=false;
    sig=sg;sigCore=core;
    if(info.empty){box.innerHTML=`<div class="alert info">${ic('alert')}<div>Chọn <b>Vị trí cần tuyển</b> để hệ thống kiểm tra MTCV (mô tả công việc) đã duyệt trong Thư viện.</div></div>`;return}
    if(info.file){box.innerHTML=`<div class="card sec" style="border-left:4px solid var(--ok)"><div class="sec-h"><h3>${ic('file')}MTCV đính kèm tự động từ Thư viện</h3><button class="btn sm" data-act="viewVerFile" data-id="${info.p.id}" data-arg="${info.ver.id}">${ic('eye')}Xem file MTCV</button></div>
      <div>Vị trí <b>${esc(info.p.name)}</b> — bản MTCV <b>v${info.ver.ver}</b> đang hiệu lực từ ${fmtD(info.ver.effective)} (${esc(info.file.name)}). Hệ thống sẽ đính kèm file này vào đề xuất.</div>
      <div class="row" style="margin-top:12px"><button class="btn ${jdOk?'ok':'pri'}" id="jd_btn">${jdOk?ic('check')+'Đã xác nhận sử dụng MTCV hiện tại':'Xác nhận sử dụng MTCV hiện tại để tuyển dụng'}</button></div>
      <p class="small muted" style="margin-top:8px">Bắt buộc bấm xác nhận trước khi gửi. Đề xuất dùng đúng bản MTCV hiện hành ở trên, không điều chỉnh.</p></div>`;
      $('#jd_btn').onclick=()=>{jdOk=!jdOk;draw(true)};return}
    const had=prevJd&&prevJd.mode==='upload'&&prevJd.file;
    box.innerHTML=`<div class="card sec" style="border-left:4px solid var(--warn)"><div class="sec-h"><h3>${ic('upload')}Bắt buộc tải file MTCV kèm theo</h3></div>
      <p style="margin-bottom:10px">${esc(info.reason)}. Vui lòng tải lên file MTCV của vị trí đề xuất.</p>
      <div class="alert warn" style="margin-bottom:10px">${ic('alert')}<div><b>Ghi chú:</b> File cần có ký số điện tử hoặc ký trực tiếp <span id="jd_rule">${signRule(blk?blk.value:'')}</span>.</div></div>
      ${had?`<div class="small muted" style="margin-bottom:6px">Hiện có: ${esc(prevJd.file.name)} — chọn tệp mới để thay thế</div>`:''}
      <input type="file" id="jd_file" accept=".pdf,image/*,.doc,.docx"></div>`;
  };
  const signNames=r&&r.signerNames?{...r.signerNames}:{};
  const drawSign=keep=>{
    const box=$('#signBox');if(!box)return;
    if(keep)qa('#signBox [data-sg]').forEach(i=>{signNames[i.dataset.sg]=i.value});
    const blk=$('#ff_block');const list=signersFor(blk?blk.value:'');const reqName=r?userName(r.by):me().name;
    if(!list.length){box.innerHTML='';return}
    box.innerHTML=`<div class="card sec"><div class="sec-h"><h3>${ic('edit')}Người ký trên phiếu đề xuất</h3></div><p class="small muted" style="margin-bottom:10px">Điều chỉnh họ và tên người ký sẽ in trên phiếu. Để trống nếu ký tay. Danh sách người ký thiết lập ở Thiết lập → Chữ ký phiếu đề xuất.</p><div class="fgrid">${list.map(x=>`<div><label class="f">${esc(x.title)}</label><input type="text" data-sg="${esc(x.id)}" value="${esc(signNameOf(x,reqName,signNames))}" placeholder="Họ và tên người ký"></div>`).join('')}</div></div>`;
  };
  modal({title:r?`Sửa đề xuất ${r.code}`:'Tạo đề xuất tuyển dụng',wide:true,html:formHTML(fields,vals)+`<div id="jdBox" style="margin-top:16px"></div><div id="signBox" style="margin-top:16px"></div>`,
    after:m=>{bindForm(m,fields);const pos=$('#ff_position'),blk=$('#ff_block');if(pos){pos.addEventListener('input',()=>draw());pos.addEventListener('change',()=>draw())}if(blk)blk.addEventListener('change',()=>setTimeout(()=>{draw();drawSign(true)},0));draw(true);drawSign(false)},
    buttons:[modalCancel,{label:r?'Lưu thay đổi':'Gửi đề xuất duyệt',cls:'pri',icon:'check',fn:()=>{

      const sn={};signersFor(v.block).forEach(x=>{if(Object.prototype.hasOwnProperty.call(signNames,x.id))sn[x.id]=signNames[x.id]});
      const info=jdInfo(v.position,v.block);let jd,pending=null;
      if(info.file){
        if(!jdOk){toast('Vui lòng bấm “Xác nhận sử dụng MTCV hiện tại” trước khi gửi','err');return false}
        jd={mode:'library',posId:info.p.id,verId:info.ver.id,ver:info.ver.ver,effective:info.ver.effective,file:info.file,confirmedAt:(prevJd&&prevJd.verId===info.ver.id&&prevJd.confirmedAt)||Date.now(),confirmedBy:(prevJd&&prevJd.verId===info.ver.id&&prevJd.confirmedBy)||me().name}
      }else{
        const fi=$('#jd_file'),f=fi&&fi.files[0];const had=prevJd&&prevJd.mode==='upload'&&prevJd.file;
        if(!f&&!had){if(fi)fi.classList.add('err');toast('Chưa có MTCV đã duyệt trong Thư viện: bắt buộc tải file MTCV kèm theo','err');return false}
        if(f&&f.size>MAXF*1048576){toast(`Tệp quá lớn (tối đa ${MAXF}MB)`,'err');return false}
        pending=f||null;jd={mode:'upload',file:had&&!f?prevJd.file:null,uploadedBy:me().name,uploadedAt:Date.now()};
      }
      (async()=>{try{

        if(prevJd&&prevJd.mode==='upload'&&prevJd.file&&jd.mode!=='upload')rel.push(prevJd.file);
        if(r){r.v={...r.v,...v};r.jd=jd;r.signerNames=sn;if(r.status==='pending')r.form=formSnap();log(r,'Cập nhật nội dung đề xuất')}
        else{const yr=new Date().getFullYear();const n=Math.max(0,...DB.reqs.map(x=>{return x.code.startsWith('ĐX-'+yr+'-')?(+x.code.split('-').pop()||0):0}))+1;
          const nr={id:uid('r_'),code:`ĐX-${yr}-${String(n).padStart(3,'0')}`,by:me().id,at:Date.now(),status:'pending',v,jd,form:formSnap(),signerNames:sn,history:[],signed:null};log(nr,'Tạo đề xuất & gửi Ban TGĐ phê duyệt'+(jd.mode==='library'?` (xác nhận MTCV v${jd.ver})`:' (kèm file MTCV)'));DB.reqs.push(nr)}
        closeModal();commit();toast(r?'Đã cập nhật':'Đã gửi đề xuất chờ Ban TGĐ phê duyệt','ok');rel.forEach(releaseFile)}catch(e){toast('Không lưu được tệp','err')}})();
      return false}}]});

function trimImage(img,maxSide){
  const k=Math.min(1,maxSide/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const i=(yy*w+xx)*4;if(d[i+3]>12&&(d[i]<244||d[i+1]<244||d[i+2]<244)){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
  if(x1<0)return c;const pad=Math.round(Math.max(w,h)*0.01);x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}
function logoFromFile(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Không đọc được ảnh logo'))};
  img.onload=()=>{try{
    const base=trimImage(img,1600);URL.revokeObjectURL(u);
    for(const side of [520,420,320,240]){
      const k=Math.min(1,side/base.width);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(base.width*k));c.height=Math.max(1,Math.round(base.height*k));
      const x=c.getContext('2d');x.drawImage(base,0,0,c.width,c.height);let d=c.toDataURL('image/png');if(d.length<=36000)return res(d);
      x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      for(const q of [0.85,0.7]){d=c.toDataURL('image/jpeg',q);if(d.length<=36000)return res(d)}
    }
    rej(new Error('Logo quá phức tạp – hãy dùng ảnh logo đơn giản/nhỏ hơn'))}catch(e){rej(e)}}
  img.src=u})}

/* ---- Bộ dựng thư HTML (dùng chung: giao diện xem trước và Code.gs). Cú pháp: # Tiêu đề · ## Mục · | bảng | · - gạch đầu dòng (thụt 2 dấu cách = cấp con) · > ô lưu ý · ~ căn phải · --- đường kẻ · **đậm** · *nghiêng* · <br> xuống dòng */
function mrEsc(s) { return String(s).normalize('NFC').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function mrInline(s, col) {
  var t = mrEsc(s);
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  t = t.replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<i>$2</i>');
  t = t.replace(/&lt;br&gt;/g, '<br>');
  t = t.replace(/(https?:\/\/(?:(?!&quot;)[^\s<])+)/g, '<a href="$1" style="color:' + col + '">$1</a>');
  return t;
}
function mrParse(text) {
  var lines = String(text || '').replace(/\r/g, '').split('\n'), out = [], i = 0, para = null;
  function flush() { if (para) { out.push({ t: 'p', v: para.join('<br>') }); para = null; } }
  while (i < lines.length) {
    var ln = lines[i], tr = ln.replace(/\s+$/, '');
    if (!tr.trim()) { flush(); i++; continue; }
    var m;
    if ((m = /^#\s+(.*)$/.exec(tr))) { flush(); out.push({ t: 'h1', v: m[1] }); i++; continue; }
    if ((m = /^##\s+(.*)$/.exec(tr))) { flush(); out.push({ t: 'h2', v: m[1] }); i++; continue; }
    if (/^-{3,}$/.test(tr.trim())) { flush(); out.push({ t: 'hr' }); i++; continue; }
    if (/^\|/.test(tr.trim())) {
      flush(); var rows = [];
      while (i < lines.length && /^\|/.test(lines[i].trim())) {
        var cells = lines[i].trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); });
        if (!cells.every(function (c) { return /^:?-{2,}:?$/.test(c); })) rows.push(cells);
        i++;
      }
      out.push({ t: 'tbl', v: rows }); continue;
    }
    if (/^>\s?/.test(tr)) {
      flush(); var ps = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { var q = lines[i].replace(/^>\s?/, '').trim(); if (q) ps.push(q); i++; }
      out.push({ t: 'note', v: ps }); continue;
    }
    if (/^@\s+/.test(tr)) {
      flush(); var bt = [], re = /\[([^\]]+)\]\(([^)]*)\)(?:\{(ok|no)\})?/g, mb;
      while (i < lines.length && /^@\s+/.test(lines[i])) { re.lastIndex = 0; while ((mb = re.exec(lines[i]))) bt.push({ label: mb[1], url: mb[2], kind: mb[3] || '' }); i++; }
      out.push({ t: 'btn', v: bt }); continue;
    }
    if (/^~\s?/.test(tr)) {
      flush(); var rs = [];
      while (i < lines.length && /^~\s?/.test(lines[i])) { rs.push(lines[i].replace(/^~\s?/, '').trim()); i++; }
      out.push({ t: 'right', v: rs }); continue;
    }
    if (/^\s*[-•]\s+/.test(tr)) {
      flush(); var items = [];
      while (i < lines.length && /^\s*[-•]\s+/.test(lines[i])) {
        var mm = /^(\s*)[-•]\s+(.*)$/.exec(lines[i]);
        items.push({ lv: mm[1].length >= 2 ? 1 : 0, v: mm[2] }); i++;
      }
      out.push({ t: 'ul', v: items }); continue;
    }
    (para = para || []).push(tr.trim()); i++;
  }
  flush();
  return out;
}

function mrHref(u) {
  u = String(u || '').trim();
  if (/^https?:\/\//i.test(u)) return mrEsc(u);
  if (!/^mailto:/i.test(u)) return '#';
  var q = u.indexOf('?'), head = q < 0 ? u : u.slice(0, q), rest = q < 0 ? '' : u.slice(q + 1);
  var ps = rest ? rest.split('&').map(function (kv) {
    var e = kv.indexOf('='); if (e < 0) return kv;
    return kv.slice(0, e) + '=' + encodeURIComponent(kv.slice(e + 1).replace(/\\n/g, '\n'));
  }).join('&') : '';
  return mrEsc(head + (ps ? '?' + ps : ''));
}

        b.v.map(function (x, k) { var head = k === 0 && /^\*\*[^*]+\*\*$/.test(x); return '<p style="margin:' + (k ? '8px' : '0') + ' 0 0;' + (head ? 'color:' + col + ';' : '') + '">' + I(x) + '</p>'; }).join('') + '</td></tr></table>';

}
/** Bản văn bản thuần (cho phần dự phòng / mở bằng ứng dụng email / sao chép). */
function mrPlain(text) {
  var out = [];
  mrParse(text).forEach(function (b) {
    var P = function (s) { return String(s).replace(/<br>/g, '\n').replace(/\*\*(.+?)\*\*/g, '$1').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1$2'); };
    if (b.t === 'h1' || b.t === 'h2') out.push(P(b.v).toUpperCase());
    else if (b.t === 'p') out.push(P(b.v));
    else if (b.t === 'hr') out.push('--------');
    else if (b.t === 'btn') out.push('Phản hồi (trả lời email này): ' + b.v.map(function (x) { return x.label; }).join(' / '));
    else if (b.t === 'note' || b.t === 'right') out.push(b.v.map(P).join('\n'));
    else if (b.t === 'ul') out.push(b.v.map(function (it) { return (it.lv ? '    ◦ ' : '• ') + P(it.v); }).join('\n'));
    else if (b.t === 'tbl') out.push(b.v.slice(1).map(function (r) { return '• ' + P(r[0] || '') + (r[1] ? ': ' + P(r.slice(1).join(' – ')) : ''); }).join('\n'));
  });
  return out.join('\n\n');
}

async function sendMailVia(payload,win){
  if(DB.cfg.mail.mode!=='user')return gcall('api_sendMail',payload);
  win=win||openSenderWin();
  let p;try{p=await gcall('api_mailPrepare',payload)}catch(e){try{win.close()}catch(x){}throw e}
  win.location.href=p.url;
  let closedPolls=0;
  for(let i=0;i<130;i++){
    await sleep(1500);
    const s=await gcall('api_mailStatus',p.token);
    if(s.state==='sent')return{from:s.from};
    if(s.state==='error')throw new Error(s.error);
    if(s.state==='expired')throw new Error('Thư nháp đã hết hạn, hãy bấm gửi lại.');
    if(win.closed&&++closedPolls>=3)throw new Error('Cửa sổ gửi thư đã đóng mà thư chưa được gửi.');
  }
  throw new Error('Quá thời gian chờ xác nhận gửi (3 phút).');
}

    html:`<div id="lt_warn">${warnHTML(subj,body)}</div>${rounds.length>1?`<div class="row" style="margin-bottom:12px"><label class="f" style="margin:0">Dùng thông tin vòng phỏng vấn:</label><select id="lt_round" style="width:auto;max-width:320px">${rounds.map(i=>`<option value="${esc(i.id)}">${esc(i.name||'Vòng')}${i.date?' – '+fmtD(i.date):''}</option>`).join('')}</select><span class="small muted">Đổi vòng sẽ soạn lại thư từ mẫu.</span></div>`:''}
    <label class="f">Tiêu đề</label><input type="text" id="lt_s" value="${esc(subj)}"><label class="f" style="margin-top:12px">Nội dung</label><textarea id="lt_b" style="min-height:240px">${esc(body)}</textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between"><label class="f" style="margin:0">Xem trước thư (đúng giao diện người nhận thấy)</label><span class="small muted">Chỉnh nội dung ở trên, khung này tự cập nhật</span></div>
    <iframe id="lt_pv" sandbox="" style="width:100%;height:560px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px"></iframe>
    ${canSend?`<div class="card sec" style="margin-top:14px;border-left:4px solid var(--brand)"><div class="sec-h"><h3>${ic('mail')}Gửi email trực tiếp</h3></div>
      <div class="fgrid"><div><label class="f">Gửi tới</label><input type="text" id="ml_to" value="${esc(c.v.email||'')}" placeholder="email ứng viên"></div><div><label class="f">CC thêm (tuỳ chọn)</label><input type="text" id="ml_cc" placeholder="a@congty.vn, b@congty.vn"></div></div>
      ${atts.length?`<div style="margin-top:10px"><label class="f">Đính kèm biểu mẫu từ Thư viện</label><div id="ml_att">${atts.map(f=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" class="chk" value="${esc(f.file.id)}">${esc(f.name)} <span class="muted small">(${fsize(f.file.size)})</span></label>`).join('')}</div></div>`:''}
      <div class="row" style="margin-top:12px"><button class="btn pri" id="ml_send" data-act="mlSend" data-id="${c.id}" data-arg="${t.id}" data-label="${esc('Gửi email ngay')}">${ic('mail')}Gửi email ngay</button><span class="small muted">Gửi từ <b>${esc(mailFromLabel())}</b>. Chữ ký và BCC lưu bản sao thêm tự động.</span></div></div>`:''}`,
    after:()=>{const pv=()=>{const f=$('#lt_pv');if(f)f.srcdoc=mailPreviewHTML(mailBodyFull($('#lt_b').value))};pv();let pt=0;$('#lt_b').addEventListener('input',()=>{clearTimeout(pt);pt=setTimeout(pv,250)});const sel=$('#lt_round');if(sel){sel.value=dr?dr.id:rounds[rounds.length-1].id;sel.onchange=()=>{rid=sel.value;const x=compose();$('#lt_s').value=x.subj;$('#lt_b').value=x.body;$('#lt_warn').innerHTML=warnHTML(x.subj,x.body);pv()}}},
    buttons:[modalCancel,{label:'Sao chép',icon:'copy',fn:()=>{copyText($('#lt_s').value+'\n\n'+mrPlain($('#lt_b').value));toast('Đã sao chép nội dung thư','ok');return false}},
      ...(c?[{label:'Mở trong ứng dụng email',icon:'mail',fn:()=>{const a=document.createElement('a');a.href=`mailto:${encodeURIComponent(c.v.email||'')}?subject=${encodeURIComponent($('#lt_s').value)}&body=${encodeURIComponent(mrPlain($('#lt_b').value))}`;a.target='_blank';document.body.append(a);a.click();a.remove();return false}},
      {label:'Ghi nhận đã gửi',cls:canSend?'':'pri',icon:'check',fn:()=>{log(c,`Đã gửi thư: ${t.name}`);commit();toast('Đã ghi nhận vào lịch sử ứng viên','ok')}}]:[])]});
}

/* ============ SETTINGS ============ */
function vCfg(){
  const ro=!can('cfg.edit');
  const subs=[['general','Thông tin chung'],['lists','Danh mục'],['reqf','Trường – Đề xuất'],['candf','Trường – Ứng viên'],['scrf','Trường – Sơ vấn'],['ivf','Trường – Phỏng vấn'],['offf','Trường – Thư mời'],['sign','Chữ ký phiếu đề xuất'],['mail','Email gửi ứng viên'],['users','Người dùng'],['perm','Phân quyền'],['data','Dữ liệu & sao lưu']];
  return pageH('Thiết lập','Cấu hình trường dữ liệu, danh mục, người dùng và phân quyền.')+`<div class="side"><div class="snav">${subs.map(s=>`<button class="${ui.cf===s[0]?'on':''}" data-act="cf" data-id="${s[0]}">${s[1]}</button>`).join('')}</div><div class="${ro?'ro':''}">${ro?`<div class="alert info" style="margin-bottom:14px">${ic('eye')}<div>Bạn chỉ có quyền <b>xem</b> Thiết lập. Chỉ quản trị (hoặc vai trò được cấp quyền “Chỉnh sửa Thiết lập”) mới thay đổi được.</div></div>`:''}${cfgBody()}</div></div>`;
}
const FKEY={reqf:['reqFields','Trường của biểu mẫu Đề xuất'],candf:['candFields','Trường của hồ sơ Ứng viên'],scrf:['screenFields','Trường của biểu mẫu Sơ vấn'],ivf:['interviewFields','Trường của mỗi vòng Phỏng vấn'],offf:['offerFields','Trường của Thư mời tuyển dụng']};
const FTITLE={reqFields:'Trường – Đề xuất',candFields:'Trường – Ứng viên',screenFields:'Trường – Sơ vấn',interviewFields:'Trường – Phỏng vấn',offerFields:'Trường – Thư mời'};
function cfgBody(){
  const C=DB.cfg;
  if(ui.cf==='general')return`<div class="card pad"><div class="fgrid"><div class="wide"><label class="f">Tên công ty / đơn vị (dùng trong thư & phiếu in)</label><input type="text" data-cfg="company" value="${esc(C.company)}"></div>
    <div><label class="f">Số ngày cho phép nộp bản ký sau khi duyệt</label><input type="number" min="0" data-cfg="signDays" value="${C.signDays}"></div></div><p class="muted small" style="margin-top:12px">Quá số ngày này, đề xuất thiếu bản ký sẽ hiển thị cảnh báo đỏ trong báo cáo.</p></div>`;
  if(ui.cf==='lists'){
    const simple=(key)=>listCard({title:LIST_TITLES[key],imp:key,addAct:'itemAdd',addId:key,head:['#','Tên'],rows:C[key].map((x,i)=>`<tr><td class="muted" style="width:50px">${i+1}</td><td><b>${esc(x)}</b></td>${rowBtns('itemEdit','itemDel',key,i)}</tr>`)});
    return listCard({title:'Khối',imp:'blocks',addAct:'itemAdd',addId:'blocks',head:['#','Tên khối','Số phòng ban'],rows:C.blocks.map((x,i)=>`<tr><td class="muted" style="width:50px">${i+1}</td><td><b>${esc(x)}</b></td><td>${C.depts.filter(d=>d.block===x).length}</td>${rowBtns('itemEdit','itemDel','blocks',i)}</tr>`)})
     +listCard({title:'Phòng ban / Bộ phận',imp:'depts',addAct:'deptAdd',head:['#','Phòng ban','Khối'],rows:C.depts.map((d,i)=>`<tr><td class="muted" style="width:50px">${i+1}</td><td><b>${esc(d.name)}</b></td><td>${badge(d.block,d.block===C.blocks[0]?'b-info':'b-vio')}</td>${rowBtns('deptEdit','deptDel','',i)}</tr>`)})
     +simple('sources')+simple('rejectReasons');
  }
  if(FKEY[ui.cf]){
    const key=FKEY[ui.cf][0];const fs=C[key];const pfx=(GROUPS.find(g=>g[1]===key)||[])[0];
    return`<div class="card"><div class="card-h"><span>${FKEY[ui.cf][1]}</span><div class="row">${exportBtn('cfg:'+key,1)}<button class="btn sm" data-act="csv" data-id="${key}">${ic('upload')}Nhập CSV</button><button class="btn pri sm" data-act="addField" data-id="${key}">${ic('plus')}Thêm trường</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Tên trường</th><th>Kiểu</th><th>Bắt buộc</th><th>Hiển thị</th>${pfx?'<th>Mã chèn thư mẫu</th>':''}<th></th></tr></thead><tbody>${fs.map((f,i)=>`<tr><td><b>${esc(f.l)}</b>${f.lock?' <span class="muted small">(hệ thống)</span>':''}${f.t==='select'&&f.opts?`<div class="muted small">${esc(f.opts.join(' · '))}</div>`:''}</td><td class="small">${esc((FTYPES.find(t=>t[0]===f.t)||[0,f.from?'Danh mục':f.t])[1])}</td>
      <td><input type="checkbox" class="chk" ${f.req?'checked':''} ${f.lock?'disabled':''} data-act="fieldToggle" data-id="${key}" data-arg="${i}:req"></td>
      <td><input type="checkbox" class="chk" ${f.vis!==0&&f.vis!==false?'checked':''} ${f.lock?'disabled':''} data-act="fieldToggle" data-id="${key}" data-arg="${i}:vis"></td>
      ${pfx?`<td class="mono small muted">{{${pfx}_${esc(f.slug||'')}}}</td>`:''}
      <td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-act="fieldMove" data-id="${key}" data-arg="${i}:-1">${ic('up')}</button><button class="btn ghost sm" data-act="fieldMove" data-id="${key}" data-arg="${i}:1">${ic('down')}</button><button class="btn sm" data-act="fieldEdit" data-id="${key}" data-arg="${i}">${ic('edit')}Sửa</button>${f.custom?` <button class="btn sm bad" data-act="fieldDel" data-id="${key}" data-arg="${i}">${ic('trash')}Xoá</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if(ui.cf==='mail'){
    const M=C.mail,info=ui._mailInfo;
    return`<div class="card pad"><h3 style="margin-bottom:6px">Gửi email cho ứng viên bằng email tuyển dụng</h3>
      <div class="alert info" style="margin:10px 0 14px">${ic('alert')}<div><b>Cách thiết lập (làm một lần):</b><ol style="margin:6px 0 0 18px"><li>Trong Gmail của <b>tài khoản chủ dự án</b>: ⚙ Cài đặt → Xem tất cả cài đặt → <b>Tài khoản và Nhập</b> → <b>Gửi thư với tư cách</b> → Thêm địa chỉ email khác → nhập email tuyển dụng → xác minh (thư xác nhận gửi tới hộp thư tuyển dụng).</li><li>Trong Apps Script chạy hàm <b>authorizeMail</b> một lần để cấp quyền Gmail, rồi Triển khai phiên bản mới.</li><li>Ở đây: bấm <b>Kiểm tra alias</b>, chọn địa chỉ gửi, bật tính năng, rồi <b>Gửi thư thử</b>.</li></ol></div></div>
      ${ENV.gs?'':`<div class="alert warn" style="margin-bottom:14px">${ic('alert')}<div>Đang ở chế độ xem thử – chỉ gửi trực tiếp được khi chạy trên Google Sheet (Apps Script).</div></div>`}
      <div class="fgrid"><div><label class="f">Gửi email trực tiếp từ ứng dụng</label><select data-cfg="mail.enabled" data-bool="1"><option value="0" ${M.enabled?'':'selected'}>Tắt (chỉ soạn thư / mở ứng dụng email)</option><option value="1" ${M.enabled?'selected':''}>Bật</option></select></div>
      <div><label class="f">Gửi bằng tài khoản nào?</label><select data-cfg="mail.mode" data-rr="1"><option value="owner" ${M.mode==='owner'?'selected':''}>Tài khoản chủ dự án (dùng alias tuyển dụng)</option><option value="user" ${M.mode==='user'?'selected':''}>Email của chính người bấm gửi</option></select></div>
      ${M.mode==='user'?`<div class="wide"><div class="alert info" style="margin:0 0 6px">${ic('alert')}<div><b>Cần tạo thêm “bản triển khai người gửi” (một lần):</b><ol style="margin:6px 0 0 18px"><li>Apps Script → <b>Triển khai → Triển khai mới</b> → loại <b>Ứng dụng web</b>.</li><li><b>Thực thi dưới tư cách: Người dùng truy cập ứng dụng web</b>; <b>Ai có quyền truy cập: Bất kỳ ai trong tổ chức</b>.</li><li>Sao chép URL (kết thúc bằng <span class="mono">/exec</span>) dán vào ô bên dưới. Ứng dụng chính vẫn giữ nguyên “Thực thi dưới tư cách: Tôi”, nên nhân viên vẫn <b>không mở được Sheet/Drive</b>.</li><li>Mỗi nhân viên lần đầu bấm gửi sẽ được Google hỏi cấp quyền gửi Gmail (quản trị Workspace có thể tin cậy trước ứng dụng).</li></ol></div></div></div>
      <div class="wide"><label class="f">URL bản triển khai “người gửi”</label><input type="text" data-cfg="mail.senderUrl" value="${esc(M.senderUrl)}" placeholder="https://script.google.com/a/macros/…/exec"></div>`:''}
      <div><label class="f">${M.mode==='user'?'Alias dùng khi người gửi cũng có alias này (nếu không: dùng email của họ)':'Gửi từ địa chỉ (alias)'}</label><input type="text" data-cfg="mail.fromAlias" list="dl_alias" value="${esc(M.fromAlias)}" placeholder="tuyendung@congty.vn"><datalist id="dl_alias">${(ui._aliases||[]).map(a=>`<option value="${esc(a)}">`).join('')}</datalist></div>
      <div><label class="f">Tên người gửi hiển thị</label><input type="text" data-cfg="mail.senderName" value="${esc(M.senderName)}" placeholder="${M.mode==='user'?'{{ten}} – Phòng Nhân sự':'Phòng Nhân sự – Tên công ty'}"></div>
      <div><label class="f">Địa chỉ nhận phản hồi (Reply-To, tuỳ chọn)</label><input type="text" data-cfg="mail.replyTo" value="${esc(M.replyTo)}" placeholder="${M.mode==='user'?'Để trống = email của người gửi ({{email}})':'Để trống = trả lời về địa chỉ gửi'}"></div>
      <div><label class="f">CC mặc định (cách nhau bằng dấu phẩy)</label><input type="text" data-cfg="mail.cc" value="${esc(M.cc)}"></div>
      <div><label class="f">BCC lưu bản sao vào hộp thư tuyển dụng</label><input type="text" data-cfg="mail.bcc" value="${esc(M.bcc)}" placeholder="tuyendung@congty.vn"></div>
      <div><label class="f">Giới hạn số email mỗi ngày</label><input type="number" min="1" data-cfg="mail.dailyLimit" value="${esc(M.dailyLimit)}"></div>
      <div class="wide"><h4 style="margin:6px 0 0">Giao diện thư gửi đi</h4></div>
      <div><label class="f">Giao diện thư</label><select data-cfg="mail.rich" data-bool="1"><option value="1" ${M.rich===0?'':'selected'}>Chuyên nghiệp (tiêu đề, bảng, ô lưu ý, logo)</option><option value="0" ${M.rich===0?'selected':''}>Văn bản đơn giản</option></select></div>
      <div><label class="f">Logo đầu thư</label><select data-cfg="mail.showLogo" data-bool="1"><option value="1" ${M.showLogo===0?'':'selected'}>Hiện (lấy từ Thư viện → Mẫu phiếu)</option><option value="0" ${M.showLogo===0?'selected':''}>Ẩn</option></select></div>
      <div><label class="f">Màu chủ đạo</label><input type="color" data-cfg="mail.brandColor" value="${esc(M.brandColor||'#8a1538')}" style="height:40px;padding:3px"></div>
      <div class="wide"><label class="f">Thông tin đầu thư (mỗi dòng một nội dung, hiện bên trái logo)</label><textarea data-cfg="mail.headerLines" style="min-height:90px" placeholder="HỆ THỐNG TRƯỜNG VIỆT MỸ (VA SCHOOLS)&#10;Trụ sở: 252 Lạc Long Quân, Phường Bình Thới, TP.HCM&#10;Điện thoại: 028.3858 5300&#10;Website: www.vaschools.edu.vn">${esc(M.headerLines||'')}</textarea></div>
      <div class="wide"><label class="f">Chữ ký email (tự thêm cuối mọi thư)</label><textarea data-cfg="mail.signature" placeholder="Trân trọng,&#10;Phòng Nhân sự – Tên công ty&#10;Hotline: …">${esc(M.signature)}</textarea></div></div>
      <div class="row" style="margin-top:14px"><button class="btn" data-act="mailAliases" ${ENV.gs?'':'disabled'}>${ic('search')}Kiểm tra alias trong Gmail</button><button class="btn pri" data-act="mailTest" ${ENV.gs?'':'disabled'}>${ic('mail')}Gửi thư thử tới email của tôi</button></div>
      ${info?`<p class="small" style="margin-top:12px">Chủ dự án: <b>${esc(info.owner)}</b> · Alias tìm thấy: ${info.aliases.length?info.aliases.map(a=>badge(a,'b-ok')).join(' '):badge('Chưa có alias nào – hãy thêm “Gửi thư với tư cách” trong Gmail','b-warn')} · Hạn mức còn lại hôm nay: <b>${esc(info.quota)}</b> email</p>`:''}
      <p class="small muted" style="margin-top:10px">Mọi email gửi qua ứng dụng được ghi vào sheet <b>NhatKyEmail</b> và vào lịch sử của ứng viên. Thư nằm trong thư mục "Đã gửi" của tài khoản gửi (chủ dự án hoặc chính người bấm gửi) — dùng BCC để có bản sao ở hộp thư tuyển dụng.</p></div>`;
  }
  if(ui.cf==='sign'){
    const list=C.signers||[];
    return`<div class="card"><div class="card-h"><span>Chữ ký cuối phiếu đề xuất <span class="badge b-gray">${list.length}</span></span><div class="row"><button class="btn sm" data-act="signPreview">${ic('eye')}Xem trước</button><button class="btn sm" data-act="signReset">Khôi phục mặc định</button><button class="btn pri sm" data-act="signEdit" data-id="">${ic('plus')}Thêm người ký</button></div></div>
      <div class="small muted" style="padding:12px 18px 0">Khối chữ ký in ở cuối phiếu đề xuất, theo thứ tự bên dưới. Mỗi người gồm <b>Chức danh</b>, <b>Họ và tên</b> (để trống nếu ký tay) và dòng <b>Ngày ký: ...../....../........</b>. Có thể giới hạn người ký theo từng khối (ví dụ Hội đồng trực thuộc cho Khối trường).</div>
      <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Chức danh</th><th>Họ và tên</th><th>Ghi chú dưới chức danh</th><th>Ngày ký</th><th>Áp dụng cho</th><th></th></tr></thead><tbody>${list.map((x,i)=>`<tr><td class="muted" style="width:44px">${i+1}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.name==='{{nguoi_de_xuat}}'?'(Tự điền: người đề xuất)':(x.name||'—'))}</td><td class="small">${esc(x.note||'—')}</td><td>${x.showDate?badge('Có','b-ok'):badge('Không','b-gray')}</td><td>${x.block?badge(x.block,'b-vio'):'Tất cả khối'}</td><td style="text-align:right;white-space:nowrap"><button class="btn ghost sm" data-act="signMove" data-id="${i}" data-arg="-1">${ic('up')}</button><button class="btn ghost sm" data-act="signMove" data-id="${i}" data-arg="1">${ic('down')}</button> <button class="btn sm" data-act="signEdit" data-id="${i}">${ic('edit')}Sửa</button> <button class="btn sm bad" data-act="signDel" data-id="${i}">${ic('trash')}Xoá</button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty">Chưa có người ký – bấm “Thêm người ký”</div></td></tr>`}</tbody></table></div>
      <div class="pad" style="border-top:1px solid var(--line)"><div class="fgrid"><div><label class="f">Số cột chữ ký tối đa trên mỗi hàng (các hàng được chia đều và canh giữa)</label><select data-cfg="signCols">${[2,3,4,5,6].map(n=>`<option value="${n}" ${(+C.signCols||4)===n?'selected':''}>${n} cột</option>`).join('')}</select></div>

const exportBtn=(k,sm)=>can('data.export')?`<button class="btn ${sm?'sm':''}" data-act="exp" data-id="${k}">${ic('download')}Xuất CSV</button>`:'';
function csvVal(v){
  if(v==null)return'';if(typeof v==='number')return String(v);
  let t=String(v);
  if(/^0\d{5,}$/.test(t))return'="'+t+'"';                       // giữ số 0 đầu (SĐT, mã) khi mở bằng Excel
  if(/^[=+\-@\t\r]/.test(t)&&!/^-?\d+([.,]\d+)?$/.test(t))return"'"+t; // chống chèn công thức (CSV injection)
  return t;
}
function csvText(rows){return'﻿'+rows.map(r=>r.map(c=>{const t=csvVal(c);return/[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}).join(',')).join('\r\n')}
function downloadCSV(name,rows){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csvText(rows)],{type:'text/csv;charset=utf-8'}));a.download=`${name}-${iso()}.csv`;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000);
  toast(`Đã xuất ${Math.max(0,rows.length-1)} dòng → ${a.download}`,'ok');
}
const fieldCell=(f,v)=>{if(v==null||v==='')return'';if(f.t==='date')return fmtD(v);if(f.t==='file')return v&&v.name?(v.url?`${v.name} (${v.url})`:v.name):'';return typeof v==='object'?JSON.stringify(v):v};
const ftypeLabel=f=>(FTYPES.find(t=>t[0]===f.t)||[0,f.from?'Danh mục':f.t])[1];

}

  if(k==='cfg'){

function renameRef(key,o,n){

/* --- CSV --- */
const nrm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().trim();
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=(text.split(/\r?\n/).find(l=>l.trim())||'');
  const cnt=c=>first.split(c).length-1;
  const d=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0];
  const delim=d[1]>0?d[0]:',';
  const rows=[];let row=[],cur='',q=false;
  const pushRow=()=>{row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]};
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;pushRow()}
    else cur+=ch}
  pushRow();
  return rows.map(r=>r.map(x=>x.trim()));
}
function parseDateVN(s){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)))return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return'';
}

 tplPro:()=>{const L=DB.lib.templates,all=proTemplates();const add=[],upd=[];all.forEach(t=>{const x=L.find(y=>y.name===t.name);if(!x)add.push(t);else if((x.pro||0)<t.pro)upd.push([x,t])});

 mailTest:async()=>{try{const win=openSenderWin();if(saveTimer){clearTimeout(saveTimer);flush()}await chain;toast('Đang gửi thư thử…');const r=await sendMailVia({to:ENV.email,subject:'[Thử] Email tuyển dụng – '+DB.cfg.company,body:'Đây là thư thử từ ứng dụng HR Recruit.\nNếu bạn nhận được thư này từ địa chỉ tuyển dụng thì cấu hình đã đúng.',candidate:'(thư thử)'},win);toast('Đã gửi thư thử từ '+r.from+' tới '+ENV.email,'ok')}catch(e){toast(String(e&&e.message||e),'err')}},
 mlSend:async(id,el)=>{
   const c=DB.cands.find(x=>x.id===id);if(!c||el.dataset.busy)return;
   const to=$('#ml_to').value.trim(),cc=$('#ml_cc').value.trim(),subject=$('#lt_s').value.trim(),body=$('#lt_b').value;
   if(!/^[^\s@,;<>]+@[^\s@,;<>]+\.[^\s@,;<>]+$/.test(to)){toast('Email người nhận không hợp lệ','err');return}
   if(!subject||!body.trim()){toast('Thiếu tiêu đề hoặc nội dung','err');return}
   const left=(subject+body).match(/\{\{\w+\}\}/g);if(left){toast('Thư còn trường chưa điền: '+[...new Set(left)].join(', '),'err');return}
   if(!el.dataset.armed){el.dataset.armed='1';el.innerHTML=ic('check')+'Bấm lần nữa để XÁC NHẬN gửi tới '+esc(to);setTimeout(()=>{if(el.dataset.armed&&!el.dataset.busy){delete el.dataset.armed;el.innerHTML=ic('mail')+el.dataset.label}},6000);return}
   let win=null;try{win=openSenderWin()}catch(e){toast(e.message,'err');return}
   el.dataset.busy='1';el.disabled=true;el.textContent=win?'Đang chờ bạn bấm “Gửi ngay” ở cửa sổ mới…':'Đang gửi…';
   try{const r=await sendMailVia({to,cc,subject,body,candidate:c.v.name,attachIds:qa('#ml_att input:checked').map(i=>i.value)},win);
     log(c,`Đã gửi email "${subject}" tới ${to} (từ ${r.from})`);closeModal();commit();toast('Đã gửi email từ '+r.from,'ok')}
   catch(e){delete el.dataset.busy;delete el.dataset.armed;el.disabled=false;el.innerHTML=ic('mail')+el.dataset.label;toast('Không gửi được: '+String(e&&e.message||e),'err')}},
 itemAdd:id=>itemModal(id),itemEdit:(id,el)=>itemModal(id,+el.dataset.arg),
 itemDel:(id,el)=>{const i=+el.dataset.arg,v=DB.cfg[id][i],n=usedCount(id,v);confirmBox(`Xoá “${esc(v)}”?${n?` Đang được dùng ở ${n} bản ghi (dữ liệu cũ vẫn giữ nguyên giá trị).`:''}`,()=>{DB.cfg[id].splice(i,1);commit()},'Xoá')},

 deptDel:(id,el)=>{const i=+el.dataset.arg,d=DB.cfg.depts[i],n=usedCount('depts',d.name);confirmBox(`Xoá phòng ban “${esc(d.name)}”?${n?` Đang được dùng ở ${n} bản ghi.`:''}`,()=>{DB.cfg.depts.splice(i,1);commit()},'Xoá')},
 csv:id=>csvOpen(id),
 addItem:id=>{const i=$('#add_'+id);const v=i.value.trim();if(v&&!DB.cfg[id].includes(v)){DB.cfg[id].push(v);commit()}},

 fieldDel:(id,el)=>confirmBox('Xoá trường này? Dữ liệu đã nhập trong trường sẽ không còn hiển thị.',()=>{DB.cfg[id].splice(+el.dataset.arg,1);commit()},'Xoá'),
 fieldToggle:(id,el)=>{const[i,p]=el.dataset.arg.split(':');const f=DB.cfg[id][+i];f[p]=el.checked?1:0;if(p==='vis'&&!el.checked)f.req=0;commit()},
 fieldMove:(id,el)=>{const[i,d]=el.dataset.arg.split(':').map(Number);const a=DB.cfg[id];const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];commit()},
 userEdit:id=>{const u=DB.cfg.users.find(x=>x.id===id)||{name:'',email:'',title:'',dept:'',roleId:DB.cfg.roles[0].id};
   modal({title:id?'Sửa người dùng':'Thêm người dùng',html:`<div class="fgrid"><div><label class="f">Họ tên *</label><input type="text" id="us_n" value="${esc(u.name)}"></div><div><label class="f">Email Google (dùng để đăng nhập)</label><input type="email" id="us_e" value="${esc(u.email||'')}" placeholder="ten@congty.edu.vn"></div><div><label class="f">Chức danh</label><input type="text" id="us_t" value="${esc(u.title)}"></div><div><label class="f">Phòng ban</label><select id="us_d"><option value="">—</option>${[...DB.cfg.depts.map(d=>d.name),'Ban TGĐ'].map(d=>`<option ${d===u.dept?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="wide"><label class="f">Vai trò</label><select id="us_r">${DB.cfg.roles.map(r=>`<option value="${r.id}" ${r.id===u.roleId?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div></div>`,
     buttons:[modalCancel,{label:'Lưu',cls:'pri',fn:()=>{const n=$('#us_n').value.trim();if(!n){$('#us_n').classList.add('err');return false}
       const o={name:n,email:$('#us_e').value.trim().toLowerCase(),title:$('#us_t').value,dept:$('#us_d').value,roleId:$('#us_r').value};if(id)Object.assign(u,o);else DB.cfg.users.push({id:uid('u'),...o});commit()}}]})},
 userDel:id=>{if(id===ui.realMe){toast('Không thể xoá người dùng đang đăng nhập','err');return}confirmBox('Xoá người dùng này?',()=>{DB.cfg.users=DB.cfg.users.filter(u=>u.id!==id);commit()},'Xoá')},
 capToggle:(id,el)=>{const r=DB.cfg.roles.find(x=>x.id===id),c=el.dataset.arg;r.caps=el.checked?[...new Set([...r.caps,c])]:r.caps.filter(x=>x!==c);save();renderShell()},
 roleAdd:()=>modal({title:'Thêm vai trò',html:`<label class="f">Tên vai trò</label><input type="text" id="rn">`,buttons:[modalCancel,{label:'Thêm',cls:'pri',fn:()=>{const n=$('#rn').value.trim();if(!n)return false;DB.cfg.roles.push({id:uid('role_'),name:n,caps:['lib.view']});commit()}}]}),
 roleDel:id=>{if(DB.cfg.users.some(u=>u.roleId===id)){toast('Vai trò đang được gán cho người dùng','err');return}DB.cfg.roles=DB.cfg.roles.filter(r=>r.id!==id);commit()},
 exportData:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='hr-recruit-backup-'+iso()+'.json';a.click()},
 importData:async()=>{const f=await pickFile('.json');if(!f)return;try{const d=JSON.parse(await f.text());if(!d.cfg||!d.reqs||!d.cands||!d.lib)throw 0;DB=d;normalize();if(ENV.gs&&!DB.cfg.users.some(u=>(u.email||'').toLowerCase()===ENV.email.toLowerCase()))DB.cfg.users.push({id:uid('u'),name:ENV.email.split('@')[0],title:'Quản trị',dept:'',roleId:'admin',email:ENV.email});pickUser();commit();toast('Đã nhập dữ liệu','ok')}catch(e){toast('Tệp sao lưu không hợp lệ','err')}},
 resetDemo:()=>confirmBox('Nạp dữ liệu mẫu? Dữ liệu hiện tại sẽ bị thay thế.',()=>{DB=seedDemo();normalize();pickUser();ui.tab='dash';commit()},'Nạp dữ liệu mẫu'),
 clearAll:()=>confirmBox('Xoá TOÀN BỘ đề xuất, ứng viên và thư viện (giữ thiết lập)?',()=>{DB.reqs=[];DB.cands=[];DB.lib={positions:[],templates:[],forms:[],formTpls:[defaultFormTpl()]};commit()},'Xoá hết')
};
const CFG_ACTS=['mailAliases','mailTest','signEdit','signDel','signMove','signReset','itemAdd','itemEdit','itemDel','deptAdd','deptEdit','deptDel','addItem','delItem','addDept','delDept','addField','fieldEdit','fieldDel','fieldToggle','fieldMove','userEdit','userDel','capToggle','roleAdd','roleDel','importData','resetDemo','clearAll'];
CFG_ACTS.forEach(k=>{const f=A[k];A[k]=(...a)=>can('cfg.edit')?f(...a):toast('Bạn không có quyền chỉnh sửa Thiết lập','err')});
function roundModal(c,i){
  const fields=DB.cfg.interviewFields;
  mini(i?'Sửa vòng phỏng vấn':'Thêm vòng phỏng vấn',fields,i||{name:'Vòng '+(c.interviews.length+1),result:'Chờ kết quả'},v=>{
    if(i)Object.assign(i,v);else c.interviews.push({id:uid('i_'),...v});
    log(c,`${i?'Cập nhật':'Thêm'} ${v.name||i&&i.name}: ${v.result||(i&&i.result)||''}`);if(['new','screening'].includes(c.stage))suggestStage(c,'interview')});
}

/* ============ events ============ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(el&&el.tagName==='INPUT')return;
  if(el){const f=A[el.dataset.act];if(f){ev.preventDefault();ev.stopPropagation();f(el.dataset.id,el,ev)}return}
  if(ev.target.id==='ov')closeDrawer();
  if(ev.target.id==='mw')closeModal();
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.who){ui.me=el.value;ui.tab=can('report.view')?'dash':(can('req.create')?'req':'lib');closeDrawer();render();toast('Đang xem với vai trò: '+roleOf(me()).name)}
  else if(el.tagName==='INPUT'&&el.dataset.act){A[el.dataset.act](el.dataset.id,el)}
  else if(el.dataset.cfg){if(!can('cfg.edit'))return;const k=el.dataset.cfg;const val=el.type==='number'?Number(el.value):(el.dataset.bool?+el.value:el.value);if(k.includes('.')){const[a,b]=k.split('.');(DB.cfg[a]=DB.cfg[a]||{})[b]=val}else DB.cfg[k]=val;save();if(el.dataset.rr)render()}
  else if(el.dataset.bind&&el.tagName==='SELECT'){ui[el.dataset.bind]=el.value;render()}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset&&el.dataset.num){formatNumInput(el);return}if(el.dataset.bind&&el.tagName==='INPUT'){ui[el.dataset.bind]=el.value;render()}});
window.addEventListener('focus',()=>{if(ENV.gs&&DB&&Date.now()-lastLoad>120000&&!saveTimer&&!inflight&&!$('#mw').classList.contains('on'))reloadData(true)});
document.addEventListener('focusin',e=>{const i=e.target&&e.target.id;if(i==='ff_subject'||i==='ff_body')tplFocusId=i});
window.addEventListener('beforeunload',e=>{if(ENV.gs&&(saveTimer||inflight)){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ENV.gs&&saveTimer){clearTimeout(saveTimer);flush()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#mw').classList.contains('on'))closeModal();else closeDrawer()}});
/* drag & drop kanban */
let dragId=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest?.('.kc');if(k){dragId=k.dataset.id;k.classList.add('drag');e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragend',e=>{qa('.kc.drag').forEach(k=>k.classList.remove('drag'));qa('.col.over').forEach(c=>c.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(c&&dragId){e.preventDefault();qa('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const col=e.target.closest?.('.col');if(!col||!dragId)return;e.preventDefault();const c=DB.cands.find(x=>x.id===dragId);const s=col.dataset.stage;
  if(c&&can('cand.move'))changeStage(c,s)});

window.addEventListener('error',e=>{try{toast('Lỗi giao diện: '+e.message,'err')}catch(x){}});
window.addEventListener('unhandledrejection',e=>{try{toast('Lỗi: '+((e.reason&&e.reason.message)||e.reason),'err')}catch(x){}});
init();
</script>
