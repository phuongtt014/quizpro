<style>
  /* Bảng màu: đổi --side-* và --accent* để chuyển sang màu thương hiệu khác. */
  :root {
    --bg:#f3f5f8; --card:#ffffff; --text:#1b2430; --muted:#617082; --line:#e1e6ec; --head:#f0f3f7;
    --side-bg:#0b3b2e; --side-text:#cfe6dc; --side-muted:#7fae9a; --side-hover:#124d3c; --side-line:#165a46;
    --accent:#0e9f6e; --accent-soft:#e3f6ee; --accent-ink:#ffffff; --accent-dark:#067a54;
    --brand:var(--accent); --brand-ink:var(--accent-ink);
    --amber:#f5b82e; --amber-ink:#2b2100;
    --ok:#15803d; --warn:#9a6700; --bad:#c62828; --bad-bg:#fdecec; --ok-bg:#e6f6ec; --warn-bg:#fff4dc;
    --c1:#059669; --c2:#7c3aed; --c3:#d97706; --c4:#2563eb;
    --focus:#2563eb; --shadow:0 1px 2px rgba(16,24,40,.05), 0 2px 10px rgba(16,24,40,.05);
    --side-w:250px; --side-w-min:68px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151b; --card:#192029; --text:#e6eaef; --muted:#97a4b4; --line:#2a333e; --head:#222b36;
      --accent:#34c58f; --accent-soft:#17382c; --accent-ink:#06261b; --accent-dark:#34c58f; --side-bg:#08241b; --side-hover:#0f3a2c; --side-line:#12392b;
      --ok:#59c38a; --warn:#e8b24a; --bad:#ff7a7a; --bad-bg:#3a1f22; --ok-bg:#1c3326; --warn-bg:#3a2f16;
      --c1:#34d399; --c2:#a78bfa; --c3:#fbbf24; --c4:#60a5fa; --focus:#7aa7ff; --shadow:none; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  svg { display:block; }
  .boot { padding:48px; text-align:center; color:var(--muted); }

  /* ---------- khung: sidebar + cột nội dung ---------- */
  .shell { display:flex; min-height:100vh; }
  aside.side { width:var(--side-w); flex:0 0 var(--side-w); background:var(--side-bg); color:var(--side-text); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; z-index:60; transition:width .18s ease, flex-basis .18s ease, transform .18s ease; overflow:hidden; }
  .brand-box { display:flex; align-items:center; gap:12px; padding:18px 16px 16px; border-bottom:1px solid var(--side-line); min-height:76px; }
  .logo { flex:0 0 40px; width:40px; height:40px; border-radius:11px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
  .bt { min-width:0; } .bt b { display:block; color:#fff; font-size:15px; line-height:1.2; } .bt small { color:var(--side-muted); font-size:11.5px; }
  aside nav { flex:1; overflow-y:auto; padding:8px 10px 12px; }
  .grp { margin-top:14px; }
  .grp-t { color:var(--side-muted); font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; padding:6px 10px; white-space:nowrap; }
  aside nav a { display:flex; align-items:center; gap:12px; padding:10px 12px; margin:2px 0; border-radius:10px; color:var(--side-text); text-decoration:none; cursor:pointer; white-space:nowrap; position:relative; }
  aside nav a:hover { background:var(--side-hover); color:#fff; }
  aside nav a.on { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  aside nav a .ic { flex:0 0 20px; display:grid; place-items:center; }
  aside nav a .lb { flex:1; overflow:hidden; text-overflow:ellipsis; }
  aside nav a .cnt { background:var(--amber); color:var(--amber-ink); font-size:11px; font-weight:700; border-radius:99px; padding:0 7px; min-width:20px; text-align:center; }
  aside nav a:focus-visible, .side-foot button:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
  .side-foot { border-top:1px solid var(--side-line); padding:12px 12px 14px; display:flex; flex-direction:column; gap:10px; }
  .usr { display:flex; align-items:center; gap:10px; min-width:0; }
  .av { flex:0 0 34px; width:34px; height:34px; border-radius:50%; background:var(--side-hover); color:#fff; display:grid; place-items:center; font-weight:700; }
  .usr div { min-width:0; } .usr b { display:block; color:#fff; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .usr small { color:var(--side-muted); font-size:11.5px; }
  .collapse-btn { display:flex; align-items:center; gap:10px; background:transparent; border:1px solid var(--side-line); color:var(--side-text); border-radius:9px; padding:8px 10px; cursor:pointer; font:inherit; white-space:nowrap; }
  .collapse-btn:hover { background:var(--side-hover); color:#fff; }
  .collapse-btn .ic svg { transition:transform .18s; }

  /* thu gọn: chỉ còn biểu tượng */
  body.side-collapsed aside.side { width:var(--side-w-min); flex-basis:var(--side-w-min); }
  body.side-collapsed .bt, body.side-collapsed .grp-t, body.side-collapsed aside nav a .lb, body.side-collapsed .usr div, body.side-collapsed .collapse-btn .lb { display:none; }
  body.side-collapsed .brand-box { justify-content:center; padding:18px 0 16px; }
  body.side-collapsed aside nav a { justify-content:center; padding:11px 0; }
  body.side-collapsed aside nav a .cnt { position:absolute; top:3px; right:6px; min-width:16px; font-size:10px; padding:0 4px; }
  body.side-collapsed .grp { margin-top:8px; padding-top:8px; border-top:1px solid var(--side-line); } body.side-collapsed .grp:first-child { border-top:0; }
  body.side-collapsed .usr { justify-content:center; } body.side-collapsed .collapse-btn { justify-content:center; padding:8px 0; }
  body.side-collapsed .collapse-btn .ic svg { transform:rotate(180deg); }

  .col { flex:1; min-width:0; display:flex; flex-direction:column; }
  header.topbar { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; padding:12px 24px; }
  .icon-btn { background:var(--card); border:1px solid var(--line); border-radius:9px; width:38px; height:38px; display:grid; place-items:center; cursor:pointer; color:var(--text); position:relative; flex:0 0 38px; }
  .icon-btn:hover { background:var(--head); }
  .icon-btn .dot { position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; border-radius:99px; font-size:11px; padding:0 6px; line-height:18px; }
  .ptitle { flex:1; min-width:0; } .ptitle h1 { margin:0; font-size:20px; line-height:1.25; } .ptitle p { margin:1px 0 0; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .top-actions { display:flex; align-items:center; gap:10px; }
  main { padding:20px 24px 32px; width:100%; }
  .scrim { display:none; }

  /* ---------- thành phần ---------- */
  h2 { margin:4px 0 12px; font-size:20px; } h3 { margin:0 0 8px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); margin-bottom:16px; }
  .card > h3:first-child { padding-bottom:12px; margin-bottom:14px; border-bottom:1px solid var(--line); font-size:15px; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:14px; }
  .tabs button { background:none; border:0; padding:9px 14px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; font:inherit; margin-bottom:-1px; }
  .tabs button:hover { color:var(--text); }
  .tabs button.on { color:var(--accent-dark); border-bottom-color:var(--accent); font-weight:600; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .bar .sp { flex:1; }
  button.btn, .btn { font:inherit; padding:8px 13px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .btn:hover { background:var(--head); }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .btn.pri:hover { filter:brightness(1.07); }
  .btn.dng { color:var(--bad); }
  .btn.sm { padding:3px 9px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px; width:100%; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .bar input[type=search] { width:260px; max-width:100%; }
  .bar select { width:auto; max-width:100%; }
  .tw { overflow:auto; border:1px solid var(--line); border-radius:12px; max-height:calc(100vh - 290px); min-height:120px; background:var(--card); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:nowrap; }
  td.wrap { white-space:normal; min-width:200px; }
  th { background:var(--head); position:sticky; top:0; font-weight:600; font-size:12px; color:var(--muted); text-transform:none; z-index:1; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:hover td { background:color-mix(in srgb, var(--head) 55%, transparent); }
  tr:last-child td { border-bottom:0; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12px; background:var(--head); }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.warn { background:var(--warn-bg); color:var(--warn); } .badge.bad { background:var(--bad-bg); color:var(--bad); }
  .overlay { position:fixed; inset:0; background:rgba(10,14,20,.5); display:grid; place-items:center; z-index:80; padding:12px; }
  .modal { background:var(--card); border-radius:16px; width:min(760px,100%); max-height:92vh; overflow:auto; padding:20px; border:1px solid var(--line); }
  .modal.wide { width:min(1040px,100%); }
  .modal h3 { font-size:17px; }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px 14px; }
  .form label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .form .full { grid-column:1/-1; }
  .req::after { content:" *"; color:var(--bad); }
  .alert { padding:10px 14px; border-radius:10px; margin:8px 0; }
  .alert.bad { background:var(--bad-bg); color:var(--bad); } .alert.ok { background:var(--ok-bg); color:var(--ok); } .alert.warn { background:var(--warn-bg); color:var(--warn); }
  .row-end { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  textarea.paste { min-height:150px; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; white-space:pre; }
  .vis { font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--head); padding:1px 5px; border-radius:4px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:99px; z-index:95; max-width:90vw; }
  .drop { position:fixed; right:24px; top:64px; width:min(380px,calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(16,24,40,.18); z-index:70; max-height:70vh; overflow:auto; }
  .drop .it { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; } .drop .it.un { background:var(--accent-soft); } .drop .it b { display:block; }
  .matrix td, .matrix th { text-align:center; } .matrix td:first-child, .matrix th:first-child { text-align:left; }

  .skel { height:14px; border-radius:6px; background:linear-gradient(90deg,var(--head) 25%,color-mix(in srgb,var(--head) 50%,var(--card)) 50%,var(--head) 75%); background-size:200% 100%; animation:skel 1.1s linear infinite; }
  @keyframes skel { from { background-position:200% 0; } to { background-position:-200% 0; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation:none; } }

  /* ---------- tổng quan ---------- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(176px,1fr)); gap:14px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .kpi .chip { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; margin-bottom:12px; }
  .kpi .lab { color:var(--muted); font-size:13px; } .kpi .val { font-size:26px; font-weight:700; margin:2px 0; } .kpi .sub { color:var(--muted); font-size:12px; }
  .chip.g { background:var(--accent-soft); color:var(--accent-dark); } .chip.b { background:#e6efff; color:#2456c9; } .chip.p { background:#efe6ff; color:#6d3bd1; } .chip.a { background:#fff1d6; color:#a15f00; } .chip.t { background:#dff6f8; color:#0b7285; }
  .charts { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
  .hbar { display:grid; grid-template-columns:minmax(100px,170px) 1fr auto; gap:10px; align-items:center; padding:7px 0; }
  .hbar .track { height:18px; background:var(--head); border-radius:6px; overflow:hidden; } .hbar .fill { height:100%; background:var(--c1); border-radius:6px; }
  .hbar .fill.alt { background:var(--c2); } .hbar .v { font-variant-numeric:tabular-nums; font-size:13px; min-width:90px; text-align:right; }
  .donut-wrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .legend { flex:1; min-width:170px; } .legend div { display:flex; align-items:center; gap:8px; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; } .legend .n { margin-left:auto; font-variant-numeric:tabular-nums; } .legend .pc { color:var(--muted); width:46px; text-align:right; }
  .check { padding:0; margin:0; } .check li { list-style:none; padding:6px 0; display:flex; align-items:center; gap:8px; } .check a { color:var(--text); cursor:pointer; }
  .legend-key { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-bottom:8px; } .legend-key i { width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:5px; }

  /* ---------- màn hình nhỏ: sidebar trượt ra ---------- */
  @media (max-width: 900px) {
    aside.side { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); width:var(--side-w) !important; flex-basis:auto; }
    body.side-open aside.side { transform:none; box-shadow:0 0 40px rgba(0,0,0,.35); }
    body.side-open .scrim { display:block; position:fixed; inset:0; background:rgba(8,16,12,.5); z-index:55; }
    body.side-collapsed .bt, body.side-collapsed .grp-t, body.side-collapsed aside nav a .lb, body.side-collapsed .usr div, body.side-collapsed .collapse-btn .lb { display:revert; }
    body.side-collapsed aside nav a { justify-content:flex-start; padding:10px 12px; }
    .collapse-btn { display:none; }
    header.topbar { padding:10px 14px; } main { padding:14px 12px 28px; }
    .charts { grid-template-columns:1fr; } .bar input[type=search] { width:100%; } .drop { right:8px; }
    .ptitle p { display:none; }
  }
  @media print { aside.side, header.topbar, .scrim { display:none !important; } main { padding:0; } }
</style>
