<script>
(function () {
  'use strict';

  var S = { schema: null, me: null, main: null, nav: null, bellBox: null, cache: {}, gen: 0, ms: null, pre: {} };

  /* ---------- tiện ích DOM ---------- */
  function el(tag, a, kids) {
    var n = document.createElement(tag), val;
    Object.keys(a || {}).forEach(function (k) {
      var v = a[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'value') val = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    if (val !== undefined) n.value = val;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  /** Các thao tác chỉ đọc: mọi thao tác khác (ghi) thành công thì bỏ toàn bộ đệm trình duyệt để không hiện dữ liệu cũ. */
  var READ_ONLY = { list: 1, tonghop: 1, 'tonghop.export': 1, 'phieu.list': 1, 'phieu.get': 1, batch: 1, boot: 1, me: 1, schema: 1, dashboard: 1,
    'notify.list': 1, 'quydoi.list': 1, 'dean.check': 1, 'calc.simulate': 1, 'phutroi.chitiet': 1, 'roles.matrix': 1 };
  function api(name, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { if (r && r.ms !== undefined) S.ms = r.ms; if (r && r.ok && !READ_ONLY[name]) { S.cache = {}; S.gen++; } if (r && r.ok) resolve(r.data); else reject(r || { error: 'Lỗi không xác định' }); })
        .withFailureHandler(function (e) { reject({ error: e && e.message ? e.message : String(e) }); })
        .apiCall(name, payload || {});
    });
  }

  function openModal(wide) {
    var ov = el('div', { class: 'overlay' }), m = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' });
    ov.appendChild(m);
    document.body.appendChild(ov);
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) close(); });
    return { m: m, close: close };
  }

  function errBox(e) {
    var box = el('div', { class: 'alert bad' }, [el('b', { text: e.error || 'Có lỗi xảy ra' })]);
    if (e.details && e.details.length) {
      var ul = el('ul', { style: 'margin:6px 0 0;padding-left:18px' });
      e.details.slice(0, 20).forEach(function (d) {
        var text = typeof d === 'string' ? d : ((d.label ? d.label + ': ' : '') + d.msg);
        ul.appendChild(el('li', { text: text }));
      });
      box.appendChild(ul);
    }
    return box;
  }
  function showErr(e) {
    if (e instanceof Error) { console.error(e); toast('Lỗi giao diện: ' + e.message); return; }
    toast(e.error || 'Có lỗi xảy ra');
  }

  /* ---------- đệm danh sách phía trình duyệt: hiện ngay dữ liệu đã xem, cập nhật ngầm ---------- */
  function listKey(table, ctx, filter, q, page) { return JSON.stringify([table, ctx || null, filter || null, q || '', page || 0]); }
  /** Bỏ các bản đệm của một bảng (gọi sau khi ghi để lần xem sau luôn là dữ liệu mới). */
  function cacheDrop(table) {
    Object.keys(S.cache).forEach(function (k) { if (k.indexOf('["' + table + '"') === 0) delete S.cache[k]; });
  }
  /**
   * Tải trước trang đầu của nhiều bảng bằng MỘT lần gọi (máy chủ đọc từ bộ nhớ đệm nên rất nhanh), để chuyển tab là có dữ liệu ngay.
   * items: [{ table, ctx, filter }]. Lỗi/thiếu quyền thì bỏ qua, tab tự tải khi mở.
   */
  function prefetch(items) {
    items = items.filter(function (i) { return tt(i.table) && !S.cache[listKey(i.table, i.ctx, i.filter, '', 0)]; });
    if (!items.length) return;
    var gen = S.gen;
    api('batch', { calls: items.map(function (i) { return { name: 'list', payload: { table: i.table, ctx: i.ctx, filter: i.filter, q: '', page: 0 } }; }) }).then(function (res) {
      res.forEach(function (r, i) { if (r.ok && gen === S.gen) S.cache[listKey(items[i].table, items[i].ctx, items[i].filter, '', 0)] = r.data; });
    }).catch(function () { /* im lặng */ });
  }

  /* ---------- biểu tượng (SVG nội tuyến, hằng số tin cậy) ---------- */
  var ICONS = {
    dash: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
    setup: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
    dean: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
    staff: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    declare: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="15" y2="16"/>',
    calc: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
    phieu: '<polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    admin: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    menu: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
    collapse: '<polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>',
    refresh: '<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
    building: '<path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><line x1="9" y1="9" x2="9" y2="9.01"/><line x1="9" y1="13" x2="9" y2="13.01"/><line x1="9" y1="17" x2="9" y2="17.01"/>',
    school: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>',
    wallet: '<path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>'
  };
  function icon(name, size) {
    var s = el('span', { class: 'ic' });
    s.innerHTML = '<svg viewBox="0 0 24 24" width="' + (size || 20) + '" height="' + (size || 20) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
    return s;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  /** Số tiền rút gọn cho thẻ chỉ số/biểu đồ: 48,5 tr / 1,2 tỷ. */
  function shortMoney(v) {
    var n = Number(v) || 0, f = function (x) { return x.toLocaleString('vi-VN', { maximumFractionDigits: 2 }); };
    if (Math.abs(n) >= 1e9) return f(n / 1e9) + ' tỷ';
    if (Math.abs(n) >= 1e6) return f(n / 1e6) + ' tr';
    return n.toLocaleString('vi-VN');
  }

  /* ---------- định dạng ---------- */
  function dmy(iso) { if (!iso) return ''; var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function fmtCell(c, v) {
    if (v === '' || v === null || v === undefined) return '';
    switch (c.t) {
      case 'date': return dmy(v);
      case 'money': return Number(v).toLocaleString('vi-VN');
      case 'pct': return (Math.round(Number(v) * 10000) / 100).toString().replace('.', ',') + '%';
      case 'num': return String(v).replace('.', ',');
      default: return String(v);
    }
  }
  function toRaw(c, v) {
    if (v === '' || v === null || v === undefined) return '';
    switch (c.t) {
      case 'date': return dmy(v);
      case 'pct': return (Math.round(Number(v) * 10000) / 100).toString().replace('.', ',') + '%';
      case 'num': return String(v).replace('.', ',');
      case 'money': case 'int': return String(v);
      default: return String(v);
    }
  }
  function tt(table) { return S.schema.tables[table]; }
  /** Cột tham chiếu hiển thị "mã – tên" nếu danh mục đủ nhỏ để tải sẵn. */
  function refLabel(c, v) {
    var list = S.schema.refs[c.ref];
    if (!list) return v;
    for (var i = 0; i < list.length; i++) if (list[i].v === String(v)) return list[i].l && list[i].l !== list[i].v ? v + ' – ' + list[i].l : v;
    return v;
  }
  /** Làm mới danh mục chọn (khóa ngoại) sau khi dữ liệu thay đổi, để form luôn thấy mục mới. */
  function refreshSchema() { return api('schema').then(function (sc) { S.schema = sc; }).catch(function () { /* giữ bản cũ */ }); }

  /** Bỏ dấu + chữ thường để tìm không phân biệt dấu ("nguyen" khớp "Nguyễn"). */
  function fold(t) { return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase(); }

  /**
   * Ô chọn có tìm kiếm cho danh mục dài (vd 200 nhân sự): gõ một phần mã hoặc tên, chọn bằng chuột hoặc ↑ ↓ Enter.
   * Trả { node, ctl } — ctl có value (mã đã chọn) và disabled như một ô nhập thường.
   */
  function combo(list, labelOf, initial) {
    var code = initial || '', box = el('input', { type: 'text', autocomplete: 'off', placeholder: 'Gõ mã hoặc tên để tìm…', role: 'combobox' });
    var pop = el('div', { class: 'combo-pop', role: 'listbox', style: 'display:none' }), wrap = el('div', { class: 'combo' }, [box, pop]), act = -1, shown = [];
    var items = list.map(function (o) { var t = labelOf(o); return { v: o.v, t: t, f: fold(o.v + ' ' + t) }; });
    function textOf(v) { for (var i = 0; i < items.length; i++) if (items[i].v === v) return items[i].t; return v; }
    function close() { pop.style.display = 'none'; act = -1; }
    function choose(v) { code = v; box.value = v === '' ? '' : textOf(v); close(); }
    function paint() {
      clear(pop);
      shown.forEach(function (it, i) {
        pop.appendChild(el('div', { class: 'combo-it' + (i === act ? ' on' : ''), role: 'option', text: it.t,
          onmousedown: function (e) { e.preventDefault(); choose(it.v); } }));
      });
      if (!shown.length) pop.appendChild(el('div', { class: 'combo-it muted', text: 'Không có kết quả' }));
      pop.style.display = '';
    }
    function find() {
      var q = fold(box.value.trim());
      shown = items.filter(function (it) { return !q || it.f.indexOf(q) >= 0; }).slice(0, 60);
      act = shown.length ? 0 : -1; paint();
    }
    box.addEventListener('input', function () { code = ''; find(); });
    box.addEventListener('focus', function () { if (!code) find(); else { box.select(); } });
    box.addEventListener('blur', function () {
      close();
      if (code === '') { // gõ đúng mã thì nhận luôn, còn lại xóa để tránh nhầm
        var v = box.value.trim(), hit = items.filter(function (it) { return it.v === v; })[0];
        if (hit) choose(hit.v); else if (shown.length === 1 && v) choose(shown[0].v); else box.value = '';
      }
    });
    box.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (pop.style.display === 'none') find();
        else { act = Math.max(0, Math.min(shown.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1))); paint(); }
      } else if (e.key === 'Enter' && pop.style.display !== 'none') {
        e.preventDefault();
        if (shown[act]) choose(shown[act].v);
      } else if (e.key === 'Escape' && pop.style.display !== 'none') { e.stopPropagation(); close(); }
    });
    box.value = code === '' ? '' : textOf(code);
    return { node: wrap, ctl: {
      get value() { return code; }, set value(v) { choose(v); },
      get disabled() { return box.disabled; }, set disabled(d) { box.disabled = d; }
    } };
  }

  /* ---------- form thêm/sửa ---------- */
  function openForm(table, opts, row, onDone) {
    var T = tt(table), md = openModal(), inputs = {}, fixed = opts.fixed || {};
    var form = el('div', { class: 'form' });
    T.cols.forEach(function (c) {
      if (c.k === T.ctx || c.ro) return;
      var input, node = null, list = c.t === 'ref' ? S.schema.refs[c.ref] : null;
      var dflt = opts.defaults || {};
      var cur = row ? toRaw(c, row[c.k]) : (fixed[c.k] !== undefined ? fixed[c.k] : (dflt[c.k] !== undefined ? dflt[c.k] : (c.def !== undefined ? toRaw(c, c.def) : '')));
      if (c.t === 'enum') {
        input = el('select', null, (c.req && c.def === undefined ? [] : [el('option', { value: '', text: '— chọn —' })]).concat(
          c.values.map(function (v) { return el('option', { value: v, text: v }); })));
      } else if (table === 'KHAI_BAO' && c.k === 'qd_ma') {
        input = el('select', null, [el('option', { value: '', text: '— không dùng (nhập tự do) —' })]);
        (function (sel, keep) {
          var kyMa = row ? row.ky_ma : ((opts.defaults || {}).ky_ma || '');
          api('quydoi.list', { ky_ma: kyMa }).then(function (d) {
            d.rows.forEach(function (q) {
              sel.appendChild(el('option', { value: q.ma, text: q.ma + ' – ' + q.ten + ' (' + String(q.so_tiet).replace('.', ',') + ' tiết/' + q.don_vi + ')' }));
              sel._q = sel._q || {}; sel._q[q.ma] = q;
            });
            sel.value = keep;
          }).catch(function () { /* không tải được bảng quy đổi: vẫn nhập tự do được */ });
          sel.addEventListener('change', function () {
            var q = (sel._q || {})[sel.value];
            if (!q) return;
            inputs.loai.value = 'Trách nhiệm';
            inputs.noi_dung.value = q.ten;
            inputs.don_vi.value = q.don_vi === 'buổi' ? 'Buổi' : 'Tiết/' + q.don_vi.charAt(0).toUpperCase() + q.don_vi.slice(1);
            inputs.so_luong.value = q.don_vi === 'buổi' ? '' : String(q.so_tiet).replace('.', ',');
            if (q.don_vi === 'buổi') inputs.so_luong.placeholder = 'Số buổi (mỗi buổi ' + String(q.so_tiet).replace('.', ',') + ' tiết)';
          });
        })(input, cur);
      } else if (list && list.length > 8) {
        var cb = combo(list, function (o) { return o.l && o.l !== o.v ? o.v + ' – ' + o.l : o.v; }, '');
        input = cb.ctl; node = cb.node;
      } else if (list) {
        input = el('select', null, [el('option', { value: '', text: '— chọn —' })].concat(
          list.map(function (o) { return el('option', { value: o.v, text: o.l && o.l !== o.v ? o.v + ' – ' + o.l : o.v }); })));
      } else if (c.t === 'longtext') input = el('textarea', { rows: 3 });
      else {
        var ph = c.t === 'date' ? 'dd/MM/yyyy' : (c.t === 'pct' ? 'vd 5%' : (c.hint || ''));
        input = el('input', { type: 'text', autocomplete: 'off', placeholder: ph });
      }
      input.value = cur;
      if (fixed[c.k] !== undefined) input.disabled = true;
      if (row && T.key.indexOf(c.k) >= 0 && c.k !== 'hieu_luc_tu' && tableLocksKey(table)) input.disabled = true;
      inputs[c.k] = input;
      form.appendChild(el('div', { class: c.t === 'longtext' ? 'full' : '' }, [
        el('label', { class: c.req && c.def === undefined ? 'req' : '', text: c.l }), node || input
      ]));
    });
    var autoClose = null, errHost = el('div');
    if (T.temporal && !row) {
      autoClose = el('input', { type: 'checkbox', checked: true, style: 'width:auto' });
      form.appendChild(el('div', { class: 'full' }, [el('label', null, [autoClose, ' Tự động kết thúc bản ghi đang còn hiệu lực ngay trước ngày bắt đầu mới'])]));
    }
    var save = el('button', { class: 'btn pri', text: 'Lưu', onclick: function () {
      var vals = {};
      Object.keys(inputs).forEach(function (k) { vals[k] = inputs[k].value; });
      Object.keys(fixed).forEach(function (k) { vals[k] = fixed[k]; });
      save.disabled = true;
      api('save', { table: table, id: row ? row.id : null, row: vals, ctx: opts.ctx, autoClose: autoClose ? autoClose.checked : false })
        .then(function () { md.close(); toast('Đã lưu'); onDone(); })
        .catch(function (e) { clear(errHost).appendChild(errBox(e)); save.disabled = false; });
    } });
    md.m.appendChild(el('h3', { text: (row ? 'Sửa: ' : 'Thêm: ') + T.label }));
    md.m.appendChild(form);
    md.m.appendChild(errHost);
    md.m.appendChild(el('div', { class: 'row-end' }, [el('button', { class: 'btn', text: 'Hủy', onclick: md.close }), save]));
  }
  var LOCK_KEY = { CHI_NHANH: 1, TRUONG: 1, NAM_HOC: 1, KY_LUONG: 1, NGACH_DM: 1, SETTINGS: 1, DEAN: 1, NHAN_SU: 1, USERS: 1, ROLES: 1 };
  function tableLocksKey(t) { return !!LOCK_KEY[t]; }

  /** Tải file mẫu .csv (UTF-8 có BOM để Excel đọc đúng tiếng Việt): tiêu đề đúng yêu cầu + một dòng ví dụ hợp lệ. */
  function downloadTemplate(table, ctx) {
    api('import.template', { table: table, ctx: ctx }).then(function (t) {
      try {
        var blob = new Blob(['\uFEFF' + t.csv], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = t.file; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        toast('Đã tạo file mẫu ' + t.file + '. Nếu trình duyệt không tải, dùng nút "Chèn mẫu + dòng ví dụ" trong hộp Nhập CSV.');
      } catch (e) { toast('Trình duyệt không cho tải file. Hãy dùng nút "Chèn mẫu + dòng ví dụ" trong hộp Nhập CSV.'); }
    }).catch(showErr);
  }

  /** Xuất dữ liệu đúng định dạng mẫu nhập: sao chép (TSV) hoặc tải .csv; lấy mã chuẩn để nhập sang tab khác. */
  function exportData(table, ctx) {
    api('export.table', { table: table, ctx: ctx }).then(function (d) {
      var md = openModal(true), ta = el('textarea', { class: 'paste', readonly: true, spellcheck: 'false' });
      ta.value = d.tsv;
      var copy = el('button', { class: 'btn pri', text: 'Sao chép', onclick: function () {
        ta.focus(); ta.select();
        var done = false;
        try { done = document.execCommand('copy'); } catch (e) { done = false; }
        if (!done && navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { toast('Đã sao chép'); });
        else toast(done ? 'Đã sao chép, hãy dán vào Excel/Google Sheets' : 'Hãy nhấn Ctrl+C để sao chép');
      } });

    { id: 'setup', group: 'Dữ liệu', icon: 'setup', label: 'Thiết lập', sub: 'Chi nhánh, trường, năm học, kỳ quyết toán, danh mục ngạch', show: function () { return !!tt('CHI_NHANH'); }, render: pageSetup },
    { id: 'dean', group: 'Dữ liệu', icon: 'dean', label: 'Đề án', title: 'Đề án lương', sub: 'Phiên bản đề án, bảng hệ số, LCB/LTB, trần tăng thu nhập', show: function () { return !!tt('DEAN'); }, render: pageDean },
    { id: 'staff', group: 'Dữ liệu', icon: 'staff', label: 'Nhân sự', sub: 'Hồ sơ, quá trình ngạch bậc, kiêm nhiệm, thu nhập hiện tại', show: function () { return !!tt('NHAN_SU') || !!tt('THU_NHAP_NEN'); }, render: pageStaff },
    { id: 'declare', group: 'Tính lương', icon: 'declare', label: 'Khai báo', title: 'Khai báo giảng dạy & trách nhiệm', sub: 'Số tiết thực dạy, trách nhiệm, định mức theo kỳ', show: function () { return !!tt('KHAI_BAO'); }, render: pageDeclare },
    { id: 'calc', group: 'Tính lương', icon: 'calc', label: 'Thu nhập & phụ trội', sub: 'Tính toán, tổng hợp toàn công ty, mô phỏng', show: function () { return !!tt('QUYET_TOAN'); }, render: pageCalc },
    { id: 'phieu', group: 'Tính lương', icon: 'phieu', label: 'Phiếu duyệt', sub: 'Đề xuất, xét duyệt và phê duyệt nhiều bậc', show: function () { return true; }, render: pagePhieu },
    { id: 'admin', group: 'Hệ thống', icon: 'admin', label: 'Hệ thống', sub: 'Người dùng, vai trò, quy trình duyệt, nhật ký', show: function () { return !!tt('USERS') || !!tt('AUDIT_LOG'); }, render: pageAdmin }
  ];

  /* ---------- thanh bên: thu gọn / mở rộng ---------- */
  var SIDE_KEY = 'vas.side';
  function isMobile() { return window.matchMedia && window.matchMedia('(max-width: 900px)').matches; }
  function setCollapsed(on) {
    document.body.classList.toggle('side-collapsed', on);
    try { localStorage.setItem(SIDE_KEY, on ? '1' : '0'); } catch (e) { /* trình duyệt chặn lưu: bỏ qua */ }
  }
  function toggleSide() {
    if (isMobile()) document.body.classList.toggle('side-open');
    else setCollapsed(!document.body.classList.contains('side-collapsed'));
  }
  function restoreSide() {
    var v = null;
    try { v = localStorage.getItem(SIDE_KEY); } catch (e) { v = null; }
    if (v === '1') document.body.classList.add('side-collapsed');
  }

  function setPending(n) {
    var cnt = document.getElementById('nav-cnt-phieu');
    if (!cnt) return;
    cnt.textContent = n ? String(n) : '';
    cnt.style.display = n ? '' : 'none';
  }
  function refreshMe() { api('me').then(function (m) { S.me.pending = m.pending; setPending(m.pending); }).catch(function () { /* im lặng */ }); }

  function route() {
    if (S.bellBox) { S.bellBox.remove(); S.bellBox = null; }
    document.body.classList.remove('side-open');
    var parts = location.hash.replace(/^#/, '').split('/'), id = parts[0] || 'dash', sub = parts.slice(1).join('/') || '';
    var page = PAGES.filter(function (p) { return p.id === id && p.show(); })[0] || PAGES[0];
    Array.prototype.forEach.call(S.nav.querySelectorAll('a'), function (a) { a.className = a.getAttribute('data-p') === page.id ? 'on' : ''; });
    S.title.textContent = page.title || page.label;
    S.subtitle.textContent = page.sub || '';
    document.title = (page.title || page.label) + ' · Hệ thống Lương VASchools';
    clear(S.main);
    page.render(S.main, sub);
    window.scrollTo(0, 0);
    if (page.id !== 'dash') refreshMe();
  }

  function start() {
    // Gọi "đoán trước" dữ liệu của trang đang mở song song với bước khởi động để bớt một vòng chờ (lỗi/thiếu quyền thì bỏ qua).
    var first = (location.hash.replace(/^#/, '').split('/')[0]) || 'dash', SPEC = { setup: 'CHI_NHANH', staff: 'NHAN_SU', dean: 'DEAN', admin: 'USERS' };
    var spec = first === 'dash' ? api('dashboard').then(function (d) { S.pre.dash = d; }) :
      (SPEC[first] ? api('list', { table: SPEC[first], q: '', page: 0 }).then(function (d) { S.cache[listKey(SPEC[first], null, null, '', 0)] = d; }) : Promise.resolve());
    Promise.all([api('boot'), spec.catch(function () { /* bỏ qua */ })]).then(function (r) { return r[0]; }).then(function (b) {
      S.me = b.me; S.schema = b.schema;
      restoreSide();
      var app = clear(document.getElementById('app'));

      S.nav = el('nav', { 'aria-label': 'Menu chính' });
      var groups = {}, order = [];
      PAGES.forEach(function (p) {
        if (!p.show()) return;
        if (!groups[p.group]) { groups[p.group] = el('div', { class: 'grp' }, [el('div', { class: 'grp-t', text: p.group })]); order.push(p.group); }
        var link = el('a', { 'data-p': p.id, tabindex: '0', role: 'link', title: p.label, onclick: function () { location.hash = '#' + p.id; },
          onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.hash = '#' + p.id; } } },
        [icon(p.icon), el('span', { class: 'lb', text: p.label })]);
        if (p.id === 'phieu') link.appendChild(el('span', { class: 'cnt', id: 'nav-cnt-phieu', style: 'display:none' }));
        groups[p.group].appendChild(link);
      });
      order.forEach(function (g) { S.nav.appendChild(groups[g]); });

      var initial = (S.me.name || '?').trim().charAt(0).toUpperCase();
      var side = el('aside', { class: 'side', 'aria-label': 'Thanh bên' }, [
        el('div', { class: 'brand-box' }, [el('span', { class: 'logo' }, [icon('admin', 22)]), el('div', { class: 'bt' }, [el('b', { text: 'Hệ thống Lương' }), el('small', { text: 'VASchools · Đề án lương' })])]),
        S.nav,
        el('div', { class: 'side-foot' }, [
          el('div', { class: 'usr', title: S.me.email }, [el('span', { class: 'av', text: initial }), el('div', null, [el('b', { text: S.me.name }), el('small', { text: S.me.isAdmin ? 'Quản trị hệ thống' : S.me.email })])]),
          el('button', { class: 'collapse-btn', 'aria-label': 'Thu gọn hoặc mở rộng thanh bên', title: 'Thu gọn / mở rộng', onclick: toggleSide }, [icon('collapse', 18), el('span', { class: 'lb', text: 'Thu gọn menu' })])])]);

      var bell = el('button', { class: 'icon-btn', 'aria-label': 'Thông báo', title: 'Thông báo', onclick: function () { toggleBell(bell); } }, [icon('bell', 19)]);
      var refresh = el('button', { class: 'icon-btn', 'aria-label': 'Làm mới dữ liệu', title: 'Làm mới dữ liệu (tải lại bản mới nhất)', onclick: function () {
        refresh.disabled = true;
        var done = function () { S.cache = {}; S.gen++; refresh.disabled = false; route(); toast('Đã làm mới dữ liệu'); };
        if (S.me.perms.indexOf('setup.edit') >= 0) api('cache.flush').then(done).catch(function (e) { refresh.disabled = false; showErr(e); }); else done();
      } }, [icon('refresh', 19)]);
      S.title = el('h1'); S.subtitle = el('p');
      var top = el('header', { class: 'topbar' }, [
        el('button', { class: 'icon-btn', 'aria-label': 'Ẩn/hiện thanh bên', title: 'Ẩn/hiện menu', onclick: toggleSide }, [icon('menu', 20)]),
        el('div', { class: 'ptitle' }, [S.title, S.subtitle]), el('div', { class: 'top-actions' }, [refresh, bell])]);
      S.main = el('main', { id: 'content' });

      app.appendChild(el('div', { class: 'shell' }, [side, el('div', { class: 'col' }, [top, S.main]), el('div', { class: 'scrim', onclick: function () { document.body.classList.remove('side-open'); } })]));
      refreshBell(bell);
      setPending(S.me.pending);
      setInterval(function () { refreshBell(bell); refreshMe(); }, 90000);
      window.addEventListener('hashchange', route);
      route();
    }).catch(function (e) {
      if (e instanceof Error) console.error(e);
      clear(document.getElementById('app')).appendChild(el('div', { class: 'boot' }, [errBox(e instanceof Error ? { error: 'Lỗi giao diện: ' + e.message } : e)]));
    });
  }

  start();
})();
</script>
