<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống Lương VASchools</title>
  <style>
  :root {
    --bg:#f6f7f9; --card:#ffffff; --text:#1c2430; --muted:#5b6675; --line:#dde2e8; --head:#eef1f5;
    --brand:#8a1538; --brand-ink:#ffffff; --ok:#1a7f45; --warn:#9a6700; --bad:#c62828; --bad-bg:#fdecec; --ok-bg:#e8f6ee; --warn-bg:#fff6e0;
    --focus:#2563eb; --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232b; --text:#e8ebef; --muted:#9aa5b3; --line:#2b333d; --head:#252d37;
      --brand:#e0587c; --brand-ink:#14181d; --ok:#59c38a; --warn:#e8b24a; --bad:#ff7a7a; --bad-bg:#3a1f22; --ok-bg:#1c3326; --warn-bg:#3a2f16;
      --focus:#7aa7ff; --shadow:none; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .boot { padding:48px; text-align:center; color:var(--muted); }
  header.top { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; }
  .top-in { display:flex; align-items:center; gap:12px; padding:8px 16px; flex-wrap:wrap; }
  .brand { font-weight:700; color:var(--brand); letter-spacing:.2px; }
  nav { display:flex; gap:2px; flex-wrap:wrap; flex:1; }
  nav a { padding:7px 12px; border-radius:8px; color:var(--text); text-decoration:none; cursor:pointer; }
  nav a:hover { background:var(--head); }
  nav a.on { background:var(--brand); color:var(--brand-ink); }
  .who { color:var(--muted); font-size:13px; }
  main { padding:16px; max-width:1280px; margin:0 auto; }
  h2 { margin:4px 0 12px; font-size:20px; }
  h3 { margin:0 0 8px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tabs button { background:none; border:0; padding:8px 12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; font:inherit; }
  .tabs button.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .bar .sp { flex:1; }
  button.btn, .btn { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  .btn:hover { background:var(--head); }
  .btn.pri { background:var(--brand); border-color:var(--brand); color:var(--brand-ink); }
  .btn.pri:hover { filter:brightness(1.08); }
  .btn.dng { color:var(--bad); }
  .btn.sm { padding:3px 8px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  input, select, textarea { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 9px; width:100%; }
  input:focus, select:focus, textarea:focus, button:focus-visible, nav a:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .bar input[type=search] { width:240px; max-width:100%; }
  .tw { overflow:auto; border:1px solid var(--line); border-radius:10px; max-height:62vh; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:nowrap; }
  td.wrap { white-space:normal; min-width:200px; }
  th { background:var(--head); position:sticky; top:0; font-weight:600; font-size:12px; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr:last-child td { border-bottom:0; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; background:var(--head); }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.warn { background:var(--warn-bg); color:var(--warn); } .badge.bad { background:var(--bad-bg); color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .stat { font-size:28px; font-weight:700; } .stat small { display:block; font-size:12px; color:var(--muted); font-weight:400; }
  .check li { list-style:none; padding:4px 0; } .check { padding:0; margin:0; }
  .check a { color:var(--text); cursor:pointer; }
  .overlay { position:fixed; inset:0; background:rgba(10,14,20,.5); display:grid; place-items:center; z-index:50; padding:12px; }
  .modal { background:var(--card); border-radius:14px; width:min(760px,100%); max-height:92vh; overflow:auto; padding:18px; border:1px solid var(--line); }
  .modal.wide { width:min(1040px,100%); }
  .modal h3 { font-size:17px; }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px 14px; }
  .form label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .form .full { grid-column:1/-1; }
  .req::after { content:" *"; color:var(--bad); }
  .alert { padding:9px 12px; border-radius:8px; margin:8px 0; }
  .alert.bad { background:var(--bad-bg); color:var(--bad); } .alert.ok { background:var(--ok-bg); color:var(--ok); } .alert.warn { background:var(--warn-bg); color:var(--warn); }
  .row-end { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
  textarea.paste { min-height:150px; font:12px/1.4 ui-monospace,Menlo,Consolas,monospace; white-space:pre; }
  .vis { font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--head); padding:1px 5px; border-radius:4px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:9px 16px; border-radius:99px; z-index:90; max-width:90vw; }
  .bell { position:relative; background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; color:var(--text); font:inherit; }
  .bell .dot { position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; border-radius:99px; font-size:11px; padding:0 6px; }
  .drop { position:absolute; right:16px; top:52px; width:min(380px,calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); z-index:40; max-height:70vh; overflow:auto; }
  .drop .it { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; } .drop .it.un { background:var(--head); } .drop .it b { display:block; }
  .matrix td, .matrix th { text-align:center; } .matrix td:first-child, .matrix th:first-child { text-align:left; }
  @media (max-width:640px) { main { padding:10px; } .bar input[type=search] { width:100%; } }
</style>

</head>
<body>
  <div id="app"><div class="boot">Đang tải…</div></div>
  <div id="toast" class="toast" hidden></div>
  <script>
(function () {
  'use strict';

  var S = { schema: null, me: null, main: null, nav: null, bellBox: null };

  /* ---------- tiện ích DOM ---------- */
  function el(tag, a, kids) {
    var n = document.createElement(tag), val;
    Object.keys(a || {}).forEach(function (k) {
      var v = a[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'value') val = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    if (val !== undefined) n.value = val;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }

  function api(name, payload) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (r) { if (r && r.ok) resolve(r.data); else reject(r || { error: 'Lỗi không xác định' }); })
        .withFailureHandler(function (e) { reject({ error: e && e.message ? e.message : String(e) }); })
        .apiCall(name, payload || {});
    });
  }

  function openModal(wide) {
    var ov = el('div', { class: 'overlay' }), m = el('div', { class: 'modal' + (wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' });
    ov.appendChild(m);
    document.body.appendChild(ov);
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) close(); });
    return { m: m, close: close };
  }

  function errBox(e) {
    var box = el('div', { class: 'alert bad' }, [el('b', { text: e.error || 'Có lỗi xảy ra' })]);
    if (e.details && e.details.length) {
      var ul = el('ul', { style: 'margin:6px 0 0;padding-left:18px' });
      e.details.slice(0, 20).forEach(function (d) {
        var text = typeof d === 'string' ? d : ((d.label ? d.label + ': ' : '') + d.msg);
        ul.appendChild(el('li', { text: text }));
      });
      box.appendChild(ul);
    }
    return box;
  }
  function showErr(e) {
    if (e instanceof Error) { console.error(e); toast('Lỗi giao diện: ' + e.message); return; }
    toast(e.error || 'Có lỗi xảy ra');
  }

  /* ---------- định dạng ---------- */
  function dmy(iso) { if (!iso) return ''; var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function fmtCell(c, v) {
    if (v === '' || v === null || v === undefined) return '';
    switch (c.t) {
      case 'date': return dmy(v);
      case 'money': return Number(v).toLocaleString('vi-VN');
      case 'pct': return (Math.round(Number(v) * 10000) / 100).toString().replace('.', ',') + '%';
      case 'num': return String(v).replace('.', ',');
      default: return String(v);
    }
  }
  function toRaw(c, v) {
    if (v === '' || v === null || v === undefined) return '';
    switch (c.t) {
      case 'date': return dmy(v);
      case 'pct': return (Math.round(Number(v) * 10000) / 100).toString().replace('.', ',') + '%';
      case 'num': return String(v).replace('.', ',');
      case 'money': case 'int': return String(v);
      default: return String(v);
    }
  }
  function tt(table) { return S.schema.tables[table]; }
  /** Cột tham chiếu hiển thị "mã – tên" nếu danh mục đủ nhỏ để tải sẵn. */
  function refLabel(c, v) {
    var list = S.schema.refs[c.ref];
    if (!list) return v;
    for (var i = 0; i < list.length; i++) if (list[i].v === String(v)) return list[i].l && list[i].l !== list[i].v ? v + ' – ' + list[i].l : v;
    return v;
  }
  /** Làm mới danh mục chọn (khóa ngoại) sau khi dữ liệu thay đổi, để form luôn thấy mục mới. */
  function refreshSchema() { return api('schema').then(function (sc) { S.schema = sc; }).catch(function () { /* giữ bản cũ */ }); }

  /* ---------- form thêm/sửa ---------- */
  function openForm(table, opts, row, onDone) {
    var T = tt(table), md = openModal(), inputs = {}, fixed = opts.fixed || {};
    var form = el('div', { class: 'form' });
    T.cols.forEach(function (c) {
      if (c.k === T.ctx || c.ro) return;
      var input, list = c.t === 'ref' ? S.schema.refs[c.ref] : null;
      var dflt = opts.defaults || {};
      var cur = row ? toRaw(c, row[c.k]) : (fixed[c.k] !== undefined ? fixed[c.k] : (dflt[c.k] !== undefined ? dflt[c.k] : (c.def !== undefined ? toRaw(c, c.def) : '')));
      if (c.t === 'enum') {
        input = el('select', null, (c.req && c.def === undefined ? [] : [el('option', { value: '', text: '— chọn —' })]).concat(
          c.values.map(function (v) { return el('option', { value: v, text: v }); })));
      } else if (list) {
        input = el('select', null, [el('option', { value: '', text: '— chọn —' })].concat(
          list.map(function (o) { return el('option', { value: o.v, text: o.l && o.l !== o.v ? o.v + ' – ' + o.l : o.v }); })));
      } else if (c.t === 'longtext') input = el('textarea', { rows: 3 });
      else {
        var ph = c.t === 'date' ? 'dd/MM/yyyy' : (c.t === 'pct' ? 'vd 5%' : (c.hint || ''));
        input = el('input', { type: 'text', autocomplete: 'off', placeholder: ph });
      }
      input.value = cur;
      if (fixed[c.k] !== undefined) input.disabled = true;
      if (row && T.key.indexOf(c.k) >= 0 && c.k !== 'hieu_luc_tu' && tableLocksKey(table)) input.disabled = true;
      inputs[c.k] = input;
      form.appendChild(el('div', { class: c.t === 'longtext' ? 'full' : '' }, [
        el('label', { class: c.req && c.def === undefined ? 'req' : '', text: c.l }), input
      ]));
    });
    var autoClose = null, errHost = el('div');
    if (T.temporal && !row) {
      autoClose = el('input', { type: 'checkbox', checked: true, style: 'width:auto' });
      form.appendChild(el('div', { class: 'full' }, [el('label', null, [autoClose, ' Tự động kết thúc bản ghi đang còn hiệu lực ngay trước ngày bắt đầu mới'])]));
    }
    var save = el('button', { class: 'btn pri', text: 'Lưu', onclick: function () {
      var vals = {};
      Object.keys(inputs).forEach(function (k) { vals[k] = inputs[k].value; });
      Object.keys(fixed).forEach(function (k) { vals[k] = fixed[k]; });
      save.disabled = true;
      api('save', { table: table, id: row ? row.id : null, row: vals, ctx: opts.ctx, autoClose: autoClose ? autoClose.checked : false })
        .then(function () { md.close(); toast('Đã lưu'); onDone(); })
        .catch(function (e) { clear(errHost).appendChild(errBox(e)); save.disabled = false; });
    } });
    md.m.appendChild(el('h3', { text: (row ? 'Sửa: ' : 'Thêm: ') + T.label }));
    md.m.appendChild(form);
    md.m.appendChild(errHost);
    md.m.appendChild(el('div', { class: 'row-end' }, [el('button', { class: 'btn', text: 'Hủy', onclick: md.close }), save]));
  }
  var LOCK_KEY = { CHI_NHANH: 1, TRUONG: 1, NAM_HOC: 1, KY_LUONG: 1, NGACH_DM: 1, SETTINGS: 1, DEAN: 1, NHAN_SU: 1, USERS: 1, ROLES: 1 };
  function tableLocksKey(t) { return !!LOCK_KEY[t]; }

  /* ---------- nhập CSV nghiêm ngặt ---------- */
  function openImport(table, opts, onDone) {
    var T = tt(table), md = openModal(true), checked = null;
    var ta = el('textarea', { class: 'paste', placeholder: 'Dán dữ liệu từ Excel/Google Sheets vào đây (dòng đầu là tiêu đề cột)…', spellcheck: 'false' });
    var mode = el('select', null, [
      el('option', { value: 'insert', text: 'Chỉ thêm mới (báo lỗi nếu đã tồn tại)' }),
      el('option', { value: 'upsert', text: 'Thêm mới hoặc cập nhật theo khóa' })]);
    var out = el('div'), commit = el('button', { class: 'btn pri', text: 'Nhập vào hệ thống', disabled: true });
    var check = el('button', { class: 'btn', text: 'Kiểm tra dữ liệu' });

    var specBody = el('tbody');
    T.spec.forEach(function (s) {
      specBody.appendChild(el('tr', null, [el('td', { text: s.label }), el('td', { text: s.type }), el('td', { text: s.req ? 'Bắt buộc' : '' }),
        el('td', { class: 'wrap', text: Array.isArray(s.values) ? s.values.join(' | ') : s.values })]));
    });
    var header = T.spec.map(function (s) { return s.label; });
    var spec = el('details', null, [el('summary', { text: 'Xem các cột của mẫu' }),
      el('div', { class: 'tw', style: 'max-height:240px;margin-top:8px' }, [el('table', null, [
        el('thead', null, [el('tr', null, ['Cột', 'Kiểu', '', 'Giá trị hợp lệ'].map(function (h) { return el('th', { text: h }); }))]), specBody])])]);

    function invalidate() { checked = null; commit.disabled = true; }
    ta.addEventListener('input', invalidate);
    mode.addEventListener('change', invalidate);

    check.addEventListener('click', function () {
      var text = ta.value; check.disabled = true; clear(out).appendChild(el('div', { class: 'muted', text: 'Đang kiểm tra…' }));
      api('importCheck', { table: table, text: text, mode: mode.value, ctx: opts.ctx }).then(function (r) {
        check.disabled = false; clear(out);
        if (r.locked) { out.appendChild(el('div', { class: 'alert bad', text: 'Đề án đã ban hành, không nhập được.' })); return; }
        if (r.ok) {
          checked = text; commit.disabled = false;
          out.appendChild(el('div', { class: 'alert ok', text: 'Hợp lệ: ' + r.total + ' dòng (' + r.inserts + ' thêm mới, ' + r.updates + ' cập nhật). Bấm "Nhập vào hệ thống" để ghi.' }));
          return;
        }
        out.appendChild(el('div', { class: 'alert bad', text: 'Có ' + r.errors.length + (r.truncated ? '+' : '') + ' lỗi. Chưa có dòng nào được nhập. Hãy sửa dữ liệu nguồn rồi dán lại.' }));
        var body = el('tbody');
        r.errors.slice(0, 300).forEach(function (e) {
          body.appendChild(el('tr', null, [el('td', { text: e.n ? String(e.n) : '' }), el('td', { text: e.label }),
            el('td', null, [e.value !== '' ? el('span', { class: 'vis', text: e.value }) : null]), el('td', { class: 'wrap', text: e.msg })]));
        });
        out.appendChild(el('div', { class: 'tw' }, [el('table', null, [
          el('thead', null, [el('tr', null, ['Dòng', 'Cột', 'Giá trị (· = khoảng trắng)', 'Lỗi'].map(function (h) { return el('th', { text: h }); }))]), body])]));
      }).catch(function (e) { check.disabled = false; clear(out).appendChild(errBox(e)); });
    });

    commit.addEventListener('click', function () {
      if (checked === null) return;
      commit.disabled = true;
      api('importCommit', { table: table, text: checked, mode: mode.value, ctx: opts.ctx }).then(function (r) {
        md.close(); toast('Đã nhập: ' + r.inserted + ' thêm mới, ' + r.updated + ' cập nhật'); onDone();
      }).catch(function (e) { clear(out).appendChild(errBox(e)); });
    });

    md.m.appendChild(el('h3', { text: 'Nhập CSV: ' + T.label }));
    md.m.appendChild(el('p', { class: 'muted', text: 'Hệ thống không tự sửa dữ liệu. Khoảng trắng thừa, ký tự ẩn, sai danh mục hoặc sai định dạng đều bị báo lỗi và toàn bộ lần nhập bị từ chối.' }));
    md.m.appendChild(spec);
    md.m.appendChild(el('div', { class: 'bar', style: 'margin-top:10px' }, [mode,
      el('button', { class: 'btn', text: 'Chèn tiêu đề mẫu', onclick: function () { ta.value = header.join('\t') + '\n' + ta.value; invalidate(); } })]));
    md.m.appendChild(ta);
    md.m.appendChild(out);
    md.m.appendChild(el('div', { class: 'row-end' }, [el('button', { class: 'btn', text: 'Đóng', onclick: md.close }), check, commit]));
  }

  /* ---------- bảng dữ liệu dùng chung ---------- */
  function TableView(host, table, opts) {
    opts = opts || {};
    var T = tt(table);
    if (!T) { host.appendChild(el('div', { class: 'alert warn', text: 'Bạn không có quyền xem mục này.' })); return; }
    var st = { q: '', page: 0, rows: [], total: 0, locked: false, appendOnly: false, loading: true }, box = el('div');
    host.appendChild(box);

    function load() {
      st.loading = true; render();
      api('list', { table: table, ctx: opts.ctx, q: st.q, page: st.page, filter: opts.filter }).then(function (d) {
        st.rows = d.rows; st.total = d.total; st.locked = d.locked; st.appendOnly = !!d.appendOnly; st.size = d.pageSize; st.loading = false; render();
      }).catch(function (e) { st.loading = false; clear(box).appendChild(errBox(e)); });
    }

    function afterWrite() { refreshSchema().then(load); }

    function render() {
      clear(box);
      var canAdd = T.canWrite && (!st.locked || st.appendOnly), canW = T.canWrite && !st.locked, canI = T.canImport && (!st.locked || st.appendOnly);
      var search = el('input', { type: 'search', placeholder: 'Tìm kiếm…', value: st.q, 'aria-label': 'Tìm kiếm' });
      search.addEventListener('keydown', function (e) { if (e.key === 'Enter') { st.q = search.value; st.page = 0; load(); } });
      box.appendChild(el('div', { class: 'bar' }, [search,
        el('button', { class: 'btn', text: 'Tìm', onclick: function () { st.q = search.value; st.page = 0; load(); } }),
        el('span', { class: 'muted', text: st.loading ? 'Đang tải…' : st.total + ' bản ghi' }), el('span', { class: 'sp' }),
        st.locked ? el('span', { class: 'badge warn', text: st.appendOnly ? 'Đã ban hành - chỉ được thêm chi nhánh mới' : 'Đã ban hành - chỉ xem' }) : null,
        canI ? el('button', { class: 'btn', text: 'Nhập CSV', onclick: function () { openImport(table, opts, afterWrite); } }) : null,

    var send = el('button', { class: 'btn', text: 'Gửi duyệt chốt', onclick: function () {
      if (!tr.value) { toast('Chọn trường cần gửi chốt'); return; }
      api('quyettoan.submit', { ky_ma: ky.value, truong_ma: tr.value }).then(function (r) {
        toast('Đã gửi phiếu ' + r.ma_phieu); location.hash = '#phieu/cua_toi';
      }).catch(function (e) { modalMsg('Chưa gửi được', [errBox(e)]); });
    } });
    host.appendChild(el('div', { class: 'bar' }, [el('b', { text: 'Kỳ' }), ky, tr, run, send]));
    host.appendChild(body);
    draw();
  }

  var STATUS_CLS = { 'Đang duyệt': 'warn', 'Đã duyệt': 'ok', 'Trả lại': 'bad', 'Đã hủy': '' };

  function openPhieu(id, onDone) {
    api('phieu.get', { id: id }).then(function (d) {
      var md = openModal(true), p = d.phieu, note = el('textarea', { rows: 2, placeholder: 'Ghi chú / lý do (bắt buộc khi trả lại hoặc duyệt thay)' });
      md.m.appendChild(el('h3', { text: p.ma + ' · ' + p.tieu_de }));
      md.m.appendChild(el('div', { class: 'bar' }, [el('span', { class: 'badge ' + (STATUS_CLS[p.trang_thai] || ''), text: p.trang_thai }),
        el('span', { class: 'muted', text: p.loai + ' · tạo bởi ' + p.nguoi_tao })]));
      var tl = el('ol', { style: 'padding-left:18px' });
      d.steps.forEach(function (s, i) {
        var done = p.trang_thai === 'Đã duyệt' || i + 1 < p.buoc || (p.trang_thai === 'Đã duyệt');
        var cur = p.trang_thai === 'Đang duyệt' && i + 1 === p.buoc;
        tl.appendChild(el('li', null, [el('b', { text: s.ten_buoc }), ' ', el('span', { class: 'muted', text: s.hanh_dong + ' · ' + s.vai_tro + ' · ' + s.pham_vi }), ' ',
          el('span', { class: 'badge ' + (done ? 'ok' : (cur ? 'warn' : '')), text: done ? 'Đã qua' : (cur ? 'Đang chờ' : 'Chưa tới') })]));
      });
      md.m.appendChild(el('h3', { text: 'Quy trình' })); md.m.appendChild(tl);
      var head = el('tr', null, d.items.head.map(function (h) { return el('th', { text: h }); }));
      var body = el('tbody');
      d.items.rows.forEach(function (r) { body.appendChild(el('tr', null, r.map(function (v) { return el('td', { class: 'wrap', text: v === undefined || v === null ? '' : String(v) }); }))); });
      md.m.appendChild(el('h3', { text: 'Nội dung (' + d.items.total + ')' }));
      md.m.appendChild(el('div', { class: 'tw', style: 'max-height:260px' }, [el('table', null, [el('thead', null, [head]), body])]));
      md.m.appendChild(el('h3', { style: 'margin-top:12px', text: 'Lịch sử' }));
      md.m.appendChild(el('ul', null, d.log.map(function (l) {
        return el('li', { text: l.ts.replace('T', ' ') + ' · ' + l.email + ' · ' + l.hanh_dong + (l.ghi_chu ? ': ' + l.ghi_chu : '') });
      })));
      var errHost = el('div'), acts = [];
      function act(action) {
        api('phieu.act', { id: id, action: action, note: note.value }).then(function () { md.close(); toast('Đã ' + action.toLowerCase()); onDone(); })
          .catch(function (e) { clear(errHost).appendChild(errBox(e)); });
      }
      if (d.can_act) {
        md.m.appendChild(note);
        if (d.act_mode === 'admin') md.m.appendChild(el('div', { class: 'alert warn', text: 'Bạn không phải người xử lý bước này. Quản trị viên có thể duyệt thay (bắt buộc ghi lý do, có lưu nhật ký).' }));
        if (d.act_mode === 'uy_quyen') md.m.appendChild(el('div', { class: 'alert warn', text: 'Bạn đang duyệt theo ủy quyền.' }));
        acts.push(el('button', { class: 'btn dng', text: 'Trả lại', onclick: function () { act('Trả lại'); } }));
        acts.push(el('button', { class: 'btn pri', text: p.buoc >= p.so_buoc ? 'Phê duyệt cuối' : 'Duyệt', onclick: function () { act('Duyệt'); } }));
      }
      if (d.can_cancel) acts.unshift(el('button', { class: 'btn', text: 'Hủy phiếu', onclick: function () {
        if (!confirm('Hủy phiếu này?')) return;
        api('phieu.cancel', { id: id }).then(function () { md.close(); toast('Đã hủy phiếu'); onDone(); }).catch(function (e) { clear(errHost).appendChild(errBox(e)); });
      } }));
      md.m.appendChild(errHost);
      md.m.appendChild(el('div', { class: 'row-end' }, [el('button', { class: 'btn', text: 'Đóng', onclick: md.close })].concat(acts)));
    }).catch(showErr);
  }

  function phieuList(host, tab) {
    var box = el('div'); host.appendChild(box);
    function load() {
      api('phieu.list', { tab: tab }).then(function (d) {
        clear(box);
        if (!d.rows.length) { box.appendChild(el('div', { class: 'muted', text: tab === 'cho_toi' ? 'Không có phiếu nào đang chờ bạn xử lý.' : 'Chưa có phiếu.' })); return; }
        var body = el('tbody');
        d.rows.forEach(function (r) {
          body.appendChild(el('tr', null, [el('td', { text: r.ma }), el('td', { class: 'wrap', text: r.tieu_de }), el('td', { text: r.loai }),
            el('td', { text: r.truong }), el('td', null, [el('span', { class: 'badge ' + (STATUS_CLS[r.trang_thai] || ''), text: r.trang_thai })]),
            el('td', { text: r.trang_thai === 'Đang duyệt' ? 'Bước ' + r.buoc + '/' + r.so_buoc + ': ' + r.buoc_ten : '' }),
            el('td', { text: r.nguoi_tao }), el('td', { text: r.at.slice(0, 10).split('-').reverse().join('/') }),
            el('td', null, [el('button', { class: 'btn sm' + (r.can_act ? ' pri' : ''), text: r.can_act ? 'Xử lý' : 'Xem', onclick: function () { openPhieu(r.id, load); } })])]));
        });
        box.appendChild(el('div', { class: 'tw' }, [el('table', null, [el('thead', null, [el('tr', null,
          ['Mã', 'Tiêu đề', 'Loại', 'Trường', 'Trạng thái', 'Tiến độ', 'Người tạo', 'Ngày', ''].map(function (h) { return el('th', { text: h }); }))]), body])]));
      }).catch(function (e) { clear(box).appendChild(errBox(e)); });
    }
    load();
  }

  function openNewPhieu() {
    var md = openModal(), kind = select([{ v: 'ngach', l: 'Đề xuất ngạch bậc' }, { v: 'khac', l: 'Phiếu khác' }], 'ngach'), form = el('div', { class: 'form' }), errHost = el('div');
    var f = {};
    function field(k, label, node, full) { f[k] = node; form.appendChild(el('div', { class: full ? 'full' : '' }, [el('label', { text: label }), node])); }
    function build() {
      clear(form); f = {};
      if (kind.value === 'ngach') {
        field('ma_nv', 'Mã nhân sự', el('input', { type: 'text', autocomplete: 'off' }));
        field('ngach_ma', 'Ngạch đề xuất', select(S.schema.refs['NGACH_DM.ma'] || [], '', '— chọn —'));
        field('hieu_luc_tu', 'Hiệu lực từ (dd/MM/yyyy)', el('input', { type: 'text' }));
        field('so_quyet_dinh', 'Số quyết định (nếu có)', el('input', { type: 'text' }));
        field('ly_do', 'Lý do đề xuất', el('textarea', { rows: 2 }), true);
      } else {
        field('tieu_de', 'Tiêu đề', el('input', { type: 'text' }), true);
        field('truong_ma', 'Trường', select(truongOptions(), '', '— chọn —'));
        field('noi_dung', 'Nội dung', el('textarea', { rows: 4 }), true);
      }
    }
    kind.addEventListener('change', build); build();
    var go = el('button', { class: 'btn pri', text: 'Gửi duyệt', onclick: function () {
      var p = {}; Object.keys(f).forEach(function (k) { p[k] = f[k].value; });
      go.disabled = true;
      api(kind.value === 'ngach' ? 'ngach.propose' : 'phieu.other', p).then(function (r) { md.close(); toast('Đã gửi phiếu ' + r.ma_phieu); location.hash = '#phieu/cua_toi'; route(); })
        .catch(function (e) { go.disabled = false; clear(errHost).appendChild(errBox(e)); });
    } });
    md.m.appendChild(el('h3', { text: 'Tạo phiếu đề xuất' }));
    md.m.appendChild(el('div', { class: 'bar' }, [kind]));
    md.m.appendChild(form); md.m.appendChild(errHost);
    md.m.appendChild(el('div', { class: 'row-end' }, [el('button', { class: 'btn', text: 'Hủy', onclick: md.close }), go]));
  }

  function pagePhieu(host, sub) {
    host.appendChild(el('h2', { text: 'Phiếu duyệt' }));
    var items = [{ key: 'cho_toi', label: 'Chờ tôi xử lý', render: function (b) { phieuList(b, 'cho_toi'); } },
      { key: 'cua_toi', label: 'Phiếu của tôi', render: function (b) { phieuList(b, 'cua_toi'); } }];
    if (S.me.perms.indexOf('phieu.view') >= 0) items.push({ key: 'tat_ca', label: 'Tất cả trong phạm vi', render: function (b) { phieuList(b, 'tat_ca'); } });
    if (S.me.perms.indexOf('phieu.create') >= 0) host.appendChild(el('div', { class: 'bar' }, [el('span', { class: 'sp' }),
      el('button', { class: 'btn pri', text: '+ Tạo phiếu đề xuất', onclick: openNewPhieu })]));
    Tabs(host, items, sub, function (k) { history.replaceState(null, '', '#phieu/' + k); });
  }

  /* ---------- thông báo ---------- */
  function refreshBell(btn) {
    api('notify.list').then(function (d) {
      clear(btn).appendChild(document.createTextNode('🔔'));
      if (d.unread) btn.appendChild(el('span', { class: 'dot', text: String(d.unread) }));
    }).catch(function () { /* im lặng */ });
  }
  function toggleBell(btn) {
    if (S.bellBox) { S.bellBox.remove(); S.bellBox = null; return; }
    api('notify.list').then(function (d) {
      var box = el('div', { class: 'drop' });
      box.appendChild(el('div', { class: 'bar', style: 'padding:8px 12px;margin:0' }, [el('b', { text: 'Thông báo' }), el('span', { class: 'sp' }),
        el('button', { class: 'btn sm', text: 'Đánh dấu đã đọc', onclick: function () { api('notify.read', {}).then(function () { toggleBell(btn); toggleBell(btn); refreshBell(btn); }); } })]));
      if (!d.items.length) box.appendChild(el('div', { class: 'it muted', text: 'Chưa có thông báo.' }));
      d.items.forEach(function (n) {
        box.appendChild(el('div', { class: 'it' + (n.read ? '' : ' un'), onclick: function () {
          api('notify.read', { ids: [n.id] }).then(function () { refreshBell(btn); });
          if (n.link) location.hash = '#' + n.link;
          if (S.bellBox) { S.bellBox.remove(); S.bellBox = null; }
        } }, [el('b', { text: n.title }), el('span', { class: 'muted', text: n.body }), el('div', { class: 'muted', style: 'font-size:11px', text: n.at.replace('T', ' ') })]));
      });
      document.body.appendChild(box); S.bellBox = box;
    }).catch(showErr);
  }

  /* ---------- khung & định tuyến ---------- */
  var PAGES = [
    { id: 'dash', label: 'Tổng quan', show: function () { return true; }, render: pageDash },
    { id: 'setup', label: 'Thiết lập', show: function () { return !!tt('CHI_NHANH'); }, render: pageSetup },
    { id: 'dean', label: 'Đề án', show: function () { return !!tt('DEAN'); }, render: pageDean },
    { id: 'staff', label: 'Nhân sự', show: function () { return !!tt('NHAN_SU') || !!tt('THU_NHAP_NEN'); }, render: pageStaff },
    { id: 'declare', label: 'Khai báo', show: function () { return !!tt('KHAI_BAO'); }, render: pageDeclare },
    { id: 'calc', label: 'Quyết toán', show: function () { return !!tt('QUYET_TOAN'); }, render: pageCalc },
    { id: 'phieu', label: 'Phiếu duyệt', show: function () { return true; }, render: pagePhieu },
    { id: 'admin', label: 'Hệ thống', show: function () { return !!tt('USERS') || !!tt('AUDIT_LOG'); }, render: pageAdmin }
  ];

  function route() {
    if (S.bellBox) { S.bellBox.remove(); S.bellBox = null; }
    var parts = location.hash.replace(/^#/, '').split('/'), id = parts[0] || 'dash', sub = parts.slice(1).join('/') || '';
    var page = PAGES.filter(function (p) { return p.id === id && p.show(); })[0] || PAGES[0];
    Array.prototype.forEach.call(S.nav.children, function (a) { a.className = a.getAttribute('data-p') === page.id ? 'on' : ''; });
    clear(S.main);
    page.render(S.main, sub);
  }

  function start() {
    Promise.all([api('me'), api('schema')]).then(function (r) {
      S.me = r[0]; S.schema = r[1];
      var app = clear(document.getElementById('app'));
      S.nav = el('nav');
      PAGES.forEach(function (p) {
        if (p.show()) S.nav.appendChild(el('a', { 'data-p': p.id, tabindex: '0', text: p.label, onclick: function () { location.hash = '#' + p.id; } }));
      });
      var bell = el('button', { class: 'bell', 'aria-label': 'Thông báo', text: '🔔', onclick: function () { toggleBell(bell); } });
      app.appendChild(el('header', { class: 'top' }, [el('div', { class: 'top-in' }, [
        el('span', { class: 'brand', text: 'VAS · Hệ thống Lương' }), S.nav, bell,
        el('span', { class: 'who', text: S.me.name + (S.me.isAdmin ? ' (Quản trị)' : '') })])]));
      S.main = el('main');
      app.appendChild(S.main);
      refreshBell(bell);
      setInterval(function () { refreshBell(bell); }, 90000);
      window.addEventListener('hashchange', route);
      route();
    }).catch(function (e) {
      if (e instanceof Error) console.error(e);
      clear(document.getElementById('app')).appendChild(el('div', { class: 'boot' }, [errBox(e instanceof Error ? { error: 'Lỗi giao diện: ' + e.message } : e)]));
    });
  }

  start();
})();
</script>

</body>
</html>
