<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#e3e7ee;--pri:#0f6e56;--pri-l:#e1f5ee;--ok:#1a7f4b;--ok-l:#e3f5ea;--warn:#a96a00;--warn-l:#fdf1d9;--bad:#b42318;--bad-l:#fde8e6;--over:#7a3db8;--over-l:#f0e6fa}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;flex:1;min-width:200px}header small{opacity:.85}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
nav button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--mut);font:inherit;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{padding:16px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi b{font-size:24px;display:block}.kpi span{color:var(--mut);font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#fafbfc;font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0;white-space:nowrap}
td.c,th.c{text-align:center}tr:hover td{background:#fafcfb}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #ccd3dd;border-radius:6px;background:#fff;max-width:100%}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--pri)}
button.b{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid #ccd3dd;background:#fff;cursor:pointer}
button.b:hover{background:#f0f3f6}button.p{background:var(--pri);border-color:var(--pri);color:#fff}button.p:hover{background:#0b5a46}
button.d{color:var(--bad);border-color:#f2c4bf}button.s{padding:3px 8px;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-l);color:var(--ok)}.thieu{background:var(--bad-l);color:var(--bad)}.thua{background:var(--warn-l);color:var(--warn)}.vuot{background:var(--over-l);color:var(--over)}.trong{background:#eef0f3;color:var(--mut)}
td.cell{text-align:center;font-weight:600;white-space:nowrap}td.cell small{display:block;font-weight:400;color:var(--mut);font-size:11px}
td.cell.ok{background:var(--ok-l)}td.cell.thieu{background:var(--bad-l)}td.cell.thua{background:var(--warn-l)}
.chip{display:inline-block;background:var(--pri-l);color:var(--pri);border-radius:6px;padding:1px 7px;margin:1px;font-size:12px}
.muted{color:var(--mut)}.warn{background:var(--warn-l);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:8px}
.mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:12px;padding:18px;width:min(560px,100%)}.modal.w{width:min(900px,100%)}
.modal h3{margin:0 0 12px}.modal label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mut)}.modal input,.modal select,.modal textarea{width:100%}
.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:9px 16px;border-radius:8px;z-index:50;display:none;max-width:90vw}
#toast.err{background:var(--bad)}
.sub{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.sub button{border-radius:99px}.sub button.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.mx th.rot{white-space:normal;min-width:92px;text-align:center}
.hint{font-size:12px;color:var(--mut);margin:4px 0 10px}
.loading{padding:40px;text-align:center;color:var(--mut)}
@media(max-width:700px){main{padding:10px}}
.printonly{display:none}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0f6e56,#0b4a3a);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#login .box{background:#fff;border-radius:14px;padding:26px;width:min(400px,100%);box-shadow:0 10px 40px #0004}
#login h2{margin:0 0 6px;font-size:19px}#login p{margin:6px 0 14px;color:var(--mut)}
#login input{width:100%;font-size:26px;letter-spacing:10px;text-align:center;padding:10px}
#login .err{color:var(--bad);min-height:20px;margin:8px 0;font-size:13px}
#login button.b{width:100%;margin-top:8px;padding:10px}
a.b{display:inline-block;text-decoration:none;color:inherit;padding:6px 12px;border:1px solid #ccd3dd;border-radius:6px;background:#fff}a.b.p{background:var(--pri);border-color:var(--pri);color:#fff}
.flow{display:flex;gap:4px;flex-wrap:wrap}.flow .tag{font-weight:500}
.impact{background:#f4f8f7;border:1px solid #cfe6df;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px}
.impact b{font-weight:600}.impact ul{margin:6px 0 0;padding-left:18px}
.ap{display:flex;gap:6px;align-items:center;background:#f4f6f8;border-radius:8px;padding:6px 10px;margin:4px 0}
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;font-size:11px}
 header,nav,#toast,.noprint{display:none!important}
 .printonly{display:block;margin-bottom:8px}
 main{padding:0;max-width:none}
 .card,.kpi{break-inside:avoid;border-color:#bbb}
 .tw{overflow:visible}th{position:static}
 body.pm main{display:none}
 .mask{position:static;background:none;padding:0;display:block}
 .modal{width:100%!important;padding:0;border-radius:0}
 .modal .act{display:none}
 td.cell,.tag,.chip{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header><h1>Định biên & Phân công nhân sự – Khối Mầm non Việt Mỹ <small id="nh"></small></h1><small id="stamp"></small><button class="b s" id="lo" data-do="logout" style="display:none;background:#ffffff22;color:#fff;border-color:#ffffff66">Đăng xuất</button><button class="b s" data-do="refresh" title="Tải lại dữ liệu từ máy chủ" style="background:#ffffff22;color:#fff;border-color:#ffffff66">⟳ Làm mới</button><small id="who"></small></header>
<div class="printonly" id="ph" style="text-align:center"><b>HỆ THỐNG TRƯỜNG VIỆT MỸ – KHỐI MẦM NON</b><br><span id="ptitle"></span></div>
<nav id="nav"></nav>
<main id="main"><div class="loading">Đang tải…</div></main>
<div id="login"></div>
<div id="toast"></div>
<div id="modal"></div>

<script>
const S={boot:null,tab:'dash',campus:'',cache:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can=p=>S.boot.me.perms.indexOf(p)>=0;
const ST={ok:'Đạt',thieu:'Thiếu',thua:'Thừa',vuot:'Vượt tỉ lệ',trong:'Chưa có sĩ số'};
const tag=s=>`<span class="tag ${s}">${ST[s]||s}</span>`;

const TK='vm_dinhbien_tok';
const tokStore={get(){try{return localStorage.getItem(TK)||''}catch(e){return S.mem||''}},set(v){S.mem=v;try{v?localStorage.setItem(TK,v):localStorage.removeItem(TK)}catch(e){}}};
S.token=tokStore.get();
function call(action,payload){
  return new Promise((res,rej)=>google.script.run
    .withSuccessHandler(r=>{if(r&&r.ok)return res(r.data);if(r&&r.auth)showLogin();rej(new Error(r?r.error:'Lỗi không xác định'))})
    .withFailureHandler(e=>rej(new Error(e.message||e)))
    .api(action,payload||{},S.token||''));
}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?6000:2500)}
async function act(fn){try{return await fn()}catch(e){toast(e.message,true);throw e}}
function modal(title,body,ok,opts={}){
  $('#modal').innerHTML=`<div class="mask"><div class="modal ${opts.wide?'w':''}"><h3>${title}</h3>${body}<div class="act"><button class="b" id="mc">${ok?'Huỷ':'Đóng'}</button>${ok?'<button class="b p" id="mo">'+(opts.okText||'Lưu')+'</button>':''}</div></div></div>`;
  $('#mc').onclick=closeModal;
  if(ok)$('#mo').onclick=async()=>{try{await ok();closeModal();if(S.afterModal){const f=S.afterModal;S.afterModal=null;f()}}catch(e){toast(e.message,true)}};
}
function closeModal(){$('#modal').innerHTML=''}
const val=id=>document.getElementById(id).value;

/* ---------- khởi động ---------- */
async function startApp(){
  try{await load()}catch(e){$('#main').innerHTML=`<div class="card"><h3>Không thể truy cập</h3><p>${esc(e.message)}</p></div>`;return}
  $('#who').textContent=S.boot.me.name+' · '+S.boot.me.role;
  $('#nh').textContent='· NH '+(S.boot.cfg.params.NamHoc||'');
  S.campus=S.boot.campuses.length===1?S.boot.campuses[0].MaCoSo:'';
  const tabs=[['dash','Tổng quan','dash.view'],['campus','Báo cáo cơ sở','dash.view'],['staff','Nhân sự','staff.view'],['classes','Lớp học','class.view'],['config','Cấu hình','config.edit'],['approval','Phê duyệt',['approval.submit','approval.approve','approval.viewall']],['history','Lịch sử phân công','history.view'],['perm','Phân quyền','admin.perm'],['audit','Nhật ký','audit.view']].filter(t=>Array.isArray(t[2])?t[2].some(can):can(t[2]));
  $('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t[0]}">${t[1]}</button>`).join('');
  if(!tabs.length){$('#main').innerHTML='<div class="card">Tài khoản chưa được cấp chức năng nào.</div>';return}
  updBadge();go(tabs[0][0]);
}
const DATA_TABS=['dash','campus','staff','classes','approval'];
function updBadge(){const b=document.querySelector('[data-tab="approval"]');if(!b)return;const n=(S.cache.approvals||[]).filter(x=>x.toiDuyet).length;b.innerHTML='Phê duyệt'+(n?' <span class="tag thieu">'+n+'</span>':'')}
async function load(){
  const d=await call('loadAll');
  S.boot=d.boot;S.cache.report=d.report;S.cache.staff=d.staff;S.cache.classes=d.classes;S.cache.approvals=d.approvals||[];S.t=Date.now();updBadge();
  const el=$('#stamp');if(el)el.textContent='Cập nhật '+new Date().toTimeString().slice(0,5)+' ';
}
/* silent=true: nền, không làm gián đoạn thao tác đang dở; false: tải xong vẽ lại ngay */
async function refresh(silent){
  try{await load()}catch(e){if(!silent)toast(e.message,true);return}
  if(DATA_TABS.indexOf(S.tab)<0)return;
  if(silent&&($('#modal').innerHTML||/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')))return;
  go(S.tab,false);
}
async function go(tab,fetchIfStale=true){
  S.tab=tab;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='perm'&&!S.pm||tab==='audit'||tab==='history')$('#main').innerHTML='<div class="loading">Đang tải…</div>';
  try{await VIEWS[tab]()}catch(e){$('#main').innerHTML=`<div class="card warn">${esc(e.message)}</div>`}
  if(fetchIfStale&&DATA_TABS.indexOf(tab)>=0&&Date.now()-S.t>30000)refresh(true);
}
const campusSel=(id,all=true)=>`<select id="${id}">${all?'<option value="">— Tất cả cơ sở —</option>':''}${S.boot.campuses.map(c=>`<option value="${esc(c.MaCoSo)}" ${S.campus===c.MaCoSo?'selected':''}>${esc(c.TenCoSo)}</option>`).join('')}</select>`;
const campName=id=>(S.boot.allCampuses.find(c=>c.MaCoSo===id)||{}).TenCoSo||id;

/* ---------- Xuất Excel / In ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const posTxt=p=>p.min===p.max?p.min:p.min+'–'+p.max;
const diffOf=p=>p.actual<p.min?p.actual-p.min:p.actual>p.max?p.actual-p.max:0;
function colW(rows){const n=Math.max(0,...rows.map(r=>r.length)),w=[];for(let i=0;i<n;i++)w.push({wch:Math.min(45,Math.max(8,...rows.map(r=>String(r[i]==null?'':r[i]).length)+2))});return w}
function xlsx(file,sheets){
  if(!window.XLSX){ // không tải được thư viện → CSV
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+sheets.map(s=>s.rows.map(r=>r.map(q).join(',')).join('\r\n')).join('\r\n\r\n')],{type:'text/csv;charset=utf-8'}));a.download=file+'.csv';document.body.appendChild(a);a.click();a.remove();
    return toast('Không tải được thư viện Excel – đã xuất CSV thay thế',true)}
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(s.rows);ws['!cols']=colW(s.rows);XLSX.utils.book_append_sheet(wb,ws,s.name.slice(0,31))});
  XLSX.writeFile(wb,file+'.xlsx');
}
function printNow(title){
  $('#ptitle').textContent=title+' · In ngày '+new Date().toLocaleDateString('vi-VN')+' · '+S.boot.me.name;
  document.body.classList.toggle('pm',!!$('#modal').innerHTML);
  setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove('pm'),500)},50);
}
function reportSheets(list,po){
  const m=[['Cơ sở','Tổng sĩ số','Khung',...po.map(x=>x+' (thực tế / định biên)'),'Kết luận']];
  const d=[['Cơ sở','Tổng sĩ số','Khung','Vị trí','Định biên tối thiểu','Định biên tối đa','Thực tế','Chênh lệch','Kết luận']];
  const l=[['Cơ sở','Lớp','Lứa tuổi','Sĩ số','Giữ chỗ','Tổng','GV (có/định biên)','Bảo mẫu (có/định biên)','Tỉ lệ chuẩn','Tỉ lệ thực','Kết luận','Ghi chú']];
  list.forEach(c=>{
    m.push([c.TenCoSo,c.total,c.band?c.band.Nhan:'',...c.positions.map(p=>p.actual+' / '+posTxt(p)),ST[c.status]]);
    c.positions.forEach(p=>d.push([c.TenCoSo,c.total,c.band?c.band.Nhan:'',p.viTri,p.min,p.max,p.actual,diffOf(p),ST[p.status]]));
    c.classes.forEach(x=>l.push([c.TenCoSo,x.TenLop,x.LuaTuoi,x.siSo,x.giuCho,x.students,x.gv+'/'+x.stdGV,x.bm+'/'+x.stdBM,x.tiLe+':1',x.ratioActual==null?'':x.ratioActual+':1',ST[x.status],x.issues.join('; ')]));
  });
  return [{name:'Tổng hợp',rows:m},{name:'Chi tiết vị trí',rows:d},{name:'Lớp học',rows:l}];
}
function snapSheets(a,b,df){
  const st=[['Mã NV','Họ tên','Chức danh HR','Vai trò định biên','Lớp phụ trách','Trạng thái']].concat(a.staff.map(x=>[x.MaNV,x.HoTen,x.ChucDanhHR,x.VaiTroDB,(x.lop||[]).join('; '),x.TrangThai]));
  const r=a.report,out=[{name:'Nhân sự',rows:st},{name:'Lớp học',rows:[['Lớp','Sĩ số + giữ chỗ','GV','Bảo mẫu','Kết luận']].concat(r.classes.map(l=>[l.TenLop,l.students,l.gv+'/'+l.stdGV,l.bm+'/'+l.stdBM,ST[l.status]]))},
   {name:'Định biên',rows:[['Vị trí','Định biên','Thực tế','Chênh lệch','Kết luận']].concat(r.positions.map(p=>[p.viTri,posTxt(p),p.actual,diffOf(p),ST[p.status]]))}];
  if(b&&df)out.push({name:'Thay đổi',rows:[['Mã NV','Họ tên','Loại','Trước (vai trò | lớp)','Sau (vai trò | lớp)']].concat(df)});
  return out;
}

/* ---------- Tổng quan ---------- */
const VIEWS={};
VIEWS.dash=async()=>{
  const r=S.cache.report;
  const s=r.summary,po=r.positionOrder;
  const cellOf=p=>`<td class="cell ${p.status}">${p.actual}<small>${p.min===p.max?p.min:p.min+'–'+p.max}</small></td>`;
  $('#main').innerHTML=`
  <div class="kpis">
   <div class="kpi"><b>${s.campuses}</b><span>Cơ sở</span></div>
   <div class="kpi"><b style="color:var(--ok)">${s.ok}</b><span>Đạt định biên</span></div>
   <div class="kpi"><b style="color:var(--bad)">${s.thieu}</b><span>Thiếu nhân sự</span></div>
   <div class="kpi"><b style="color:var(--over)">${s.vuot}</b><span>Vượt tỉ lệ lớp</span></div>
   <div class="kpi"><b style="color:var(--warn)">${s.thua}</b><span>Thừa so với định biên</span></div>
   <div class="kpi"><b>${s.short}</b><span>Tổng vị trí còn thiếu</span></div>
   <div class="kpi"><b>${s.surplus}</b><span>Tổng vị trí đang thừa</span></div>
  </div>
  <div class="card"><div class="row"><h3 class="grow" style="margin:0">Đối chiếu định biên theo cơ sở – NH ${esc(r.namHoc||'')}</h3>
   ${can('report.export')?'<span class="noprint"><button class="b" data-do="xdash">⬇ Excel</button> <button class="b" data-do="pdash">🖨 In</button></span>':''}</div>
   <div class="hint noprint">Mỗi ô: số thực tế (dòng nhỏ: định biên theo khung sĩ số). Xanh = đạt · Đỏ = thiếu · Vàng = thừa. Bấm tên cơ sở để xem chi tiết.</div>
   <div class="tw"><table class="mx"><thead><tr><th>Cơ sở</th><th class="c">Sĩ số</th><th>Khung</th>${po.map(p=>`<th class="rot">${esc(p)}</th>`).join('')}<th class="c">Lớp thiếu</th><th class="c">Đủ ĐK đề xuất</th><th>Kết luận</th></tr></thead><tbody>
   ${r.campuses.map(c=>`<tr><td style="white-space:nowrap"><a href="#" data-campus="${esc(c.MaCoSo)}"><b>${esc(c.TenCoSo)}</b></a></td><td class="c">${c.total}</td><td style="white-space:nowrap">${esc(c.band?c.band.Nhan:'—')}</td>${c.positions.map(cellOf).join('')}
   <td class="c">${c.classes.filter(l=>l.status==='thieu').length}/${c.classes.length}</td><td class="c">${c.canPropose?'✔':''}</td><td>${tag(c.status)}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">Chưa có cơ sở nào.</td></tr>'}
   </tbody></table></div></div>`;
};

/* ---------- Báo cáo cơ sở ---------- */
VIEWS.campus=async()=>{
  if(!S.campus&&S.boot.campuses.length)S.campus=S.boot.campuses[0].MaCoSo;
  const c=S.cache.report.campuses.find(x=>x.MaCoSo===S.campus);
  const head=`<div class="row noprint">${campusSel('csel',false)}<span class="grow"></span>${can('report.export')?'<button class="b" data-do="xcampus">⬇ Excel</button> <button class="b" data-do="pcampus">🖨 In</button>':''}</div>`;
  if(!c){$('#main').innerHTML=head+'<div class="card">Chưa có dữ liệu.</div>';bindSel();return}
  $('#main').innerHTML=head+`
  <div class="kpis">
   <div class="kpi"><b>${c.total}</b><span>Tổng sĩ số (thực học + giữ chỗ)</span></div>
   <div class="kpi"><b style="font-size:16px">${esc(c.band?c.band.Nhan:'—')}</b><span>Khung định biên áp dụng</span></div>
   <div class="kpi"><b>${c.staffActive}</b><span>Nhân sự đang làm</span></div>
   <div class="kpi"><b>${tag(c.status)}</b><span>Kết luận chung</span></div></div>
  ${c.warnings.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}

function parsePaste(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const sp=l=>l.indexOf('\t')>=0?l.split('\t'):l.split(/[;,]/);
  const norm=x=>x.toLowerCase().replace(/\s+/g,'');
  const keys={manv:'MaNV',mãnv:'MaNV',mãnhânviên:'MaNV',hotên:'HoTen',họtên:'HoTen',họvàtên:'HoTen',cơsở:'CoSo',cosở:'CoSo',đơnvị:'CoSo',chứcdanh:'ChucDanhHR',chứcvụ:'ChucDanhHR',chứcvụchính:'ChucDanhHR',trạngthái:'TrangThai'};
  let cols=['MaNV','HoTen','CoSo','ChucDanhHR','TrangThai'],start=0;
  const first=sp(lines[0]).map(norm);
  if(first.some(x=>keys[x])){cols=first.map(x=>keys[x]||'');start=1}
  return lines.slice(start).map(l=>{const c=sp(l),o={};cols.forEach((k,i)=>{if(k)o[k]=(c[i]||'').trim()});return o});
}

function mailDraft(it,ev){
  const pend=it.luong.filter(x=>x.tt==='cho'),me=S.boot.me.name,link=S.boot.appUrl?'\n\nMở hệ thống: '+S.boot.appUrl:'';
  const ref='Hồ sơ '+it.MaPD+' – '+it.TieuDe+' ('+it.TenCoSo+', kỳ '+it.Ky+')';
  if(ev==='done'){
    const bad=it.luong.find(x=>x.tt==='tuchoi'),ok=it.TrangThai==='Đã duyệt';
    return {to:[it.NguoiGui],su:'[Định biên MN] '+it.MaPD+' – '+it.TrangThai,
      body:'Kính gửi '+it.TenNguoiGui+',\n\n'+ref+' '+(ok?'đã được phê duyệt hoàn tất.':'đã bị '+(bad?bad.hoTen+' ':'')+'từ chối.'+(bad&&bad.yKien?'\nLý do: '+bad.yKien:''))+link+'\n\nTrân trọng,\n'+me};
  }
  const to=(it.CheDo==='Tuần tự'?pend.slice(0,1):pend);
  return {to:to.map(x=>x.email),su:'[Định biên MN] Đề nghị phê duyệt '+it.MaPD,
    body:'Kính gửi '+to.map(x=>x.hoTen).join(', ')+',\n\n'+it.TenNguoiGui+' đề nghị phê duyệt: '+ref+'.'+(it.GhiChu?'\nNội dung: '+it.GhiChu:'')+link+'\n\nTrân trọng,\n'+me};
}
function noticeMail(id,ev){

  const m=mailDraft(it,ev);if(!m.to.length)return;
  const q=encodeURIComponent,me=S.boot.me.email;
  const gm='https://mail.google.com/mail/?authuser='+q(me)+'&view=cm&fs=1&to='+q(m.to.join(','))+'&su='+q(m.su)+'&body='+q(m.body);
  const mt='mailto:'+m.to.map(q).join(',')+'?subject='+q(m.su)+'&body='+q(m.body);

const stfKey=x=>(x.VaiTroDB||'—')+' | '+(x.lop||[]).join(', ');
function diffSnap(a,b){
  const ma={},mb={};a.staff.forEach(x=>ma[x.MaNV]=x);b.staff.forEach(x=>mb[x.MaNV]=x);
  const act=x=>x&&x.TrangThai!=='Nghỉ việc';
  const out=[];
  Object.keys(Object.assign({},ma,mb)).forEach(id=>{
    const x=act(ma[id])?ma[id]:null,y=act(mb[id])?mb[id]:null,n=(y||x||{}).HoTen;
    if(!x&&y)out.push([id,n,'Mới / quay lại','—',stfKey(y)]);
    else if(x&&!y)out.push([id,n,'Không còn',stfKey(x),'—']);
    else if(x&&y&&stfKey(x)!==stfKey(y))out.push([id,n,'Thay đổi',stfKey(x),stfKey(y)]);
  });
  return out;
}

}

/* ---------- Đăng nhập bằng mã xác nhận ---------- */
let LG={cd:0,timer:null};
async function boot(){
  let st;try{st=await call('authStatus')}catch(e){$('#main').innerHTML=`<div class="card warn">${esc(e.message)}</div>`;return}
  S.otp=st.required;$('#lo').style.display=st.required?'':'none';
  if(st.required&&!st.valid)return showLogin();
  startApp();
}
async function showLogin(){
  if(S.logging)return;S.logging=true;S.token='';tokStore.set('');clearInterval(LG.timer);
  $('#login').style.display='flex';$('#main').innerHTML='';
  let st={};try{st=await call('authStatus')}catch(e){}
  S.otp=true;$('#lo').style.display='';
  loginStep(1,st.masked||'',st.hours||8,'');
}
function loginStep(step,masked,hours,err,minutes){
  const box=n=>$('#login').innerHTML=`<div class="box"><h2>🔐 Xác nhận đăng nhập</h2>${n}</div>`;
  if(step===1)box(`<p>Hệ thống sẽ gửi <b>mã xác nhận 6 số</b> tới email <b>${esc(masked)}</b>. Mã có hiệu lực 5 phút; sau khi xác nhận bạn được dùng liên tục ${hours} giờ.</p><div class="err">${esc(err)}</div><button class="b p" id="lg_send">Gửi mã xác nhận</button>`);
  else box(`<p>Đã gửi mã tới <b>${esc(masked)}</b> (hiệu lực ${minutes||5} phút). Kiểm tra cả thư mục Spam.</p><input id="lg_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><div class="err">${esc(err)}</div><button class="b p" id="lg_ok">Xác nhận</button><button class="b" id="lg_re" disabled>Gửi lại mã</button>`);
  const q=id=>document.getElementById(id);
  if(step===1)q('lg_send').onclick=()=>sendCode(masked,hours);
  else{
    const c=q('lg_code');c.focus();c.oninput=()=>{c.value=c.value.replace(/\D/g,'');if(c.value.length===6)verifyCode(masked,hours)};
    c.onkeydown=e=>{if(e.key==='Enter')verifyCode(masked,hours)};
    q('lg_ok').onclick=()=>verifyCode(masked,hours);q('lg_re').onclick=()=>sendCode(masked,hours);
    clearInterval(LG.timer);const tick=()=>{const b=q('lg_re');if(!b){clearInterval(LG.timer);return}
      if(LG.cd>0){b.disabled=true;b.textContent='Gửi lại mã ('+LG.cd+'s)';LG.cd--}else{b.disabled=false;b.textContent='Gửi lại mã';clearInterval(LG.timer)}};
    tick();LG.timer=setInterval(tick,1000);
  }
}
async function sendCode(masked,hours){
  const b=document.getElementById('lg_send')||document.getElementById('lg_re');if(b){b.disabled=true;b.textContent='Đang gửi…'}
  try{const r=await call('authSend');LG.cd=r.cooldown;loginStep(2,r.masked,hours,'',r.minutes)}
  catch(e){document.getElementById('lg_code')?loginStep(2,masked,hours,e.message):loginStep(1,masked,hours,e.message)}
}
async function verifyCode(masked,hours){
  const c=document.getElementById('lg_code'),code=c?c.value:'';if(code.length!==6)return;
  const ok=document.getElementById('lg_ok');ok.disabled=true;ok.textContent='Đang kiểm tra…';
  try{const r=await call('authVerify',{code});S.token=r.token;tokStore.set(r.token);S.logging=false;
    $('#login').style.display='none';$('#login').innerHTML='';boot()}
  catch(e){loginStep(2,masked,hours,e.message);const n=document.getElementById('lg_code');if(n)n.focus()}
}
boot();
</script>
