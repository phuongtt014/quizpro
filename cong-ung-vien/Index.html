<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thông tin ứng viên – VA Schools</title>
<script>window.__MODE=window.__MODE||'__MODE__'</script>
<style>
:root{--brand:#8a1538;--brand2:#a81d46;--ink:#1f2330;--mut:#6b7280;--line:#e5e1e4;--bg:#f6f3f4;--ok:#1e7e34;--bad:#b42318;--card:#fff}
*{box-sizing:border-box}html,body{margin:0}body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
.top{background:var(--brand);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px}.top img{height:44px;background:#fff;border-radius:8px;padding:3px}.top h1{font-size:17px;margin:0}.top small{opacity:.85}.top .sp{flex:1}
.top a,.top button.lk{color:#fff;background:transparent;border:1px solid #ffffff66;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 3px #0000000a}
h2{font-size:17px;color:var(--brand);margin:0 0 12px}h3{font-size:15px;color:var(--brand);margin:0 0 10px}
.hero{text-align:center;padding:26px 10px}.hero h2{font-size:24px}.hero p{color:var(--mut);max-width:560px;margin:8px auto 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;cursor:pointer;text-align:left}.choice:hover{border-color:var(--brand);box-shadow:0 4px 14px #8a153822}.choice b{display:block;font-size:17px;color:var(--brand);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}.grid .wide{grid-column:1/-1}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.req{color:var(--bad)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=month],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid #cfc8cc;border-radius:9px;font:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #8a153844;border-color:var(--brand)}
.bad{border-color:var(--bad)!important;background:#fff7f6}.opts{display:flex;gap:14px;flex-wrap:wrap;padding-top:4px}.opts label{display:flex;gap:6px;align-items:center;font-weight:400}
.btn{border:1px solid #cfc8cc;background:#fff;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:13px}.btn.dng{color:var(--bad);border-color:#e7b4ae}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{background:var(--brand);color:#fff;padding:9px 8px;font-size:13px;text-align:center}.tbl td{border:1px solid var(--line);padding:4px}.tbl td input,.tbl td select{border-radius:6px;padding:7px 8px}.tbl .lv{font-weight:600;padding:6px 8px;background:#fbf7f8;white-space:nowrap}
.scroll{overflow-x:auto}.alert{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px}.alert.err{background:#fdecea;color:#7a1b12;border:1px solid #f3c2bc}.alert.ok{background:#e9f6ec;color:#14532d;border:1px solid #b7e1c1}.alert.warn{background:#fff7e0;color:#6b4e00;border:1px solid #f1deaa}.alert.info{background:#f3eef0;color:#4a1a2a;border:1px solid #e3d3d9}
.secret{font:700 30px/1.2 Consolas,monospace;letter-spacing:3px;color:var(--brand);background:#fbf3f5;border:2px dashed var(--brand);border-radius:12px;padding:14px 18px;display:inline-block}
.commit{font-size:13.5px;color:#333;background:#fbf9fa;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.commit p{margin:0 0 8px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eee}.b-ok{background:#e0f2e6;color:#14532d}.b-warn{background:#fff1cc;color:#6b4e00}.b-bad{background:#fde1de;color:#7a1b12}
table.list{width:100%;border-collapse:collapse;font-size:14px}table.list th{text-align:left;padding:9px 10px;background:#f3eef0;color:var(--brand);font-size:12.5px}table.list td{padding:9px 10px;border-top:1px solid var(--line)}table.list tr.cl{cursor:pointer}table.list tr.cl:hover{background:#faf4f6}
.split{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.pvdoc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:78vh}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:11px 18px;z-index:99;display:none;max-width:90vw}
@media(max-width:720px){.grid,.choices,.split{grid-template-columns:1fr}.secret{font-size:24px}.card{padding:16px 14px}}
</style>
<script>
window.__errs=[];
function bootFail(){var d=document.getElementById('app');if(d)d.innerHTML='<div class="wrap"><div class="alert err"><b>Không khởi động được trang.</b><br>'+window.__errs.join('<br>')+'</div></div>'}
window.addEventListener('error',function(e){window.__errs.push(String(e.message||e));if(!window.__booted)bootFail()});
</script>
</head>
