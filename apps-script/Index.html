<head>
  <base target="_top">

</head>
<body>

  <div id="login-screen"></div>

  <div id="app" style="display:none;">
    <div id="sidebar">
      <div class="brand">Quản lý công việc nhóm
        <small>15 thành viên · Apps Script</small>
      </div>
      <div class="nav-item" id="nav-form" onclick="showView('form')">📝 Nộp hồ sơ</div>
      <div class="nav-item" id="nav-tracuu" onclick="showView('tracuu')">🔍 Tra cứu</div>
      <div class="nav-item" id="nav-tiepnhan" onclick="showView('tiepnhan')">📥 Tiếp nhận</div>
      <div class="nav-item" id="nav-congviec" onclick="showView('congviec')">✅ Quản lý công việc</div>
      <div class="nav-item" id="nav-diem" onclick="showView('diem')">🏅 Điểm cộng/trừ</div>
      <div class="nav-item" id="nav-baocao" onclick="showView('baocao')">📊 Báo cáo hiệu suất</div>
      <div class="nav-item" id="nav-thietlap" onclick="showView('thietlap')">⚙️ Thiết lập</div>
      <div class="nav-spacer"></div>
      <div class="nav-user">
        Đăng nhập với<b id="nav-user-name">—</b>
        <span id="nav-user-role"></span>
      </div>
      <div class="nav-logout"><button class="btn btn-sm" style="width:100%" onclick="doLogout()">Đăng xuất</button></div>
    </div>

    <div id="main">
      <div id="topbar"><span id="topbar-title">Trang chủ</span></div>
      <div id="content">
        <?!= include('View_Form'); ?>
        <?!= include('View_TraCuu'); ?>
        <?!= include('View_TiepNhan'); ?>
        <?!= include('View_CongViec'); ?>
        <?!= include('View_Diem'); ?>
        <?!= include('View_BaoCao'); ?>
        <?!= include('View_ThietLap'); ?>
      </div>
    </div>
  </div>

  <?!= include('JsCommon'); ?>
  <?!= include('View_Login'); ?>

  <script>
    var VIEW_TITLES = {
      form: 'Form nộp hồ sơ', tracuu: 'Tra cứu hồ sơ', tiepnhan: 'Tiếp nhận hồ sơ',
      congviec: 'Quản lý công việc', diem: 'Ghi nhận điểm cộng/trừ',
      baocao: 'Báo cáo hiệu suất', thietlap: 'Thiết lập hệ thống'
    };
    var _origShowView = showView;
    showView = function (name) {
      _origShowView(name);
      document.getElementById('topbar-title').textContent = VIEW_TITLES[name] || '';
    };

    function applyRoleVisibility() {
      document.getElementById('nav-tiepnhan').style.display = roleAtLeast('TruongNhom') ? '' : 'none';
      document.getElementById('nav-baocao').style.display = roleAtLeast('TruongNhom') ? '' : 'none';
      document.getElementById('nav-thietlap').style.display = roleAtLeast('Admin') ? '' : 'none';
    }

    function afterLogin() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('nav-user-name').textContent = STATE.user.hoTen;
      document.getElementById('nav-user-role').textContent = STATE.user.vaiTroLabel;
      applyRoleVisibility();
      showView('form');
      if (typeof onLoginReady === 'function') onLoginReady();
    }

    function doLogout() {
      api('logout', STATE.token).then(function () {
        clearSession();
        location.reload();
      });
    }

    window.onload = function () {
      var token = loadSessionToken();
      if (!token) { renderLoginScreen(); return; }
      STATE.token = token;
      api('getCurrentUser', token).then(function (res) {
        if (res.ok) { STATE.user = res.user; saveSession(); afterLogin(); }
        else { clearSession(); renderLoginScreen(); }
      });
    };
  </script>
</body>
</html>
