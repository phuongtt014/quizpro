<script>
  function renderLoginScreen() {
    var el = document.getElementById('login-screen');
    el.style.display = 'block';
    el.innerHTML =
      '<div class="login-wrap"><div class="login-card">' +
      '<h1>Quản lý công việc nhóm</h1>' +
      '<p class="sub">Đăng nhập để tiếp tục</p>' +
      '<div class="field"><label>Tài khoản</label><input id="li-username" autofocus></div>' +
      '<div class="field"><label>Mật khẩu</label><input id="li-password" type="password"></div>' +
      '<button class="btn btn-primary" style="width:100%" onclick="doLogin()">Đăng nhập</button>' +
      '<div id="li-error" style="color:#dc2626;font-size:12.5px;margin-top:10px;"></div>' +
      '<div class="login-hint">Tài khoản mẫu: <b>admin/quanly/truongnhom/nhanvien</b> — mật khẩu mặc định <b>123456</b>. Admin vào tab Thiết lập để tạo tài khoản thật cho 15 thành viên.</div>' +
      '</div></div>';
    document.getElementById('li-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  }

  function doLogin() {
    var username = document.getElementById('li-username').value.trim();
    var password = document.getElementById('li-password').value;
    var errEl = document.getElementById('li-error');
    errEl.textContent = '';
    if (!username || !password) { errEl.textContent = 'Vui lòng nhập tài khoản và mật khẩu.'; return; }
    api('login', username, password).then(function (res) {
      if (!res.ok) { errEl.textContent = res.message; return; }
      STATE.token = res.token; STATE.user = res.user;
      saveSession();
      afterLogin();
    });
  }
</script>
