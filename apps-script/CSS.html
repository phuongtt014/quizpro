<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #e2e6ec;
    --text: #1f2937;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-bg: #eaf1ff;
    --danger: #dc2626;
    --danger-bg: #fdecec;
    --success: #16a34a;
    --success-bg: #e9f9ee;
    --warn: #d97706;
    --warn-bg: #fef3e0;
    --gray-bg: #eef0f3;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  #app { display: flex; min-height: 100vh; }

  /* ---- Sidebar ---- */
  #sidebar {
    width: 230px; flex: 0 0 230px; background: #14213d; color: #fff;
    display: flex; flex-direction: column; padding: 18px 0;
  }
  #sidebar .brand { font-weight: 700; font-size: 16px; padding: 0 20px 16px; border-bottom: 1px solid rgba(255,255,255,.12); margin-bottom: 8px; }
  #sidebar .brand small { display: block; font-weight: 400; color: #9fb0d0; font-size: 12px; margin-top: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 20px; color: #c7d2e8;
    cursor: pointer; font-size: 13.5px; border-left: 3px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: rgba(37,99,235,.25); color: #fff; border-left-color: var(--primary); font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-user { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.12); font-size: 12.5px; color: #9fb0d0; }
  .nav-user b { color: #fff; display: block; font-size: 13.5px; }
  .nav-logout { margin: 8px 20px 0; }

  /* ---- Main ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    height: 56px; flex: 0 0 56px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 24px; font-weight: 600; font-size: 15px;
  }
  #content { flex: 1; padding: 22px 26px; overflow: auto; }

  .view { display: none; }
  .view.active { display: block; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .03em; }
  .grid { display: grid; gap: 14px; }
  .grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }

  label { display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
  .field { margin-bottom: 12px; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13.5px; font-family: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 70px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent;
    font-size: 13.5px; font-weight: 600; cursor: pointer; background: var(--gray-bg); color: var(--text);
  }
  .btn:hover { filter: brightness(0.97); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .btn-success { background: var(--success-bg); color: var(--success); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }
  .btn-link { background: none; border: none; color: var(--primary); padding: 0; font-weight: 600; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .02em; }
  tr:hover td { background: #fafbfd; }
  .table-wrap { overflow-x: auto; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .badge-gray { background: var(--gray-bg); color: #4b5563; }
  .badge-blue { background: var(--primary-bg); color: var(--primary-dark); }
  .badge-green { background: var(--success-bg); color: var(--success); }
  .badge-orange { background: var(--warn-bg); color: var(--warn); }
  .badge-red { background: var(--danger-bg); color: var(--danger); }

  .toast-wrap { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 11px 16px; border-radius: 8px; color: #fff; font-size: 13.5px; box-shadow: var(--shadow); min-width: 220px; }
  .toast.ok { background: #16a34a; }
  .toast.err { background: #dc2626; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; padding: 22px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal.wide { max-width: 860px; }
  .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }

  .link-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .link-row input { flex: 1; }
  .muted { color: var(--text-muted); }
  .text-right { text-align: right; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .chat-box { border: 1px solid var(--border); border-radius: 8px; max-height: 260px; overflow-y: auto; padding: 10px; background: #fafbfd; margin-bottom: 10px; }
  .chat-msg { margin-bottom: 10px; font-size: 13px; }
  .chat-msg .meta { color: var(--text-muted); font-size: 11.5px; margin-bottom: 2px; }
  .chat-msg .body { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; display: inline-block; white-space: pre-wrap; word-break: break-word; }

  .stat-tile { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
  .stat-tile .num { font-size: 26px; font-weight: 700; }
  .stat-tile .label { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#14213d,#1d3a6e); }
  .login-card { background: #fff; border-radius: 14px; padding: 34px 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }
  .login-hint { margin-top: 14px; font-size: 12px; color: var(--text-muted); background: var(--gray-bg); padding: 10px 12px; border-radius: 8px; }

  @media print {
    #sidebar, #topbar, .no-print { display: none !important; }
    #content { padding: 0; }
    body { background: #fff; }
  }
</style>
