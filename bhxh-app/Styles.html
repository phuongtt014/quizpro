<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #1d2733; --muted: #667085; --line: #e3e8ef;
    --pri: #1f4e79; --pri-2: #2f6fad; --pri-soft: #e8f0f9;
    --ok: #127a46; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fff4de;
    --bad: #b42318; --bad-soft: #fde8e7; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
  a { color: var(--pri-2); }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--pri); color: #fff; padding: 8px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .brand small { font-weight: 400; opacity: .8; margin-left: 6px; }
  nav { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
  nav button { background: transparent; border: 0; color: #dbe7f5; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  nav button:hover { background: rgba(255,255,255,.12); color: #fff; }
  nav button.active { background: #fff; color: var(--pri); font-weight: 600; }
  .userbox { font-size: 12px; text-align: right; opacity: .9; }
  .userbox b { display: block; font-size: 13px; }
  main { max-width: none; width: 100%; margin: 0; padding: 14px 12px 60px; }
  h2 { margin: 4px 0 14px; font-size: 20px; }
  h3 { margin: 0 0 10px; font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .stat .lbl { color: var(--muted); font-size: 12px; }
  .stat .val { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  button.btn, .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .btn:hover { border-color: var(--pri-2); }
  .btn.pri { background: var(--pri-2); border-color: var(--pri-2); color: #fff; }
  .btn.pri:hover { background: var(--pri); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn.warn { color: var(--warn); border-color: var(--warn); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid #cfd6df; border-radius: 7px; background: #fff; color: var(--ink); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--pri-soft); border-color: var(--pri-2); }
  input[readonly] { background: #f3f5f8; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 14px; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .form label.full { grid-column: 1 / -1; }
  .form .req::after { content: " *"; color: var(--bad); }
  .tbl-wrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: #eef2f7; font-weight: 600; z-index: 1; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.tot { background: #dfe7f3; }
  td.tot { background: #f4f7fb; }
  tr:hover td { background: #fafbfd; }
  tr.group td { background: var(--pri-soft); font-weight: 600; }
  tr.sub td { background: #f6f8fb; font-weight: 600; }
  tr.total td { background: #e9eef5; font-weight: 700; }
  tr.off td { color: #98a2b3; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.open { background: var(--ok-soft); color: var(--ok); }
  .badge.closed { background: #eceff3; color: #475467; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.info { background: var(--pri-soft); color: var(--pri); }
  .warn-txt { color: var(--bad); font-size: 12px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--pri); border-color: var(--pri); font-weight: 600; }
  .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
  .alert.info { background: var(--pri-soft); color: var(--pri); }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .alert.bad { background: var(--bad-soft); color: var(--bad); }
  .modal { position: fixed; inset: 0; background: rgba(16,24,40,.45); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 30px 12px; overflow: auto; }
  .modal.hidden { display: none; }
  .modal-card { background: #fff; border-radius: 12px; width: min(920px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; }
  .modal-body { padding: 16px 18px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
  .icon { background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--muted); }
  #toast { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: #1d2733; color: #fff; padding: 10px 14px; border-radius: 8px; max-width: 420px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.err { background: var(--bad); }
  .toast.ok { background: var(--ok); }
  #busy { position: fixed; inset: 0; background: rgba(255,255,255,.55); display: none; align-items: center; justify-content: center; z-index: 70; }
  #busy.on { display: flex; }
  .spinner { width: 38px; height: 38px; border: 4px solid var(--pri-soft); border-top-color: var(--pri-2); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .chk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chk-list { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .chk-item { display: grid; grid-template-columns: 22px 1fr 110px; gap: 8px; align-items: center; padding: 5px 4px; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .chk-item:last-child { border-bottom: 0; }
  .chk-item input[type=number] { padding: 4px 6px; width: 100%; }
  .steps { margin: 0; padding-left: 20px; }
  .steps li { margin: 4px 0; }
  @media (max-width: 700px) {
    .chk-grid { grid-template-columns: 1fr; }
    .userbox { display: none; }
    main { padding: 12px 10px 50px; }
  }
  @media print {
    .topbar, .no-print, .tabs { display: none !important; }
    .tbl-wrap { max-height: none; overflow: visible; border: 0; }
    body { background: #fff; }
    .card { border: 0; padding: 0; }
  }
</style>
