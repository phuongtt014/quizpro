<script>
/* =====================================================================
   GIAO DIỆN WEB APP BHXH (chạy trên trình duyệt)
   ===================================================================== */
const S = {
  user: null, info: {}, kys: [], khoan: [], mapl: [], phongBan: [], lists: {}, today: '',
  view: 'tongquan', nvKy: null, nvData: null, ttKy: null, ttData: null,
  rpTab: 'chitiet', rpKy: null, rpTuKy: null, rpDenKy: null, rpData: null, setTab: 'info', pq: [], impTab: 'paste', zf: {},
  dashTuKy: null, dashDenKy: null, dashPB: '', dashData: null
};
const $ = (id) => document.getElementById(id);
const V = () => $('view');

// ---------- Tiện ích ----------
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmt(n) { return (Math.round(Number(n) || 0)).toLocaleString('vi-VN'); }
function fmtPct(n) { return (Number(n) || 0).toLocaleString('vi-VN', { maximumFractionDigits: 4 }); }
function fmtD(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
function fmtM(k) { return k ? k.slice(5, 7) + '/' + k.slice(0, 4) : ''; }
// Lọc nhanh theo giá trị 0 của 1 cột tùy chọn, dùng ở các bảng theo NV/phòng ban
function zfBar(tab, cols) {
  const cur = S.zf[tab] || {};
  return `<div class="row no-print" style="margin:8px 0">
    <span class="small muted">Lọc theo cột:</span>
    <select onchange="S.zf['${tab}']=Object.assign({},S.zf['${tab}'],{col:this.value});rpRefilter()">
      <option value="">-- chọn cột --</option>
      ${cols.map((c) => `<option value="${c.key}" ${cur.col === c.key ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
    </select>
    <select onchange="S.zf['${tab}']=Object.assign({},S.zf['${tab}'],{mode:this.value});rpRefilter()">
      <option value="">Không lọc</option>
      <option value="zero" ${cur.mode === 'zero' ? 'selected' : ''}>Chỉ hiện dòng có giá trị 0</option>
      <option value="nonzero" ${cur.mode === 'nonzero' ? 'selected' : ''}>Ẩn dòng có giá trị 0</option>
    </select></div>`;
}
function zfApply(tab, rows, cols) {
  const cur = S.zf[tab] || {};
  if (!cur.mode || !cur.col) return rows;
  const c = cols.find((x) => x.key === cur.col);
  if (!c) return rows;
  return rows.filter((r) => cur.mode === 'zero' ? Number(c.get(r)) === 0 : Number(c.get(r)) !== 0);
}
// ---------- Biểu đồ SVG đơn giản (không cần thư viện ngoài) ----------
const CHART_COLORS = ['var(--pri-2)', 'var(--ok)', 'var(--warn)', 'var(--bad)', '#6b4fbb', '#c2410c', '#0f766e', '#a16207', '#0369a1', '#be185d'];
function chartBar(data, opts) {
  opts = opts || {};
  const w = opts.width || 560, h = opts.height || 220, pad = 40, top = 22, bottom = 34;
  const max = Math.max(1, ...data.map((d) => d.value));
  const n = Math.max(1, data.length);
  const bw = (w - pad * 2) / n;
  const bars = data.map((d, i) => {
    const bh = Math.round((h - top - bottom) * (d.value / max));
    const bwv = bw * 0.62;
    const x = pad + i * bw + (bw - bwv) / 2;
    const y = h - bottom - bh;
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${bwv.toFixed(1)}" height="${Math.max(bh, 0)}" fill="${opts.color || CHART_COLORS[0]}" rx="3"></rect>
      <text x="${(x + bwv / 2).toFixed(1)}" y="${y - 6}" text-anchor="middle" font-size="12" fill="var(--ink)">${fmt(d.value)}</text>
      <text x="${(x + bwv / 2).toFixed(1)}" y="${h - bottom + 16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(d.label)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" role="img">
    <line x1="${pad}" y1="${h - bottom}" x2="${w - pad}" y2="${h - bottom}" stroke="var(--line)"></line>${bars}</svg>`;
}
function chartLine(labels, series, opts) {
  opts = opts || {};
  const w = opts.width || 700, h = opts.height || 240, padL = 46, padR = 14, top = 18, bottom = 30;
  const allVals = series.reduce((a, s) => a.concat(s.values), []);
  const max = Math.max(1, ...allVals);
  const n = labels.length;
  const x = (i) => padL + (n <= 1 ? (w - padL - padR) / 2 : (w - padL - padR) * i / (n - 1));
  const y = (v) => top + (h - top - bottom) * (1 - v / max);
  const grid = [0, 0.5, 1].map((f) => {
    const yy = top + (h - top - bottom) * (1 - f);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${w - padR}" y2="${yy.toFixed(1)}" stroke="var(--line)"></line>
      <text x="${padL - 6}" y="${(yy + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(max * f))}</text>`;
  }).join('');
  const lines = series.map((s) => {
    const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const dots = s.values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${s.color}"></circle>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="${s.bold ? 3 : 2}"></polyline>${dots}`;
  }).join('');
  const xlabels = labels.map((m, i) => `<text x="${x(i).toFixed(1)}" y="${h - bottom + 16}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(m)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" role="img">${grid}${lines}${xlabels}</svg>`;
}
function chartLegend(series) {
  return `<div class="row small" style="gap:14px;margin-top:6px">${series.map((s) => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${s.color};margin-right:4px"></span>${esc(s.label)}</span>`).join('')}</div>`;
}
// Biểu đồ cột chồng theo tháng, mỗi tháng 1 cột chia đoạn theo từng nhóm (ví dụ phòng ban), có tổng in đậm phía trên
// Biểu đồ cột nhóm theo tháng (ví dụ Tăng mới / Nghỉ việc), mỗi tháng vài cột đặt cạnh nhau, có nhãn số trên mỗi cột
function chartGroupedBar(labels, series, opts) {
  opts = opts || {};
  const w = opts.width || 700, h = opts.height || 260, padL = 40, padR = 14, top = 24, bottom = 34;
  const n = Math.max(1, labels.length);
  const allVals = series.reduce((a, s) => a.concat(s.values.map((v) => Math.abs(v || 0))), []);
  const max = Math.max(1, ...allVals);
  const groupW = (w - padL - padR) / n;
  const barW = (groupW * 0.7) / series.length;
  const zeroY = h - bottom;
  const bars = labels.map((lab, i) => {
    const gx = padL + i * groupW + groupW * 0.15;
    let segs = '';
    series.forEach((ser, si) => {
      const v = ser.values[i] || 0;
      const bh = (h - top - bottom) * (Math.abs(v) / max);
      const x = gx + si * barW;
      const y = zeroY - bh;
      segs += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW * 0.82).toFixed(1)}" height="${bh.toFixed(1)}" fill="${ser.color}" rx="2"></rect>
        <text x="${(x + barW * 0.41).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink)">${fmt(v)}</text>`;
    });
    return `${segs}<text x="${(gx + groupW * 0.35).toFixed(1)}" y="${h - bottom + 16}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(lab)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" role="img">
    <line x1="${padL}" y1="${zeroY}" x2="${w - padR}" y2="${zeroY}" stroke="var(--line)"></line>${bars}</svg>`;
}
// Ô nhập số tiền: hiển thị có phân tách hàng ngàn, gõ tới đâu định dạng lại tới đó
function moneyVal(v) { const n = Number(v) || 0; return n ? fmt(n) : ''; }
function onMoneyInput(el) {
  const pos = el.selectionStart, before = el.value.length;
  const digits = el.value.replace(/[^\d]/g, '');
  el.value = digits ? fmt(Number(digits)) : '';
  const diff = el.value.length - before;
  try { el.setSelectionRange(Math.max(0, pos + diff), Math.max(0, pos + diff)); } catch (e) { /* bỏ qua trên input type khác */ }
}
function moneyNum(el) { return Number(String(el.value || '').replace(/[^\d]/g, '')) || 0; }
function nextMonth(k) {
  let y = +k.slice(0, 4), m = +k.slice(5, 7) + 1;
  if (m > 12) { m = 1; y++; }
  return y + '-' + String(m).padStart(2, '0');
}
function opt(list, sel, blank) {
  let h = blank !== undefined ? `<option value="">${esc(blank)}</option>` : '';
  const arr = list.slice();
  if (sel && arr.indexOf(sel) < 0) arr.push(sel);
  arr.forEach((v) => { h += `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(v)}</option>`; });
  return h;
}
function kyOpts(sel, withMaster) {
  let h = withMaster ? `<option value="" ${sel === '' ? 'selected' : ''}>Hồ sơ gốc (tab Danh sách nhân viên)</option>` : '';
  S.kys.forEach((k) => {
    h += `<option value="${k.ky}" ${k.ky === sel ? 'selected' : ''}>Kỳ ${fmtM(k.ky)} – ${esc(k.trangThai)}</option>`;
  });
  return h;
}
function kyBadge(t) { return `<span class="badge ${t === 'Đã chốt' ? 'closed' : 'open'}">${esc(t)}</span>`; }
function isRole(...r) { return S.user && r.includes(S.user.role); }
function latestKy() { return S.kys.length ? S.kys[0].ky : ''; }
function latestOpenKy() { const k = S.kys.find((x) => x.trangThai !== 'Đã chốt'); return k ? k.ky : latestKy(); }

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
let busyCount = 0;
function busy(on) { busyCount += on ? 1 : -1; $('busy').classList.toggle('on', busyCount > 0); }
async function run(fn, ...args) {
  busy(true);
  try { return await api(fn, ...args); }
  catch (e) { toast((e && e.message) || String(e), 'err'); throw e; }
  finally { busy(false); }
}
function act(fn) { return fn().catch(() => {}); }
function toast(msg, type) {
  const d = document.createElement('div');
  d.className = 'toast ' + (type || '');
  d.textContent = msg;
  $('toast').appendChild(d);
  setTimeout(() => d.remove(), type === 'err' ? 8000 : 4000);
}
function openModal(title, body, foot) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = `<div class="modal-body">${body}</div>` + (foot ? `<div class="modal-foot">${foot}</div>` : '');
  $('modal').classList.remove('hidden');
}
function closeModal() { $('modal').classList.add('hidden'); }
function formData(id) {
  const o = {};
  $(id).querySelectorAll('[name]').forEach((el) => { o[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
  return o;
}
function download(res) {
  const bin = atob(res.data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: res.mime }));
  const a = document.createElement('a');
  a.href = url; a.download = res.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function xuat(loai, thamSo, format) {
  act(async () => { download(await run('apiXuat', loai, thamSo, format)); toast('Đã xuất file.', 'ok'); });
}

// ---------- Khởi động ----------
const NAV = [
  ['tongquan', 'Tổng quan'], ['ky', 'Kỳ BHXH'], ['nhanvien', 'Nhân viên'], ['truythu', 'Truy thu'],
  ['baocao', 'Báo cáo'], ['thietlap', 'Thiết lập'], ['nhatky', 'Nhật ký', ['Admin']]
];
async function boot() {
  try {
    const d = await api('apiBootstrap');
    Object.assign(S, d);
    $('ctyName').textContent = S.info.tenCty ? ' · ' + S.info.tenCty : '';
    $('userBox').innerHTML = `<b>${esc(S.user.hoTen)}</b>${esc(S.user.email)} · ${esc(S.user.role)}`;
    $('nav').innerHTML = NAV.filter((n) => !n[2] || n[2].includes(S.user.role))
      .map((n) => `<button data-v="${n[0]}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
    go('tongquan');
  } catch (e) {
    V().innerHTML = `<div class="alert bad"><b>Không thể mở ứng dụng.</b><br>${esc(e.message || e)}</div>`;
  }
}
function go(v) {
  S.view = v;
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.v === v));
  closeModal();
  ({ tongquan: vTongQuan, ky: vKy, nhanvien: vNhanVien, truythu: vTruyThu, baocao: vBaoCao, thietlap: vThietLap, nhatky: vNhatKy }[v])();
}
async function refreshKys() { S.kys = await api('apiListKy'); }
// Các danh mục (Khoản trích đóng, Mã phân loại, Tỉ lệ Công đoàn, Phòng ban, Thông tin chung) chỉ tải lúc mở trang.
// Nếu vừa sửa tay trên Google Sheet, bấm nút này để nạp lại mà không cần tải lại cả trang.
async function refreshDanhMuc() {
  act(async () => {
    const d = await run('apiBootstrap');
    Object.assign(S, d);
    $('ctyName').textContent = S.info.tenCty ? ' · ' + S.info.tenCty : '';
    toast('Đã làm mới danh mục (Khoản trích đóng, Mã phân loại, Tỉ lệ Công đoàn, Phòng ban, Thông tin chung).', 'ok');
    go(S.view);
  });
}

// =====================================================================
// TỔNG QUAN
// =====================================================================
async function vTongQuan() {
  V().innerHTML = '<h2>Tổng quan</h2><div class="card muted">Đang tải…</div>';
  let list;
  try { list = await run('apiTongQuan'); } catch (e) { return; }
  const last = list[0];
  let h = '<h2>Tổng quan</h2>';
  if (!last) {
    h += `<div class="alert info"><b>Chưa có kỳ BHXH nào.</b> Các bước bắt đầu:
      <ol class="steps"><li>Kiểm tra <b>Thiết lập</b>: Thông tin chung, Khoản trích đóng, Mã phân loại, Phòng ban.</li>
      <li>Nhập danh sách nhân viên vào <b>Nhân viên → Hồ sơ gốc</b> (hoặc dán trực tiếp vào tab "Danh sách nhân viên" trên Google Sheet).</li>
      <li>Admin vào <b>Kỳ BHXH</b> tạo kỳ đầu tiên, rồi bấm <b>Tính</b>.</li></ol></div>`;
    V().innerHTML = h;
    return;
  }
  h += `<div id="dashArea"></div>`;
  V().innerHTML = h;
  if (!S.dashTuKy) S.dashTuKy = S.kys[S.kys.length - 1].ky;
  if (!S.dashDenKy) S.dashDenKy = S.kys[0].ky;
  loadDashboard();
}
async function loadDashboard() {
  const area = $('dashArea'); if (!area) return;
  area.innerHTML = '<div class="card muted">Đang tải biểu đồ…</div>';
  let d;
  try { d = await run('apiDashboard', S.dashTuKy, S.dashDenKy, S.dashPB); } catch (e) { area.innerHTML = ''; return; }
  S.dashData = d; S.dashTuKy = d.tuKy; S.dashDenKy = d.denKy;
  renderDashboard();
}
function renderDashboard() {
  const d = S.dashData; const area = $('dashArea'); if (!d || !area) return;
  const labels = d.months.map((m) => fmtM(m.ky));
  const seriesQL = [{ label: 'Quỹ lương đóng', color: CHART_COLORS[0], values: d.months.map((m) => m.quyLuong), bold: true }];
  const seriesTurnover = [
    { label: 'Tăng mới', color: 'var(--ok)', values: d.months.map((m) => m.tangMoi || 0) },
    { label: 'Nghỉ việc', color: 'var(--bad)', values: d.months.map((m) => m.nghiViec || 0) }
  ];
  const thieuKyGoc = d.months.length > 0 && d.months[0].tangMoi === null;
  const h = `<div class="card"><div class="row">
      <label class="small">Từ kỳ <input type="month" value="${S.dashTuKy}" onchange="S.dashTuKy=this.value;loadDashboard()"></label>
      <label class="small">Đến kỳ <input type="month" value="${S.dashDenKy}" onchange="S.dashDenKy=this.value;loadDashboard()"></label>
      <label class="small">Phòng ban <select onchange="S.dashPB=this.value;loadDashboard()">${opt(S.phongBan, S.dashPB, 'Tất cả phòng ban')}</select></label>
    </div></div>
    <div class="card"><h3>Biến động quỹ lương đóng${S.dashPB ? ' – ' + esc(S.dashPB) : ''}</h3>${chartLine(labels, seriesQL, {})}</div>
    <div class="card"><h3>Biến động nhân sự: Tăng mới / Nghỉ việc theo tháng${S.dashPB ? ' – ' + esc(S.dashPB) : ''}</h3>
      ${thieuKyGoc ? '<div class="alert warn small">Không có kỳ trước để so sánh cho tháng đầu tiên trong khoảng đã chọn.</div>' : ''}
      ${chartGroupedBar(labels, seriesTurnover, {})}${chartLegend(seriesTurnover)}</div>
    <div class="row" style="gap:16px;align-items:stretch">
      <div class="card" style="flex:1;min-width:280px"><h3>Nhân viên theo thâm niên${S.dashPB ? ' – ' + esc(S.dashPB) : ''}</h3>
        <span class="small muted">Tại kỳ ${fmtM(d.denKy)} · ${fmt(d.tongNVCuoiKy)} NV đang đóng</span>
        ${chartBar(d.seniority.map((b) => ({ label: b.label, value: b.count })), { color: CHART_COLORS[1] })}</div>
      <div class="card" style="flex:1;min-width:280px"><h3>Số lượng nhân sự theo mã phân loại${S.dashPB ? ' – ' + esc(S.dashPB) : ''}</h3>
        <span class="small muted">Tại kỳ ${fmtM(d.denKy)}</span>
        ${chartBar(d.byMaPL.map((b) => ({ label: b.maPL, value: b.count })), { color: CHART_COLORS[2] })}</div>
    </div>`;
  area.innerHTML = h;
}

// =====================================================================
// KỲ BHXH
// =====================================================================
async function vKy() {
  try { busy(true); await refreshKys(); } catch (e) { toast(e.message, 'err'); } finally { busy(false); }
  const def = S.kys.length ? nextMonth(S.kys[0].ky) : S.today;
  let h = '<h2>Kỳ BHXH</h2>';
  if (isRole('Admin')) {
    h += `<div class="card"><h3>Tạo kỳ mới</h3><div class="row">
      <input type="month" id="newKy" value="${def}">
      <button class="btn pri" onclick="taoKy()">＋ Tạo kỳ</button>
      <span class="muted small">${S.kys.length ? 'Dữ liệu NV sẽ sao chép từ kỳ ' + fmtM(S.kys[0].ky) + ' (bỏ NV đã dừng đóng) và bổ sung NV mới trong hồ sơ gốc.'
        : 'Kỳ đầu tiên lấy dữ liệu từ tab "Danh sách nhân viên" (hồ sơ gốc).'}</span></div></div>`;
  }
  h += `<div class="card"><div class="tbl-wrap"><table><thead><tr><th>Kỳ</th><th>Trạng thái</th><th>Tạo</th><th>Lần tính gần nhất</th>
    <th>Chốt</th><th></th></tr></thead><tbody>`;
  if (!S.kys.length) h += '<tr><td colspan="6" class="muted">Chưa có kỳ nào.</td></tr>';
  S.kys.forEach((k, i) => {
    const open = k.trangThai !== 'Đã chốt';
    const isLatest = i === 0;
    h += `<tr><td><b>${fmtM(k.ky)}</b></td><td>${kyBadge(k.trangThai)}</td>
      <td class="small">${esc(k.ngayTao)}<br><span class="muted">${esc(k.nguoiTao)}</span></td>
      <td class="small">${k.ngayTinh ? esc(k.ngayTinh) + '<br><span class="muted">' + esc(k.nguoiTinh) + '</span>' : '<span class="badge warn">Chưa tính</span>'}</td>
      <td class="small">${k.ngayChot ? esc(k.ngayChot) + '<br><span class="muted">' + esc(k.nguoiChot) + '</span>' : ''}</td>
      <td><div class="row">
        ${open && isRole('Admin', 'Nhập liệu') ? `<button class="btn sm pri" onclick="tinhKy('${k.ky}')">Tính</button>` : ''}
        ${open && isRole('Admin') ? `<button class="btn sm ok" onclick="chotKy('${k.ky}')">Chốt kỳ</button>` : ''}
        ${!open && isRole('Admin') ? `<button class="btn sm warn" onclick="moLaiKy('${k.ky}')">Mở lại kỳ</button>` : ''}
        <button class="btn sm" onclick="S.nvKy='${k.ky}';go('nhanvien')">Nhân viên</button>
        <button class="btn sm" onclick="S.rpKy='${k.ky}';S.rpTab='chitiet';go('baocao')">Bảng tính</button>
        <button class="btn sm" onclick="S.rpKy='${k.ky}';S.rpTab='biendong';go('baocao')">Biến động</button>
        ${isLatest && isRole('Admin') ? `<button class="btn sm danger" onclick="xoaKy('${k.ky}')">Xóa kỳ</button>` : ''}
      </div></td></tr>`;
  });
  h += '</tbody></table></div></div>';
  V().innerHTML = h;
}
function taoKy() {
  const ky = $('newKy').value;
  if (!ky) return toast('Chọn tháng cho kỳ mới.', 'err');
  if (!confirm('Tạo kỳ ' + fmtM(ky) + '?')) return;
  act(async () => {
    const r = await run('apiTaoKy', ky);
    toast(`Đã tạo kỳ ${fmtM(r.ky)}: ${r.soNV} NV (nguồn: ${r.nguon}${r.themTuHoSo ? ', thêm ' + r.themTuHoSo + ' NV từ hồ sơ gốc' : ''}).`, 'ok');
    vKy();
  });
}
function ketQuaTinh(r, title) {
  openModal(title, `<div class="stats">
      <div class="stat"><div class="lbl">NV đóng / tổng</div><div class="val">${fmt(r.soDong)} / ${fmt(r.soNV)}</div></div>
      <div class="stat"><div class="lbl">NLĐ đóng</div><div class="val">${fmt(r.tongNLD)}</div></div>
      <div class="stat"><div class="lbl">DN đóng</div><div class="val">${fmt(r.tongDN)}</div></div>
      <div class="stat"><div class="lbl">Truy thu NLĐ + DN</div><div class="val">${fmt(r.ttNLD + r.ttDN)}</div></div>
      <div class="stat"><div class="lbl">Tổng phải nộp</div><div class="val">${fmt(r.tongNLD + r.tongDN + r.ttNLD + r.ttDN)}</div></div>
    </div>${r.soCanhBao ? `<div class="alert warn">Có <b>${r.soCanhBao}</b> NV có cảnh báo – xem cột Cảnh báo trong Bảng tính chi tiết.</div>` : ''}`,
    `<button class="btn" onclick="closeModal()">Đóng</button>
     <button class="btn pri" onclick="S.rpKy='${r.ky}';S.rpTab='chitiet';go('baocao')">Xem bảng tính</button>`);
}
function tinhKy(ky) {
  act(async () => { const r = await run('apiTinhKy', ky); await refreshKys(); vKy(); ketQuaTinh(r, 'Kết quả tính kỳ ' + fmtM(ky)); });
}
function chotKy(ky) {
  if (!confirm(`Chốt kỳ ${fmtM(ky)}?\n\nApp sẽ tính lại lần cuối rồi KHÓA kỳ. Sau khi chốt không thể sửa; phát sinh cho tháng này phải nhập Truy thu/Thoái thu ở kỳ sau.`)) return;
  act(async () => { const r = await run('apiChotKy', ky); await refreshKys(); vKy(); ketQuaTinh(r, 'Đã chốt kỳ ' + fmtM(ky)); });
}
function moLaiKy(ky) {
  if (!confirm(`Mở lại kỳ ${fmtM(ky)}?\n\nKỳ sẽ chuyển về "Đang mở", có thể sửa dữ liệu và bấm Tính lại. Chỉ dùng khi cần điều chỉnh gấp cho kỳ đã chốt.`)) return;
  act(async () => { await run('apiMoLaiKy', ky); await refreshKys(); vKy(); toast(`Đã mở lại kỳ ${fmtM(ky)}. Có thể sửa dữ liệu và bấm Tính lại.`, 'ok'); });
}
function xoaKy(ky) {
  if (!confirm(`XÓA HẲN kỳ ${fmtM(ky)}?\n\nSẽ xóa toàn bộ dữ liệu NV, kết quả tính và các dòng Truy thu ghi nhận trong kỳ này. KHÔNG THỂ HOÀN TÁC. Chỉ xóa được kỳ mới nhất.`)) return;
  act(async () => { await run('apiXoaKy', ky); await refreshKys(); vKy(); toast(`Đã xóa kỳ ${fmtM(ky)}.`, 'ok'); });
}

async function loadNV() {
  try { S.nvData = await run('apiNhanVien', S.nvKy); } catch (e) { $('nvTbl').innerHTML = ''; return; }

  $('nvAdd').innerHTML = d.editable ? '<button class="btn pri" onclick="nvForm(null)">＋ Thêm nhân viên</button>' : '';

    : 'Đang xem <b>hồ sơ gốc</b> (tab Danh sách nhân viên). Kỳ đầu tiên sẽ được tạo từ danh sách này.';

// ---- Import / Xuất / File mẫu ----
function nvTemplate(format) {
  act(async () => { download(await run('apiTemplateNV', format)); toast('Đã tải file mẫu.', 'ok'); });
}
function nvExport(format) {
  act(async () => { download(await run('apiExportNV', S.nvKy, format)); toast('Đã xuất file.', 'ok'); });
}
function nvImportForm() {
  const tabBtn = (k, t) => `<button class="${S.impTab === k ? 'active' : ''}" onclick="S.impTab='${k}';nvImportForm()">${t}</button>`;
  const body = `<div class="alert info">Dữ liệu cần có tối thiểu 2 cột <b>Mã NV</b> và <b>Họ và tên</b>, đặt tên cột giống file mẫu
      (có thể thêm/bớt các cột khác, thứ tự cột tùy ý). Bấm <b>"⬇ File mẫu"</b> ở trên nếu chưa có.</div>
    <div class="tabs" style="margin-bottom:12px">${tabBtn('paste', 'Dán trực tiếp')}${tabBtn('file', 'Chọn file')}</div>
    <form id="impF" onsubmit="return false"><div class="form">
      ${S.impTab === 'file'
        ? '<label class="full">Chọn file (.csv, .xlsx, .xls)<input type="file" id="impFile" accept=".csv,.xlsx,.xls"></label>'
        : '<label class="full">Dán dữ liệu (sao chép từ Excel/Google Sheet rồi dán vào đây, hoặc dán nội dung CSV)'
          + '<textarea id="impPaste" rows="10" style="width:100%;font-family:monospace;font-size:12px" placeholder="Mã NV\tHọ và tên\tMức lương chính…"></textarea></label>'}
      <label class="full">Cách nhập<select id="impMode" onchange="impModeChange()">
        <option value="themmoi">Thêm nhân viên mới; nếu Mã NV đã có trong danh sách thì cập nhật toàn bộ thông tin</option>
        <option value="motphan">Chỉ cập nhật các cột có trong dữ liệu (giữ nguyên các cột khác) – không tạo NV mới</option>
        <option value="thaythe">Thay thế hoàn toàn danh sách hiện tại bằng dữ liệu này</option>
      </select></label>
    </div></form>
    <div id="impPartialOpt" style="display:none;margin-top:6px">
      <label class="small"><input type="checkbox" id="impOnlyEmpty"> Chỉ điền vào ô còn trống, không ghi đè dữ liệu đã có</label>
    </div>
    <div id="impWarn" class="alert warn" style="display:none;margin-top:10px">
      <b>Thay thế hoàn toàn</b> sẽ xóa toàn bộ nhân viên đang có (trong phạm vi bạn quản lý) rồi thay bằng dữ liệu này.
      Nếu có bất kỳ dòng lỗi nào, ứng dụng sẽ KHÔNG xóa hay thay đổi gì cả.</div>`;
  openModal('Nhập danh sách nhân viên – ' + (S.nvData.ky ? 'kỳ ' + fmtM(S.nvData.ky) : 'hồ sơ gốc'), body,
    `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="nvImportSubmit()">Nhập</button>`);
  setTimeout(impModeChange, 0);
}
function impModeChange() {
  const mode = $('impMode').value;
  $('impWarn').style.display = mode === 'thaythe' ? 'block' : 'none';
  $('impPartialOpt').style.display = mode === 'motphan' ? 'block' : 'none';
}
function readFileB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',').pop());
    r.onerror = () => reject(new Error('Không đọc được file.'));
    r.readAsDataURL(file);
  });
}
async function nvImportSubmit() {
  const mode = $('impMode').value;
  const onlyEmpty = mode === 'motphan' && $('impOnlyEmpty').checked;
  const label = mode === 'thaythe' ? 'Thay thế hoàn toàn danh sách hiện tại bằng dữ liệu này?' : '';
  if (label && !confirm(label)) return;
  if (S.impTab === 'file') {
    const f = $('impFile').files[0];
    if (!f) return toast('Chưa chọn file.', 'err');
    act(async () => {
      const b64 = await readFileB64(f);
      const r = await run('apiImportNV', S.nvData.ky, mode, b64, f.name, onlyEmpty);
      closeModal(); nvImportResult(r); loadNV();
    });
  } else {
    const text = $('impPaste').value;
    if (!text.trim()) return toast('Chưa dán dữ liệu.', 'err');
    act(async () => {
      const r = await run('apiImportNVText', S.nvData.ky, mode, text, onlyEmpty);
      closeModal(); nvImportResult(r); loadNV();
    });
  }
}
function nvImportResult(r) {
  let h = `<div class="stats">
    <div class="stat"><div class="lbl">Tổng dòng trong file</div><div class="val">${r.total}</div></div>
    <div class="stat"><div class="lbl">${r.mode === 'motphan' ? 'Đã cập nhật' : 'Thêm mới'}</div><div class="val">${r.mode === 'motphan' ? r.updated : r.added}</div></div>
    ${r.mode !== 'motphan' ? `<div class="stat"><div class="lbl">Cập nhật</div><div class="val">${r.updated}</div></div>` : ''}
    ${r.deleted ? `<div class="stat"><div class="lbl">Đã xóa (thay thế)</div><div class="val">${r.deleted}</div></div>` : ''}
    ${r.skipped ? `<div class="stat"><div class="lbl">Không đổi (đã có dữ liệu)</div><div class="val">${r.skipped}</div></div>` : ''}
  </div>
  ${r.cols ? `<div class="small muted" style="margin-bottom:10px">Cột đã cập nhật: ${r.cols.join(', ')}</div>` : ''}`;
  if (r.errors && r.errors.length) {
    h += `<div class="alert ${r.mode === 'thaythe' ? 'bad' : 'warn'}">${r.mode === 'thaythe'
      ? 'Không có gì được thay đổi vì file có dòng lỗi. Hãy sửa các dòng dưới đây rồi nhập lại.'
      : r.errors.length + ' dòng bị bỏ qua vì lỗi:'}</div>
      <div class="tbl-wrap" style="max-height:260px"><table><thead><tr><th>Dòng</th><th>Mã NV</th><th>Lỗi</th></tr></thead><tbody>
      ${r.errors.map((e) => `<tr><td>${e.line}</td><td>${esc(e.maNV)}</td><td class="warn-txt">${esc(e.message)}</td></tr>`).join('')}
      </tbody></table></div>`;
  } else {
    h += '<div class="alert info">Nhập file thành công, không có lỗi.</div>';
  }
  openModal('Kết quả nhập file', h, '<button class="btn pri" onclick="closeModal()">Đóng</button>');
}
function renderNV() {
  const d = S.nvData; if (!d) return;
  const q = ($('nvQ').value || '').toLowerCase().trim(), pb = $('nvPB').value, f = $('nvF').value;
  const rows = d.rows.filter((r) => (!q || [r.maNV, r.hoTen, r.maBHXH].join(' ').toLowerCase().includes(q))
    && (!pb || r.phongBan === pb)
    && (!f || (f === 'dung' ? !!r.thangDung : (!r.maPL || !r.ngayBHXH))))
    .sort((a, b) => (a.phongBan + a.maNV).localeCompare(b.phongBan + b.maNV, 'vi'));
  const tong = rows.reduce((s, r) => s + (Number(r.luongDong) || 0), 0);
  let h = `<div class="row between" style="margin-bottom:8px"><span><b>${rows.length}</b> / ${d.rows.length} nhân viên</span>
    <span class="muted">Tổng lương đóng: <b>${fmt(tong)}</b></span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Mã NV</th><th>Họ và tên</th><th>Mã số BHXH</th><th>Phòng ban</th><th>Chức danh</th>
    <th>Bắt đầu BHXH</th><th>Tháng dừng</th><th class="num">Lương đóng</th><th>Mã PL</th><th>CĐ</th><th>Email quản lý</th><th></th></tr></thead><tbody>`;
  if (!rows.length) h += '<tr><td colspan="12" class="muted">Không có dữ liệu.</td></tr>';
  rows.forEach((r) => {
    const stop = r.thangDung && (!d.ky || r.thangDung <= d.ky);
    h += `<tr class="${stop ? 'off' : ''}"><td>${esc(r.maNV)}</td><td><b>${esc(r.hoTen)}</b></td><td>${esc(r.maBHXH)}</td>
      <td>${esc(r.phongBan)}</td><td>${esc(r.chucDanh)}</td><td>${fmtD(r.ngayBHXH) || '<span class="warn-txt">Thiếu</span>'}</td>
      <td>${fmtM(r.thangDung)}</td><td class="num">${fmt(r.luongDong)}</td><td>${esc(r.maPL) || '<span class="warn-txt">Thiếu</span>'}</td>
      <td>${esc(r.congDoan)}</td><td class="small">${esc(r.emailQL)}</td>
      <td><div class="row"><button class="btn sm" onclick="nvForm('${esc(r.maNV)}')">${d.editable ? 'Sửa' : 'Xem'}</button>
      ${d.editable && isRole('Admin') ? `<button class="btn sm danger" onclick="nvDel('${esc(r.maNV)}')">Xóa</button>` : ''}</div></td></tr>`;
  });
  $('nvTbl').className = 'card';
  $('nvTbl').innerHTML = h + '</tbody></table></div>';
}
async function nvForm(maNV) {
  if (isRole('Admin') && !S.pq.length) {
    try { busy(true); S.pq = await run('apiPhanQuyen'); } catch (e) { toast(e.message, 'err'); S.pq = []; } finally { busy(false); }
  }
  const d = S.nvData;
  const r = maNV ? d.rows.find((x) => x.maNV === maNV) : { congDoan: 'Không', emailQL: S.user.role === 'Nhập liệu' ? S.user.email : '' };
  const ro = !d.editable;
  const dis = ro ? 'disabled' : '';
  const plList = S.mapl.filter((m) => m.trangThai !== 'Ngừng áp dụng' || m.ma === r.maPL).map((m) => m.ma);
  const inp = (name, label, type, extra) => `<label class="${extra && extra.includes('req') ? '' : ''}"><span class="${extra && extra.includes('req') ? 'req' : ''}">${label}</span>
    <input name="${name}" type="${type || 'text'}" value="${esc(r[name] === 0 && type === 'number' ? '' : (r[name] ?? ''))}" ${dis} ${extra && extra.includes('ro') ? 'readonly' : ''} ${type === 'number' ? 'min="0" step="1" oninput="nvSum()"' : ''}></label>`;
  const money = (name, label, extra) => `<label class="${extra && extra.includes('req') ? '' : ''}"><span class="${extra && extra.includes('req') ? 'req' : ''}">${label}</span>
    <input name="${name}" type="text" inputmode="numeric" value="${moneyVal(r[name])}" ${dis} oninput="onMoneyInput(this);nvSum()"></label>`;
  const body = `<form id="nvF1" onsubmit="return false"><div class="form">
    ${inp('maNV', 'Mã NV', 'text', maNV ? 'req ro' : 'req')}
    ${inp('hoTen', 'Họ và tên', 'text', 'req')}
    ${inp('maBHXH', 'Mã số BHXH')}
    ${inp('ngaySinh', 'Ngày sinh', 'date')}
    <label>Đơn vị_Phòng ban<select name="phongBan" ${dis}>${opt(S.phongBan, r.phongBan || '', '— Chọn —')}</select></label>
    ${inp('chucDanh', 'Chức danh')}
    ${inp('ngayVao', 'Ngày vào làm', 'date')}
    ${inp('ngayBHXH', 'Ngày bắt đầu BHXH', 'date')}
    ${inp('ngayNghi', 'Ngày nghỉ việc', 'date')}
    ${inp('thangDung', 'Tháng dừng đóng (tháng đầu tiên KHÔNG đóng)', 'month')}
    ${money('luongChinh', 'Mức lương chính')}
    ${money('pcKN', 'PC Kiêm nhiệm')}
    ${money('pcCV', 'PC Chức vụ')}
    ${money('pcDH', 'PC Độc hại')}
    ${money('pcKhac', 'PC Khác')}
    <label>Lương đóng BHXH (tự tính)<input id="nvLD" readonly value="${fmt(r.luongDong)}"></label>
    <label><span class="req">Mã phân loại</span><select name="maPL" ${dis}>${opt(plList, r.maPL || '', '— Chọn —')}</select></label>
    <label>Tham gia công đoàn<select name="congDoan" ${dis}>${opt(['Có', 'Không'], r.congDoan || 'Không')}</select></label>
    <label>Email NV quản lý hồ sơ<select name="emailQL" ${dis} ${isRole('Admin') ? '' : 'disabled'}>${opt((S.pq || []).map((p) => p.email), r.emailQL || '', '— Không chọn —')}</select></label>
    <label class="full">Ghi chú<input name="ghiChu" value="${esc(r.ghiChu || '')}" ${dis}></label>
  </div></form>`;
  const foot = ro ? '<button class="btn" onclick="closeModal()">Đóng</button>'
    : `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="nvSave(${maNV ? 'false' : 'true'})">Lưu</button>`;
  openModal(maNV ? 'Nhân viên ' + maNV : 'Thêm nhân viên', body, foot);
}
function nvSum() {
  const o = formData('nvF1');
  const num = (s) => Number(String(s || '').replace(/[^\d]/g, '')) || 0;
  $('nvLD').value = fmt(['luongChinh', 'pcKN', 'pcCV', 'pcDH', 'pcKhac'].reduce((s, k) => s + num(o[k]), 0));
}
function nvSave(isNew) {
  const o = formData('nvF1');
  ['luongChinh', 'pcKN', 'pcCV', 'pcDH', 'pcKhac'].forEach((k) => { o[k] = Number(String(o[k] || '').replace(/[^\d-]/g, '')) || 0; });
  act(async () => { await run('apiSaveNV', S.nvData.ky, o, isNew); closeModal(); toast('Đã lưu nhân viên ' + o.maNV, 'ok'); loadNV(); });
}
function nvDel(maNV) {
  const where = S.nvData.ky ? 'khỏi kỳ ' + fmtM(S.nvData.ky) : 'khỏi hồ sơ gốc';
  if (!confirm(`Xóa NV ${maNV} ${where}?\n\nLưu ý: NV nghỉ việc nên nhập "Tháng dừng đóng" thay vì xóa, để báo cáo biến động ghi nhận giảm.`)) return;
  act(async () => { await run('apiDeleteNV', S.nvData.ky, maNV); toast('Đã xóa.', 'ok'); loadNV(); });
}

async function vTruyThu() {
  if (!S.kys.length) { V().innerHTML = '<h2>Truy thu – Thoái thu</h2><div class="alert info">Chưa có kỳ BHXH nào.</div>'; return; }
  if (!S.ttKy) S.ttKy = latestOpenKy();
  V().innerHTML = `<h2>Truy thu – Thoái thu</h2>
    <div class="card no-print"><div class="row"><select onchange="S.ttKy=this.value;loadTT()">${kyOpts(S.ttKy)}</select>
    <span class="spacer"></span><span id="ttAdd"></span></div>
    <div class="small muted" style="margin-top:8px">Dùng cho phát sinh của các tháng đã qua (đã chốt): truy đóng, điều chỉnh lương hồi tố, thoái thu.
    Số tiền = Σ theo từng tháng [tiền tính theo lương mới − tiền tính theo lương cũ], áp dụng tỉ lệ & mức trần của chính tháng đó.
    Truy đóng cho tháng chưa đóng: để Lương cũ = 0. Kết quả tách riêng <b>BHXH NLĐ</b> (không gồm đoàn phí), <b>BHXH DN</b> (không gồm kinh phí CĐ),
    <b>Đoàn phí Công đoàn</b> và <b>Kinh phí Công đoàn</b> (2 khoản CĐ được tách tiếp thành Giữ lại cơ sở / Nộp Công đoàn Việt Nam theo đúng tỉ lệ có hiệu lực từng tháng) vì các khoản này hạch toán chi trả khác nhau.</div></div>
    <div id="ttTbl" class="card muted">Đang tải…</div>`;
  loadTT();
}
async function loadTT() {
  try { S.ttData = await run('apiTruyThu', S.ttKy); } catch (e) { $('ttTbl').innerHTML = ''; return; }
  const d = S.ttData;
  $('ttAdd').innerHTML = d.editable ? '<button class="btn pri" onclick="ttForm(null)">＋ Thêm dòng</button>' : kyBadge(d.trangThai);
  const sum = (f) => d.rows.reduce((s, r) => s + (Number(f(r)) || 0), 0);

function vBaoCao() {
  if (!S.rpKy) S.rpKy = latestKy();

  V().innerHTML = `<h2>Báo cáo</h2><div class="tabs">${tab('chitiet', 'Bảng tính nộp BHXH')}${tab('chiphi', 'Báo cáo chi phí')}${tab('biendong', 'Biến động tăng/giảm')}${tab('tonghop', 'Tổng hợp')}${tab('congdoan', 'Công đoàn')}${tab('nhansu', 'Theo nhân sự')}</div>

      <span class="spacer"></span>${exp(S.rpTab, S.rpTuKy + '|' + S.rpDenKy)}</div>`;

      ${showFilter ? `<input id="rpQ" placeholder="Tìm mã NV, họ tên…" style="min-width:220px" oninput="rpRefilter()">

      <span class="spacer"></span>${exp(S.rpTab, S.rpKy)}</div>`;

async function rpNhanSu() {
  $('rpBody').innerHTML = '<div class="card muted">Đang tải…</div>';
  let d;
  try { d = await run('apiLichSuNhanSu', S.rpTuKy, S.rpDenKy); } catch (e) { $('rpBody').innerHTML = ''; return; }
  S.rpNSData = d; S.rpTuKy = d.tuKy; S.rpDenKy = d.denKy;
  const tk = $('rpTuKy'), dk = $('rpDenKy');
  if (tk) tk.value = d.tuKy; if (dk) dk.value = d.denKy;
  renderNhanSu();
}
function renderNhanSu() {
  const d = S.rpNSData; if (!d) return;
  if (!d.rows.length) {
    $('rpBody').innerHTML = '<div class="alert warn">Không có dữ liệu đã tính trong khoảng thời gian đã chọn.</div>';
    return;
  }
  const q = ($('rpQ') ? $('rpQ').value : '').toLowerCase().trim();
  const pl = $('rpPL') ? $('rpPL').value : '';
  const tnTu = $('rpTnTu') && $('rpTnTu').value !== '' ? Number($('rpTnTu').value) : null;
  const tnDen = $('rpTnDen') && $('rpTnDen').value !== '' ? Number($('rpTnDen').value) : null;
  let rows = d.rows.filter((nv) => (!q || [nv.maNV, nv.hoTen, nv.maBHXH].join(' ').toLowerCase().includes(q))
    && (!pl || nv.periods.some((p) => p.maPL === pl))
    && (tnTu === null || (nv.thamNienNam !== null && nv.thamNienNam >= tnTu))
    && (tnDen === null || (nv.thamNienNam !== null && nv.thamNienNam <= tnDen)));
  let h = `<div class="stats">
    <div class="stat"><div class="lbl">Khoảng thời gian</div><div class="val">${fmtM(d.tuKy)} – ${fmtM(d.denKy)}</div></div>
    <div class="stat"><div class="lbl">Số nhân sự</div><div class="val">${rows.length}<span class="muted small"> / ${d.rows.length}</span></div></div>
    <div class="stat"><div class="lbl">Đang làm việc</div><div class="val">${rows.filter((nv) => nv.dangLam).length}</div></div>
    <div class="stat"><div class="lbl">Đã dừng đóng</div><div class="val">${rows.filter((nv) => !nv.dangLam).length}</div></div></div>
    <div class="card no-print"><div class="row"><span class="small muted">Lọc theo thâm niên (năm, có thể để số thập phân, ví dụ 0.5 = 6 tháng):</span>
      <label class="small">Từ <input type="number" step="0.5" id="rpTnTu" style="width:80px" value="${tnTu === null ? '' : tnTu}" oninput="rpRefilter()"></label>
      <label class="small">Đến <input type="number" step="0.5" id="rpTnDen" style="width:80px" value="${tnDen === null ? '' : tnDen}" oninput="rpRefilter()"></label></div></div>`;
  const totalCols = 10;
  const head = `<tr><th>Kỳ</th><th>Chức danh</th><th>Phòng ban</th><th>Mã PL</th><th>Đóng</th><th class="num">Lương đóng</th>
    <th class="num">Tổng NLĐ</th><th class="num">Tổng DN</th><th class="num">Tổng cộng</th><th>Cảnh báo</th></tr>`;
  let body = '';
  rows.forEach((nv) => {
    const tn = nv.thamNien;
    body += `<tr class="group"><td colspan="${totalCols}">${esc(nv.maNV)} – ${esc(nv.hoTen)}
      <span class="muted small">Vào làm ${fmtD(nv.ngayVao)}</span>
      · Thâm niên: <b>${tn ? tn.years + ' năm ' + tn.months + ' tháng ' + tn.days + ' ngày' : 'Chưa rõ ngày vào làm'}</b>
      ${nv.dangLam ? '' : ' <span class="badge bad">Đã dừng đóng</span>'}</td></tr>`;
    nv.periods.forEach((p) => {
      body += `<tr class="${p.dong === 'Có' ? '' : 'off'}"><td>${fmtM(p.ky)}</td><td>${esc(p.chucDanh)}</td><td>${esc(p.phongBan)}</td>
        <td>${esc(p.maPL)}</td><td>${esc(p.dong)}</td>
        <td class="num">${fmt(p.luongDong)}</td><td class="num">${fmt(p.tongNLD)}</td><td class="num">${fmt(p.tongDN)}</td>
        <td class="num"><b>${fmt(p.tongCong)}</b></td><td class="warn-txt">${esc(p.canhBao)}</td></tr>`;
    });
  });
  h += `<div class="card"><div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
  $('rpBody').innerHTML = h;
}

  let h = `<div class="card"><div class="row between" style="margin-bottom:10px"><div class="small muted">
    Mỗi khoản có thể có nhiều dòng (phiên bản) cùng Mã nhận diện với Ngày hiệu lực khác nhau. Mỗi tháng app tự dùng phiên bản có ngày hiệu lực gần nhất ≤ cuối tháng.
    <br><b>Mức lương đóng tối đa</b>: lương vượt mức thì lấy mức này × tỉ lệ. <b>Mức đóng tối đa</b>: số tiền (lương × tỉ lệ) vượt mức thì lấy mức này.</div>
    ${admin ? '<button class="btn pri" onclick="khoanForm(null,\'new\')">＋ Thêm khoản</button>' : ''}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Mã nhận diện</th><th>Tên khoản</th><th>Đối tượng</th><th class="num">Tỉ lệ (%)</th><th>Mức trần</th>
    <th class="num">Mức tối đa</th><th>Ngày hiệu lực</th><th>Trạng thái</th><th>Chỉ đoàn viên CĐ</th><th>Thuộc quỹ CĐ</th><th>Ghi chú</th><th></th></tr></thead><tbody>`;
  rows.forEach((k) => {
    const cur = hieuLucHienTai(k.ma) === k;
    h += `<tr class="${k.trangThai === 'Ngừng áp dụng' ? 'off' : ''}"><td><b>${esc(k.ma)}</b> ${cur ? '<span class="badge open">Hiện hành</span>' : ''}</td>
      <td>${esc(k.ten)}</td><td>${esc(k.doiTuong)}</td><td class="num">${fmtPct(k.tiLe)}</td><td>${esc(k.loaiTran)}</td>
      <td class="num">${k.loaiTran === 'Không áp dụng' ? '' : fmt(k.mucToiDa)}</td><td>${fmtD(k.ngayHL)}</td><td>${esc(k.trangThai)}</td>
      <td>${esc(k.chiDoanVien)}</td><td>${k.thuocCD === 'Có' ? '<span class="badge info">Có</span>' : ''}</td><td class="small">${esc(k.ghiChu)}</td>
      <td>${admin ? `<div class="row"><button class="btn sm" onclick="khoanForm(${k._row},'edit')">Sửa</button>
        <button class="btn sm" onclick="khoanForm(${k._row},'version')" title="Tạo phiên bản mới với ngày hiệu lực mới">Phiên bản mới</button>
        <button class="btn sm danger" onclick="khoanDel(${k._row})">Xóa</button></div>` : ''}</td></tr>`;
  });
  $('setBody').innerHTML = h + '</tbody></table></div></div>';
}
function khoanForm(row, mode) {
  const k = row ? Object.assign({}, S.khoan.find((x) => x._row === row)) : { doiTuong: 'NLĐ', loaiTran: 'Không áp dụng', trangThai: 'Đang áp dụng', chiDoanVien: 'Không' };
  if (mode === 'version') { delete k._row; k.ngayHL = ''; }
  const L = S.lists;
  const lockMa = mode !== 'new';
  const body = `<form id="khF" onsubmit="return false"><input type="hidden" name="_row" value="${mode === 'edit' ? row : ''}"><div class="form">
    <label><span class="req">Tên khoản trích đóng</span><input name="ten" value="${esc(k.ten || '')}"></label>
    <label><span class="req">Mã nhận diện</span><input name="ma" value="${esc(k.ma || '')}" ${lockMa ? 'readonly' : ''} placeholder="VD: BHXH_NLD"></label>
    <label><span class="req">Đối tượng áp dụng</span><select name="doiTuong" ${lockMa ? 'disabled' : ''}>${opt(L.doiTuong, k.doiTuong)}</select></label>
    <label><span class="req">Tỉ lệ trích đóng mặc định (%)</span><input name="tiLe" type="number" step="any" value="${k.tiLe ?? ''}"></label>
    <label>Mức trần<select name="loaiTran">${opt(L.loaiTran, k.loaiTran)}</select></label>
    <label>Mức tối đa (đồng)<input name="mucToiDa" type="text" inputmode="numeric" value="${moneyVal(k.mucToiDa)}" oninput="onMoneyInput(this)"></label>
    <label><span class="req">Ngày hiệu lực</span><input name="ngayHL" type="date" value="${esc(k.ngayHL || '')}"></label>
    <label>Trạng thái<select name="trangThai">${opt(L.trangThai, k.trangThai)}</select></label>
    <label>Chỉ áp dụng đoàn viên công đoàn<select name="chiDoanVien">${opt(L.coKhong, k.chiDoanVien || 'Không')}</select></label>
    <label>Thuộc quỹ Công đoàn<select name="thuocCD">${opt(L.coKhong, k.thuocCD || 'Không')}</select></label>
    <label class="full">Ghi chú<input name="ghiChu" value="${esc(k.ghiChu || '')}"></label></div></form>
    <div class="alert info" style="margin-top:12px">${mode === 'version'
      ? 'Phiên bản mới giữ nguyên phiên bản cũ để tính lại các tháng trước (truy thu). Để ngừng khoản từ một ngày, tạo phiên bản mới với Trạng thái "Ngừng áp dụng".<br>'
      : ''}"Thuộc quỹ Công đoàn": tick cho khoản đoàn phí (NLĐ) và kinh phí công đoàn (DN) – dùng để tính bảng phân tách Công đoàn ở mục Báo cáo.</div>`;
  openModal(mode === 'new' ? 'Thêm khoản trích đóng' : mode === 'version' ? 'Phiên bản mới – ' + k.ma : 'Sửa khoản ' + k.ma, body,
    `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="khoanSave()">Lưu</button>`);
}
function khoanSave() {
  const f = $('khF');
  const o = formData('khF');
  o.doiTuong = f.doiTuong.value;
  o._row = o._row ? Number(o._row) : '';
  o.mucToiDa = Number(String(o.mucToiDa || '').replace(/[^\d-]/g, '')) || 0;
  act(async () => { S.khoan = await run('apiSaveKhoan', o); closeModal(); toast('Đã lưu khoản trích.', 'ok'); setKhoan(); });
}
function khoanDel(row) {
  const k = S.khoan.find((x) => x._row === row);
  if (!confirm(`Xóa dòng ${k.ma} (hiệu lực ${fmtD(k.ngayHL)})?\nNếu muốn ngừng áp dụng, nên tạo phiên bản mới với trạng thái "Ngừng áp dụng".`)) return;
  act(async () => { S.khoan = await run('apiDeleteKhoan', row); toast('Đã xóa.', 'ok'); setKhoan(); });
}
function setMaPL() {
  const admin = isRole('Admin');
  const ten = {};
  S.khoan.forEach((k) => { ten[k.ma] = k.ten; });
  const show = (s) => String(s || '').split(';').map((x) => x.trim()).filter(Boolean)
    .map((x) => { const p = x.split('='); return `<span class="badge info" title="${esc(ten[p[0]] || '')}">${esc(p[0])}${p[1] ? ' ' + esc(p[1]) + '%' : ''}</span>`; }).join(' ');
  let h = `<div class="card"><div class="row between" style="margin-bottom:10px"><div class="small muted">Mỗi mã phân loại quy định NV thuộc mã đó phải đóng những khoản nào.
    Tỉ lệ ghi bên cạnh (nếu có) là tỉ lệ riêng, thay cho tỉ lệ mặc định.</div>
    ${admin ? '<button class="btn pri" onclick="maplForm(null)">＋ Thêm mã</button>' : ''}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Mã phân loại</th><th>Mô tả</th><th>Trạng thái</th><th>Khoản NLĐ</th><th>Khoản DN</th><th>Ghi chú</th><th></th></tr></thead><tbody>
    ${S.mapl.map((m) => `<tr class="${m.trangThai === 'Ngừng áp dụng' ? 'off' : ''}"><td><b>${esc(m.ma)}</b></td><td>${esc(m.moTa)}</td><td>${esc(m.trangThai)}</td>
      <td>${show(m.khoanNLD)}</td><td>${show(m.khoanDN)}</td><td class="small">${esc(m.ghiChu)}</td>
      <td>${admin ? `<div class="row"><button class="btn sm" onclick="maplForm('${esc(m.ma)}')">Sửa</button>
        <button class="btn sm danger" onclick="maplDel('${esc(m.ma)}')">Xóa</button></div>` : ''}</td></tr>`).join('')
      || '<tr><td colspan="7" class="muted">Chưa có mã phân loại.</td></tr>'}</tbody></table></div></div>`;
  $('setBody').innerHTML = h;
}
function maplForm(ma) {
  const m = ma ? S.mapl.find((x) => x.ma === ma) : { trangThai: 'Đang áp dụng' };
  const sel = {};
  (String(m.khoanNLD || '') + ';' + String(m.khoanDN || '')).split(';').map((x) => x.trim()).filter(Boolean)
    .forEach((x) => { const p = x.split('='); sel[p[0].trim()] = p[1] !== undefined ? p[1].trim() : ''; });
  const codes = [...new Set(S.khoan.map((k) => k.ma))];
  const list = (dt) => codes.map((c) => hieuLucHienTai(c) || S.khoan.find((k) => k.ma === c)).filter((k) => k.doiTuong === dt)
    .map((k) => `<div class="chk-item"><input type="checkbox" data-ma="${esc(k.ma)}" ${k.ma in sel ? 'checked' : ''}>
      <div><b>${esc(k.ma)}</b> <span class="muted small">${esc(k.ten)} · mặc định ${fmtPct(k.tiLe)}%${k.chiDoanVien === 'Có' ? ' · chỉ đoàn viên' : ''}</span></div>
      <input type="number" step="any" placeholder="Tỉ lệ riêng %" data-rate="${esc(k.ma)}" value="${esc(sel[k.ma] || '')}"></div>`).join('')
    || '<div class="muted small">Chưa có khoản nào.</div>';
  const body = `<form id="plF" onsubmit="return false"><div class="form">
    <label><span class="req">Mã phân loại</span><input name="ma" value="${esc(m.ma || '')}" ${ma ? 'readonly' : ''}></label>
    <label>Mô tả<input name="moTa" value="${esc(m.moTa || '')}"></label>
    <label>Trạng thái<select name="trangThai">${opt(S.lists.trangThai, m.trangThai)}</select></label>
    <label>Ghi chú<input name="ghiChu" value="${esc(m.ghiChu || '')}"></label></div>
    <p class="small muted">Tick các khoản áp dụng. Để trống ô "Tỉ lệ riêng" để dùng tỉ lệ mặc định.</p>
    <div class="chk-grid"><div><h3>Người lao động (NLĐ)</h3><div class="chk-list">${list('NLĐ')}</div></div>
    <div><h3>Doanh nghiệp (DN)</h3><div class="chk-list">${list('DN')}</div></div></div></form>`;
  openModal(ma ? 'Sửa mã phân loại ' + ma : 'Thêm mã phân loại', body,
    `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="maplSave(${ma ? 'false' : 'true'})">Lưu</button>`);
}
function maplSave(isNew) {
  const o = formData('plF');
  o.ds = [];
  $('plF').querySelectorAll('input[data-ma]').forEach((c) => {
    if (!c.checked) return;
    const r = $('plF').querySelector(`input[data-rate="${c.dataset.ma}"]`).value;
    o.ds.push({ ma: c.dataset.ma, tiLe: r === '' ? null : Number(r) });
  });
  act(async () => { S.mapl = await run('apiSaveMaPL', o, isNew); closeModal(); toast('Đã lưu mã phân loại.', 'ok'); setMaPL(); });
}
function maplDel(ma) {
  if (!confirm('Xóa mã phân loại ' + ma + '?')) return;
  act(async () => { S.mapl = await run('apiDeleteMaPL', ma); toast('Đã xóa.', 'ok'); setMaPL(); });
}
async function setPQ() {
  $('setBody').innerHTML = '<div class="card muted">Đang tải…</div>';
  try { S.pq = await run('apiPhanQuyen'); } catch (e) { return; }
  renderPQ();
}
function renderPQ() {
  $('setBody').innerHTML = `<div class="card"><div class="row between" style="margin-bottom:10px"><div class="small muted">
    <b>Admin</b>: thiết lập, tạo/chốt kỳ, toàn quyền. <b>Nhập liệu</b>: sửa hồ sơ NV có "Email NV quản lý hồ sơ" = email của mình, tính kỳ, nhập truy thu.
    <b>Xem</b>: chỉ xem toàn bộ dữ liệu & báo cáo (Kế toán, Ban Giám đốc).</div>
    <button class="btn pri" onclick="pqForm(null)">＋ Thêm người dùng</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead><tbody>
    ${S.pq.map((p) => `<tr class="${p.trangThai === 'Khóa' ? 'off' : ''}"><td>${esc(p.email)}</td><td>${esc(p.hoTen)}</td>
      <td><span class="badge info">${esc(p.vaiTro)}</span></td><td>${esc(p.trangThai)}</td><td class="small">${esc(p.ghiChu)}</td>
      <td><div class="row"><button class="btn sm" onclick="pqForm('${esc(p.email)}')">Sửa</button>
      <button class="btn sm danger" onclick="pqDel('${esc(p.email)}')">Xóa</button></div></td></tr>`).join('')}</tbody></table></div></div>`;
}
function pqForm(email) {
  const p = email ? S.pq.find((x) => x.email === email) : { vaiTro: 'Nhập liệu', trangThai: 'Hoạt động' };
  openModal(email ? 'Sửa quyền' : 'Thêm người dùng', `<form id="pqF" onsubmit="return false"><div class="form">
    <label><span class="req">Email Google</span><input name="email" type="email" value="${esc(p.email || '')}" ${email ? 'readonly' : ''}></label>
    <label>Họ tên<input name="hoTen" value="${esc(p.hoTen || '')}"></label>
    <label>Vai trò<select name="vaiTro">${opt(S.lists.role, p.vaiTro)}</select></label>
    <label>Trạng thái<select name="trangThai">${opt(S.lists.pqTrangThai, p.trangThai)}</select></label>
    <label class="full">Ghi chú<input name="ghiChu" value="${esc(p.ghiChu || '')}"></label></div></form>`,
    `<button class="btn" onclick="closeModal()">Hủy</button><button class="btn pri" onclick="pqSave()">Lưu</button>`);
}
function pqSave() {
  act(async () => { S.pq = await run('apiSavePQ', formData('pqF')); closeModal(); toast('Đã lưu phân quyền.', 'ok'); renderPQ(); });
}
function pqDel(email) {
  if (!confirm('Xóa quyền của ' + email + '?')) return;
  act(async () => { S.pq = await run('apiDeletePQ', email); toast('Đã xóa.', 'ok'); renderPQ(); });
}

// NHẬT KÝ
// =====================================================================
async function vNhatKy() {
  V().innerHTML = '<h2>Nhật ký thao tác</h2><div class="card muted">Đang tải…</div>';
  let rows;
  try { rows = await run('apiNhatKy'); } catch (e) { return; }
  V().innerHTML = `<h2>Nhật ký thao tác</h2><div class="card"><p class="small muted">500 thao tác gần nhất.</p><div class="tbl-wrap"><table>
    <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Chi tiết</th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td class="small">${esc(r.thoiGian)}</td><td class="small">${esc(r.email)}</td><td>${esc(r.hanhDong)}</td>
      <td class="small">${esc(r.chiTiet)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Chưa có.</td></tr>'}</tbody></table></div></div>`;
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
boot();
</script>
